<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Car Crash Detection</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family:
        "Google Sans",
        "Segoe UI",
        Arial,
        sans-serif;
    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

#app {
    width: 100%;
    max-width: 520px;
    height: 100%;
    padding: 30px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;
}

.logo {
    width: 90px;
    height: 90px;

    border-radius: 50%;

    background: #202124;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 45px;

    margin-bottom: 30px;
}

h1 {
    margin: 0;

    font-size: 34px;
    font-weight: 700;
}

.description {
    margin-top: 15px;

    color: #aaa;

    font-size: 18px;
    line-height: 1.5;

    max-width: 400px;
}

button {
    border: none;

    border-radius: 30px;

    padding: 16px 30px;

    font-size: 18px;
    font-weight: 700;

    cursor: pointer;

    margin-top: 25px;

    background: #fff;
    color: #000;
}

button:active {
    transform: scale(.97);
}

button:disabled {
    opacity: .5;
}

#status {
    margin-top: 20px;

    color: #888;

    font-size: 16px;
}

#debug {
    position: fixed;

    left: 10px;
    right: 10px;
    bottom: 10px;

    text-align: center;

    color: #444;

    font-size: 11px;
}


/* ==============================
   CRASH SCREEN
============================== */

#crashScreen {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 100;

    background: #000;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 30px;
}

.crashContent {
    width: 100%;
    max-width: 450px;
}

.warning {
    font-size: 70px;

    margin-bottom: 25px;
}

.crashTitle {
    font-size: 38px;

    font-weight: 700;

    line-height: 1.15;

    margin-bottom: 20px;
}

.crashText {
    font-size: 19px;

    color: #ddd;

    line-height: 1.5;
}

#countdown {
    font-size: 64px;

    font-weight: 700;

    margin: 25px 0;
}

#cancelButton {
    display: inline-block;

    background: #303134;
    color: #fff;

    margin-right: 8px;
}

#emergencyButton {
    display: inline-block;

    background: #fff;
    color: #000;

    margin-left: 8px;
}

#beepStatus {
    margin-top: 15px;

    color: #999;

    font-size: 14px;
}
</style>
</head>


<body>


<!-- =================================
     MAIN SCREEN
================================= -->

<div id="app">

    <div class="logo">
        🚗
    </div>

    <h1>
        Car Crash Detection
    </h1>

    <div class="description">
        Motion sensors can monitor the movement
        of this device and detect a possible
        sudden impact.
    </div>

    <button id="startButton">
        Start detection
    </button>

    <div id="status">
        Detection is off
    </div>

</div>


<!-- =================================
     CRASH SCREEN
================================= -->

<div id="crashScreen">

    <div class="crashContent">

        <div class="warning">
            ⚠️
        </div>

        <div class="crashTitle">
            Car crash detected
        </div>

        <div class="crashText">
            We've detected a possible crash.
            Stay calm.
            <br>
            Say <b>emergency</b> or <b>cancel</b>.
        </div>

        <div id="countdown">
            10
        </div>

        <button id="cancelButton">
            Cancel
        </button>

        <button id="emergencyButton">
            Emergency
        </button>

        <div id="beepStatus">
            Waiting for response...
        </div>

    </div>

</div>


<div id="debug">
    Waiting for sensors...
</div>



<script>


/* =================================
   VARIABLES
================================= */

let detecting = false;

let crashDetected = false;

let movementDetected = false;

let lastAcceleration = 0;

let impactThreshold = 25;

let stillThreshold = 2;

let countdown = 10;

let countdownTimer = null;

let beepTimer = null;

let audioContext = null;

let recognition = null;


/* =================================
   ELEMENTS
================================= */

const startButton =
    document.getElementById("startButton");

const status =
    document.getElementById("status");

const debug =
    document.getElementById("debug");

const crashScreen =
    document.getElementById("crashScreen");

const countdownElement =
    document.getElementById("countdown");

const cancelButton =
    document.getElementById("cancelButton");

const emergencyButton =
    document.getElementById("emergencyButton");

const beepStatus =
    document.getElementById("beepStatus");


/* =================================
   SPEECH
================================= */

function speak(text) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    speechSynthesis.cancel();

    const voice =
        new SpeechSynthesisUtterance(text);

    voice.lang = "en-US";

    voice.rate = 0.9;

    voice.pitch = 1;

    speechSynthesis.speak(voice);
}


/* =================================
   MICROPHONE PERMISSION
================================= */

async function requestMicrophone() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        status.textContent =
            "Microphone API is not available.";

        return false;
    }

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });

        /*
         * We only needed the permission.
         * Speech recognition will use the microphone later.
         */

        stream
            .getTracks()
            .forEach(track => track.stop());

        return true;

    } catch (error) {

        console.log(error);

        status.textContent =
            "Microphone permission denied.";

        return false;
    }
}


/* =================================
   MOTION PERMISSION
================================= */

async function requestMotionPermission() {

    try {

        /*
         * iPhone / iPad require an explicit
         * permission request.
         */

        if (
            typeof DeviceMotionEvent !== "undefined" &&
            typeof DeviceMotionEvent.requestPermission ===
                "function"
        ) {

            const permission =
                await DeviceMotionEvent.requestPermission();

            if (permission !== "granted") {

                status.textContent =
                    "Motion permission denied.";

                return false;
            }
        }

        return true;

    } catch (error) {

        console.log(error);

        status.textContent =
            "Motion permission denied.";

        return false;
    }
}


/* =================================
   START DETECTION
================================= */

startButton.addEventListener(
    "click",
    async () => {

        startButton.disabled = true;

        status.textContent =
            "Requesting microphone permission...";

        const microphoneOK =
            await requestMicrophone();

        if (!microphoneOK) {

            startButton.disabled = false;

            return;
        }


        status.textContent =
            "Requesting motion sensor permission...";


        const motionOK =
            await requestMotionPermission();


        if (!motionOK) {

            startButton.disabled = false;

            return;
        }


        /*
         * Create audio context after user interaction.
         * This allows the beep to work on mobile browsers.
         */

        try {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        } catch (error) {

            console.log(
                "AudioContext unavailable."
            );
        }


        detecting = true;

        movementDetected = false;

        crashDetected = false;


        window.addEventListener(
            "devicemotion",
            handleMotion,
            true
        );


        startButton.style.display =
            "none";


        status.textContent =
            "Crash detection is active";

        debug.textContent =
            "Monitoring movement...";


        speak(
            "Car crash detection is now active."
        );

    }
);


/* =================================
   MOTION SENSOR
================================= */

function handleMotion(event) {

    if (!detecting || crashDetected) {
        return;
    }


    const acceleration =
        event.accelerationIncludingGravity;


    if (!acceleration) {
        return;
    }


    const x =
        acceleration.x || 0;

    const y =
        acceleration.y || 0;

    const z =
        acceleration.z || 0;


    /*
     * Calculate total acceleration.
     */

    const magnitude =
        Math.sqrt(
            x * x +
            y * y +
            z * z
        );


    lastAcceleration =
        magnitude;


    debug.textContent =
        "Motion: " +
        magnitude.toFixed(1) +
        " m/s²";


    /*
     * Device is moving.
     */

    if (magnitude > stillThreshold) {

        movementDetected = true;

    }


    /*
     * Possible sudden impact.
     */

    if (
        movementDetected &&
        magnitude >= impactThreshold
    ) {

        detectPossibleCrash();

    }

}


/* =================================
   POSSIBLE CRASH
================================= */

function detectPossibleCrash() {

    if (crashDetected) {
        return;
    }


    crashDetected = true;


    status.textContent =
        "Possible impact detected";


    debug.textContent =
        "Impact detected — checking stillness...";


    /*
     * Give the device a moment after
     * the impact before checking whether
     * it becomes still.
     */

    setTimeout(
        startStillnessCheck,
        1500
    );

}


/* =================================
   STILLNESS CHECK
================================= */

function startStillnessCheck() {

    let stillStart = null;


    function check() {

        if (!crashDetected) {
            return;
        }


        if (
            lastAcceleration <=
            stillThreshold
        ) {

            if (stillStart === null) {

                stillStart =
                    Date.now();

            }


            const stillTime =
                Date.now() -
                stillStart;


            debug.textContent =
                "Device still for " +
                Math.floor(
                    stillTime / 1000
                ) +
                " seconds";


            /*
             * Five seconds of stillness.
             */

            if (stillTime >= 5000) {

                showCrashAlert();

                return;
            }


        } else {

            stillStart = null;


            debug.textContent =
                "Movement detected after impact.";

        }


        requestAnimationFrame(check);

    }


    check();

}


/* =================================
   SHOW CRASH ALERT
================================= */

function showCrashAlert() {

    crashScreen.style.display =
        "flex";


    countdown = 10;


    countdownElement.textContent =
        countdown;


    beepStatus.textContent =
        "Waiting for response...";


    speak(
        "Car crash detected. " +
        "Say emergency to confirm, " +
        "or say cancel."
    );


    startBeeping();

    startCountdown();

    startVoiceRecognition();

}


/* =================================
   BEEP SOUND
================================= */

function makeBeep() {

    if (!audioContext) {
        return;
    }


    try {

        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();

        }


        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.value =
            880;


        gain.gain.value =
            0.15;


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.start();


        oscillator.stop(
            audioContext.currentTime +
            0.15
        );

    } catch (error) {

        console.log(error);

    }

}


/* =================================
   START BEEPING
================================= */

function startBeeping() {

    stopBeeping();


    /*
     * First beep immediately.
     */

    makeBeep();


    /*
     * Then beep every second.
     */

    beepTimer =
        setInterval(
            () => {

                makeBeep();

            },
            1000
        );

}


/* =================================
   STOP BEEPING
================================= */

function stopBeeping() {

    if (beepTimer !== null) {

        clearInterval(
            beepTimer
        );

        beepTimer = null;

    }

}


/* =================================
   COUNTDOWN
================================= */

function startCountdown() {

    clearInterval(
        countdownTimer
    );


    countdownTimer =
        setInterval(
            () => {

                countdown--;


                countdownElement.textContent =
                    countdown;


                if (countdown <= 0) {

                    clearInterval(
                        countdownTimer
                    );


                    stopBeeping();


                    countdownElement.textContent =
                        "—";


                    beepStatus.textContent =
                        "Alarm ended.";


                    speak(
                        "The emergency alarm has ended."
                    );

                }

            },
            1000
        );

}


/* =================================
   CANCEL
================================= */

function cancelCrash() {

    clearInterval(
        countdownTimer
    );


    stopBeeping();


    if (recognition) {

        try {

            recognition.stop();

        } catch (error) {}

    }


    crashDetected = false;

    movementDetected = false;


    crashScreen.style.display =
        "none";


    status.textContent =
        "Crash detection is active";


    debug.textContent =
        "Monitoring movement...";


    speak(
        "Cancelled."
    );

}


/* =================================
   VOICE RECOGNITION
================================= */

function startVoiceRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        beepStatus.textContent =
            "Voice recognition is not supported.";

        return;
    }


    try {

        recognition =
            new SpeechRecognition();


        recognition.lang =
            "en-US";


        recognition.continuous =
            true;


        recognition.interimResults =
            false;


        recognition.onresult =
            function(event) {

                const last =
                    event.results[
                        event.results.length - 1
                    ];


                const text =
                    last[0]
                        .transcript
                        .toLowerCase();


                console.log(
                    "Heard:",
                    text
                );


                /*
                 * CANCEL
                 */

                if (
                    text.includes("cancel") ||
                    text.includes("cancelled") ||
                    text.includes("canceled")
                ) {

                    cancelCrash();

                    return;
                }


                /*
                 * EMERGENCY
                 */

                if (
                    text.includes("emergency")
                ) {

                    confirmEmergency();

                }

            };


        recognition.onerror =
            function(event) {

                console.log(
                    "Speech recognition:",
                    event.error
                );

            };


        recognition.onend =
            function() {

                /*
                 * Keep listening while the
                 * crash screen is active.
                 */

                if (crashDetected) {

                    try {

                        recognition.start();

                    } catch (error) {}

                }

            };


        recognition.start();


    } catch (error) {

        console.log(error);

    }

}


/* =================================
   EMERGENCY CONFIRMATION
================================= */

function confirmEmergency() {

    clearInterval(
        countdownTimer
    );


    stopBeeping();


    countdownElement.textContent =
        "✓";


    beepStatus.textContent =
        "Emergency confirmed.";


    speak(
        "Emergency confirmed."
    );


    if (recognition) {

        try {

            recognition.stop();

        } catch (error) {}

    }

}


/* =================================
   EMERGENCY BUTTON
================================= */

emergencyButton.addEventListener(
    "click",
    () => {

        confirmEmergency();

    }
);


/* =================================
   CANCEL BUTTON
================================= */

cancelButton.addEventListener(
    "click",
    () => {

        cancelCrash();

    }
);

</script>

</body>
</html>
