
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Car Crash Detection</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: "Google Sans", "Segoe UI", Arial, sans-serif;
}

body {
    overflow: hidden;
}

/* =========================
   HOME
========================= */

#home {
    width: 100vw;
    height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;
    padding: 25px;
}

.car {
    width: 100px;
    height: 100px;

    border-radius: 50%;

    background: #202124;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 50px;

    margin-bottom: 25px;
}

h1 {
    margin: 0;

    font-size: 34px;
    font-weight: 700;
}

.info {
    max-width: 450px;

    color: #999;

    font-size: 17px;
    line-height: 1.5;

    margin: 15px 0 25px;
}

button {
    border: none;
    outline: none;

    border-radius: 999px;

    padding: 16px 30px;

    font-size: 17px;
    font-weight: 700;

    cursor: pointer;

    margin: 6px;

    background: #fff;
    color: #000;
}

button:active {
    transform: scale(.96);
}

#testButton {
    background: #292a2d;
    color: #fff;
}

#status {
    margin-top: 15px;

    color: #777;

    font-size: 15px;
}

#sensor {
    margin-top: 8px;

    color: #444;

    font-size: 12px;
}


/* =========================
   FULLSCREEN CRASH SCREEN
========================= */

#crashScreen {
    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    z-index: 9999;

    display: none;

    background:
        radial-gradient(
            circle at center,
            #210000 0%,
            #090000 42%,
            #000 75%
        );

    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 20px;
}


/* =========================
   TOP
========================= */

.crashIcon {
    font-size: 70px;

    margin-bottom: 15px;

    animation: warningPulse 1s infinite;
}

@keyframes warningPulse {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }

    100% {
        transform: scale(1);
    }

}


/* =========================
   TITLE
========================= */

.crashTitle {
    font-size: clamp(34px, 8vw, 58px);

    font-weight: 800;

    letter-spacing: -1px;

    margin-bottom: 12px;
}

.crashSubtitle {
    font-size: clamp(17px, 4vw, 22px);

    color: #ddd;

    max-width: 600px;

    line-height: 1.4;
}


/* =========================
   COUNTDOWN
========================= */

.countdownContainer {
    position: relative;

    width: min(270px, 65vw);
    height: min(270px, 65vw);

    margin: 30px 0;
}

.countdownSvg {
    width: 100%;
    height: 100%;

    transform: rotate(-90deg);
}

.countdownBackground {
    fill: none;

    stroke: #292929;

    stroke-width: 10;
}

.countdownProgress {
    fill: none;

    stroke: #fff;

    stroke-width: 10;

    stroke-linecap: round;

    stroke-dasharray: 691;

    stroke-dashoffset: 0;

    transition:
        stroke-dashoffset 1s linear;
}

.countdownNumber {
    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: clamp(70px, 17vw, 110px);

    font-weight: 800;
}


/* =========================
   MESSAGE
========================= */

#beepText {
    color: #aaa;

    font-size: 15px;

    min-height: 22px;

    margin-bottom: 8px;
}


/* =========================
   BUTTONS
========================= */

.crashButtons {
    display: flex;

    flex-wrap: wrap;

    align-items: center;
    justify-content: center;

    gap: 8px;

    max-width: 600px;
}

#cancelButton {
    min-width: 145px;

    background: #303134;

    color: #fff;
}

#emergencyButton {
    min-width: 145px;

    background: #fff;

    color: #000;
}


/* =========================
   CONFIRMED
========================= */

#confirmed {
    display: none;

    font-size: 22px;

    font-weight: 700;

    margin-top: 15px;
}


/* =========================
   SMALL DEVICES
========================= */

@media (max-height: 650px) {

    .crashIcon {
        font-size: 45px;
        margin-bottom: 5px;
    }

    .crashTitle {
        font-size: 32px;
    }

    .countdownContainer {
        width: 170px;
        height: 170px;

        margin: 15px 0;
    }

    .countdownNumber {
        font-size: 65px;
    }

}
</style>
</head>

<body>


<!-- =========================
     HOME
========================= -->

<div id="home">

    <div class="car">
        🚗
    </div>

    <h1>
        Car Crash Detection
    </h1>

    <div class="info">
        The device monitors movement and looks
        for a sudden impact followed by a period
        of very little movement.
    </div>

    <button id="startButton">
        Start detection
    </button>

    <button id="testButton">
        Test crash
    </button>

    <div id="status">
        Detection is off
    </div>

    <div id="sensor">
        Sensor: waiting...
    </div>

</div>


<!-- =========================
     FULLSCREEN CRASH
========================= -->

<div id="crashScreen">

    <div class="crashIcon">
        ⚠️
    </div>

    <div class="crashTitle">
        Car crash detected
    </div>

    <div class="crashSubtitle">
        We've detected a possible crash.
        <br>
        Say <b>emergency</b> or <b>cancel</b>.
    </div>


    <!-- COUNTDOWN -->

    <div class="countdownContainer">

        <svg
            class="countdownSvg"
            viewBox="0 0 250 250">

            <circle
                class="countdownBackground"
                cx="125"
                cy="125"
                r="110">
            </circle>

            <circle
                id="progress"
                class="countdownProgress"
                cx="125"
                cy="125"
                r="110">
            </circle>

        </svg>

        <div
            id="countdown"
            class="countdownNumber">
            10
        </div>

    </div>


    <div id="beepText">
        Beeping...
    </div>


    <!-- BUTTONS -->

    <div class="crashButtons">

        <button id="cancelButton">
            Cancel
        </button>

        <button id="emergencyButton">
            Emergency
        </button>

    </div>


    <div id="confirmed">
        ✓ Emergency confirmed
    </div>

</div>


<script>

/* ==================================================
   VARIABLES
================================================== */

let detectionActive = false;
let crashActive = false;

let moving = false;

let previousAcceleration = 0;
let currentAcceleration = 0;

let countdown = 10;

let countdownInterval = null;
let beepInterval = null;

let audioContext = null;

let recognition = null;

let lastMotionTime = Date.now();

const IMPACT_CHANGE = 12;
const STILL_LEVEL = 2.5;
const STILL_TIME = 4000;

const CIRCUMFERENCE = 691;


/* ==================================================
   ELEMENTS
================================================== */

const home =
    document.getElementById("home");

const startButton =
    document.getElementById("startButton");

const testButton =
    document.getElementById("testButton");

const status =
    document.getElementById("status");

const sensor =
    document.getElementById("sensor");

const crashScreen =
    document.getElementById("crashScreen");

const countdownElement =
    document.getElementById("countdown");

const progress =
    document.getElementById("progress");

const beepText =
    document.getElementById("beepText");

const cancelButton =
    document.getElementById("cancelButton");

const emergencyButton =
    document.getElementById("emergencyButton");

const confirmed =
    document.getElementById("confirmed");


/* ==================================================
   VOICE
================================================== */

function speak(text) {

    if (!window.speechSynthesis) {
        return;
    }

    speechSynthesis.cancel();

    const voice =
        new SpeechSynthesisUtterance(text);

    voice.lang = "en-US";

    voice.rate = 0.88;

    voice.pitch = 1;

    speechSynthesis.speak(voice);
}


/* ==================================================
   MICROPHONE
================================================== */

async function requestMicrophone() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        status.textContent =
            "Microphone is unavailable.";

        return false;
    }

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });

        stream
            .getTracks()
            .forEach(track => track.stop());

        return true;

    } catch (error) {

        console.log(error);

        status.textContent =
            "Microphone permission denied.";

        return false;
    }
}


/* ==================================================
   MOTION PERMISSION
================================================== */

async function requestMotion() {

    try {

        if (
            typeof DeviceMotionEvent !== "undefined" &&
            typeof DeviceMotionEvent.requestPermission ===
            "function"
        ) {

            const permission =
                await DeviceMotionEvent.requestPermission();

            if (permission !== "granted") {

                status.textContent =
                    "Motion permission denied.";

                return false;
            }
        }

        return true;

    } catch (error) {

        console.log(error);

        status.textContent =
            "Motion sensor unavailable.";

        return false;
    }
}


/* ==================================================
   START
================================================== */

startButton.addEventListener(
    "click",
    async () => {

        startButton.disabled = true;

        status.textContent =
            "Requesting microphone...";


        const mic =
            await requestMicrophone();


        if (!mic) {

            startButton.disabled = false;

            return;
        }


        status.textContent =
            "Requesting motion sensor...";


        const motion =
            await requestMotion();


        if (!motion) {

            startButton.disabled = false;

            return;
        }


        try {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        } catch (e) {

            console.log(e);

        }


        detectionActive = true;

        moving = false;

        crashActive = false;


        window.addEventListener(
            "devicemotion",
            handleMotion,
            true
        );


        startButton.style.display =
            "none";


        status.textContent =
            "🟢 Crash detection active";

        sensor.textContent =
            "Sensor: active";


        speak(
            "Car crash detection is active."
        );

    }
);


/* ==================================================
   MOTION
================================================== */

function handleMotion(event) {

    if (
        !detectionActive ||
        crashActive
    ) {
        return;
    }


    const a =
        event.acceleration;


    const g =
        event.accelerationIncludingGravity;


    let x = 0;
    let y = 0;
    let z = 0;


    if (a) {

        x = a.x || 0;
        y = a.y || 0;
        z = a.z || 0;

    } else if (g) {

        x = g.x || 0;
        y = g.y || 0;
        z = g.z || 0;

    } else {

        return;
    }


    currentAcceleration =
        Math.sqrt(
            x*x +
            y*y +
            z*z
        );


    const change =
        Math.abs(
            currentAcceleration -
            previousAcceleration
        );


    previousAcceleration =
        currentAcceleration;


    sensor.innerHTML =
        "Motion: " +
        currentAcceleration.toFixed(2) +
        " m/s²<br>" +
        "Change: " +
        change.toFixed(2);


    if (
        currentAcceleration >
        STILL_LEVEL
    ) {

        moving = true;

        lastMotionTime =
            Date.now();
    }


    if (
        moving &&
        change >= IMPACT_CHANGE
    ) {

        possibleCrash();

    }

}


/* ==================================================
   POSSIBLE CRASH
================================================== */

function possibleCrash() {

    if (crashActive) {
        return;
    }


    crashActive = true;


    status.textContent =
        "⚠️ Impact detected";


    sensor.textContent =
        "Checking for stillness...";


    /*
       Give the device a short moment
       after the impact.
    */

    setTimeout(
        checkStillness,
        1000
    );

}


/* ==================================================
   STILLNESS
================================================== */

function checkStillness() {

    if (!crashActive) {
        return;
    }


    let stillStart =
        Date.now();


    function loop() {

        if (!crashActive) {
            return;
        }


        if (
            currentAcceleration <=
            STILL_LEVEL
        ) {

            const elapsed =
                Date.now() -
                stillStart;


            sensor.textContent =
                "Still: " +
                Math.floor(
                    elapsed / 1000
                ) +
                "s";


            if (
                elapsed >=
                STILL_TIME
            ) {

                showCrashScreen();

                return;
            }

        } else {

            stillStart =
                Date.now();

        }


        requestAnimationFrame(loop);

    }


    loop();

}


/* ==================================================
   SHOW CRASH SCREEN
================================================== */

function showCrashScreen() {

    crashScreen.style.display =
        "flex";


    countdown = 10;


    countdownElement.textContent =
        countdown;


    progress.style.strokeDashoffset =
        "0";


    confirmed.style.display =
        "none";


    beepText.textContent =
        "Beeping...";


    speak(
        "Car crash detected. " +
        "Say emergency or cancel."
    );


    startBeeping();

    startCountdown();

    startVoiceRecognition();

}


/* ==================================================
   BEEP
================================================== */

function beep() {

    if (!audioContext) {
        return;
    }


    try {

        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();
        }


        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.value =
            900;


        gain.gain.value =
            0.16;


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.start();


        oscillator.stop(
            audioContext.currentTime +
            0.13
        );

    } catch (e) {

        console.log(e);

    }

}


/* ==================================================
   START BEEPING
================================================== */

function startBeeping() {

    stopBeeping();

    beep();


    beepInterval =
        setInterval(
            () => {

                beep();

            },
            1000
        );

}


/* ==================================================
   STOP BEEPING
================================================== */

function stopBeeping() {

    if (
        beepInterval !== null
    ) {

        clearInterval(
            beepInterval
        );

        beepInterval = null;
    }

}


/* ==================================================
   COUNTDOWN
================================================== */

function startCountdown() {

    clearInterval(
        countdownInterval
    );


    countdownInterval =
        setInterval(
            () => {

                countdown--;


                countdownElement.textContent =
                    countdown;


                /*
                   Animate circular progress.
                */

                const percentage =
                    countdown / 10;


                const offset =
                    CIRCUMFERENCE *
                    (1 - percentage);


                progress.style.strokeDashoffset =
                    offset;


                if (countdown <= 0) {

                    clearInterval(
                        countdownInterval
                    );


                    stopBeeping();


                    countdownElement.textContent =
                        "0";


                    beepText.textContent =
                        "Alarm ended";


                    speak(
                        "The alarm has ended."
                    );

                }

            },
            1000
        );

}


/* ==================================================
   CANCEL
================================================== */

function cancelCrash() {

    crashActive = false;

    moving = false;


    clearInterval(
        countdownInterval
    );


    stopBeeping();

    stopRecognition();


    crashScreen.style.display =
        "none";


    status.textContent =
        "🟢 Crash detection active";


    sensor.textContent =
        "Sensor: active";


    speak(
        "Cancelled."
    );

}


cancelButton.addEventListener(
    "click",
    cancelCrash
);


/* ==================================================
   EMERGENCY
================================================== */

emergencyButton.addEventListener(
    "click",
    confirmEmergency
);


function confirmEmergency() {

    clearInterval(
        countdownInterval
    );


    stopBeeping();


    confirmed.style.display =
        "block";


    beepText.textContent =
        "Alarm stopped";


    countdownElement.textContent =
        "✓";


    progress.style.strokeDashoffset =
        CIRCUMFERENCE;


    speak(
        "Emergency confirmed."
    );


    stopRecognition();

}


/* ==================================================
   VOICE RECOGNITION
================================================== */

function startVoiceRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        beepText.textContent =
            "Voice recognition unavailable.";

        return;
    }


    try {

        recognition =
            new SpeechRecognition();


        recognition.lang =
            "en-US";


        recognition.continuous =
            true;


        recognition.interimResults =
            false;


        recognition.onresult =
            function(event) {

                const result =
                    event.results[
                        event.results.length - 1
                    ][0]
                    .transcript
                    .toLowerCase();


                console.log(
                    "Heard:",
                    result
                );


                if (
                    result.includes("cancel")
                ) {

                    cancelCrash();

                    return;
                }


                if (
                    result.includes("emergency")
                ) {

                    confirmEmergency();

                }

            };


        recognition.onerror =
            function(event) {

                console.log(
                    "Speech error:",
                    event.error
                );

            };


        recognition.onend =
            function() {

                if (crashActive) {

                    try {

                        recognition.start();

                    } catch (e) {}

                }

            };


        recognition.start();

    } catch (e) {

        console.log(e);

    }

}


/* ==================================================
   STOP RECOGNITION
================================================== */

function stopRecognition() {

    if (!recognition) {
        return;
    }


    try {

        recognition.onend = null;

        recognition.stop();

    } catch (e) {}


    recognition = null;

}


/* ==================================================
   TEST CRASH
================================================== */

testButton.addEventListener(
    "click",
    () => {

        if (crashActive) {
            return;
        }


        /*
           Test mode skips the sensor detection
           and opens the complete alarm.
        */

        crashActive = true;

        showCrashScreen();

    }
);

</script>

</body>
</html>
