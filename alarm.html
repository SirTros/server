<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Car Crash Detection</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: white;
    font-family: "Google Sans", "Segoe UI", Arial, sans-serif;
}

body {
    overflow: hidden;
}

#main {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    padding: 25px;

    text-align: center;
}

.carIcon {
    width: 90px;
    height: 90px;

    border-radius: 50%;

    background: #202124;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 45px;

    margin-bottom: 25px;
}

h1 {
    font-size: 32px;
    margin: 0 0 12px;
}

.subtitle {
    max-width: 390px;

    color: #aaa;

    font-size: 17px;

    line-height: 1.5;

    margin-bottom: 20px;
}

button {
    border: 0;

    border-radius: 28px;

    padding: 15px 28px;

    font-size: 17px;

    font-weight: 700;

    margin: 7px;

    cursor: pointer;

    background: white;
    color: black;
}

button:active {
    transform: scale(.96);
}

#start {
    background: white;
}

#test {
    background: #292a2d;
    color: white;
}

#status {
    margin-top: 15px;

    color: #888;

    font-size: 15px;
}

#sensor {
    margin-top: 12px;

    color: #555;

    font-size: 12px;

    line-height: 1.5;
}


/* =========================
   CRASH SCREEN
========================= */

#crashScreen {

    position: fixed;

    inset: 0;

    z-index: 999;

    background: #000;

    display: none;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 25px;
}

.crashBox {
    width: 100%;
    max-width: 460px;
}

.warning {
    font-size: 72px;

    margin-bottom: 20px;

    animation: pulse 1s infinite;
}

@keyframes pulse {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }

    100% {
        transform: scale(1);
    }

}

.crashTitle {

    font-size: 38px;

    font-weight: 700;

    line-height: 1.15;

    margin-bottom: 18px;
}

.crashDescription {

    color: #ddd;

    font-size: 18px;

    line-height: 1.5;
}

#number {

    font-size: 70px;

    font-weight: 700;

    margin: 25px 0;
}

#beeping {

    color: #999;

    font-size: 14px;

    margin-top: 10px;
}

#cancel {

    background: #303134;

    color: white;

    min-width: 130px;
}

#emergency {

    background: white;

    color: black;

    min-width: 130px;
}


/* =========================
   CONFIRMED
========================= */

#confirmed {

    display: none;

    margin-top: 20px;

    font-size: 18px;

    color: #fff;
}

</style>
</head>

<body>


<!-- =========================
     MAIN
========================= -->

<div id="main">

    <div class="carIcon">
        🚗
    </div>

    <h1>
        Car Crash Detection
    </h1>

    <div class="subtitle">
        Motion sensors monitor the device for
        sudden impacts followed by a period
        of little movement.
    </div>

    <button id="start">
        Start detection
    </button>

    <button id="test">
        Test crash
    </button>

    <div id="status">
        Detection is off
    </div>

    <div id="sensor">
        Sensor: waiting...
    </div>

</div>


<!-- =========================
     CRASH
========================= -->

<div id="crashScreen">

    <div class="crashBox">

        <div class="warning">
            ⚠️
        </div>

        <div class="crashTitle">
            Car crash detected
        </div>

        <div class="crashDescription">
            We've detected a possible crash.
            <br>
            Say <b>emergency</b> or <b>cancel</b>.
        </div>

        <div id="number">
            10
        </div>

        <button id="cancel">
            Cancel
        </button>

        <button id="emergency">
            Emergency
        </button>

        <div id="beeping">
            Beeping for 10 seconds
        </div>

        <div id="confirmed">
            Emergency confirmed.
        </div>

    </div>

</div>


<script>


/* ==================================================
   VARIABLES
================================================== */

let detectionActive = false;

let crashActive = false;

let lastMotion = 0;

let currentMotion = 0;

let motionDifference = 0;

let moving = false;

let stillSince = null;

let countdown = 10;

let countdownInterval = null;

let beepInterval = null;

let audio = null;

let recognition = null;


/*
   These values are easier to trigger than
   the previous version.
*/

const IMPACT_CHANGE = 12;

const STILL_LEVEL = 2.5;

const STILL_TIME = 4000;


/* ==================================================
   ELEMENTS
================================================== */

const startButton =
    document.getElementById("start");

const testButton =
    document.getElementById("test");

const status =
    document.getElementById("status");

const sensor =
    document.getElementById("sensor");

const crashScreen =
    document.getElementById("crashScreen");

const number =
    document.getElementById("number");

const cancelButton =
    document.getElementById("cancel");

const emergencyButton =
    document.getElementById("emergency");

const beeping =
    document.getElementById("beeping");

const confirmed =
    document.getElementById("confirmed");


/* ==================================================
   VOICE
================================================== */

function say(text) {

    if (!window.speechSynthesis) {
        return;
    }

    speechSynthesis.cancel();

    const voice =
        new SpeechSynthesisUtterance(text);

    voice.lang = "en-US";

    voice.rate = 0.9;

    voice.pitch = 1;

    speechSynthesis.speak(voice);
}


/* ==================================================
   MICROPHONE
================================================== */

async function microphonePermission() {

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        status.textContent =
            "Microphone is not available.";

        return false;
    }

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });

        stream
            .getTracks()
            .forEach(track => track.stop());

        return true;

    } catch (error) {

        console.log(error);

        status.textContent =
            "Microphone permission denied.";

        return false;
    }
}


/* ==================================================
   MOTION PERMISSION
================================================== */

async function motionPermission() {

    try {

        if (
            typeof DeviceMotionEvent !== "undefined" &&
            typeof DeviceMotionEvent.requestPermission ===
            "function"
        ) {

            const permission =
                await DeviceMotionEvent.requestPermission();

            if (permission !== "granted") {

                status.textContent =
                    "Motion permission denied.";

                return false;
            }
        }

        return true;

    } catch (error) {

        console.log(error);

        status.textContent =
            "Motion sensor permission failed.";

        return false;
    }
}


/* ==================================================
   START
================================================== */

startButton.addEventListener(
    "click",
    async function() {

        startButton.disabled = true;

        status.textContent =
            "Requesting microphone...";

        const mic =
            await microphonePermission();

        if (!mic) {

            startButton.disabled = false;

            return;
        }


        status.textContent =
            "Requesting motion sensor...";


        const motion =
            await motionPermission();


        if (!motion) {

            startButton.disabled = false;

            return;
        }


        /*
           Audio must be created after
           a user interaction on mobile.
        */

        try {

            audio =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        } catch (e) {

            console.log(e);

        }


        detectionActive = true;

        moving = false;

        crashActive = false;


        window.addEventListener(
            "devicemotion",
            motionHandler,
            true
        );


        startButton.style.display =
            "none";


        status.textContent =
            "🟢 Crash detection active";

        sensor.textContent =
            "Sensor: active";


        say(
            "Car crash detection is active."
        );

    }
);


/* ==================================================
   MOTION
================================================== */

function motionHandler(event) {

    if (!detectionActive || crashActive) {
        return;
    }


    const a =
        event.acceleration;


    const g =
        event.accelerationIncludingGravity;


    /*
       Prefer acceleration without gravity.
       If unavailable, use gravity-inclusive.
    */

    let x;
    let y;
    let z;


    if (a && (
        a.x !== null ||
        a.y !== null ||
        a.z !== null
    )) {

        x = a.x || 0;
        y = a.y || 0;
        z = a.z || 0;

    } else if (g) {

        x = g.x || 0;
        y = g.y || 0;
        z = g.z || 0;

    } else {

        return;
    }


    currentMotion =
        Math.sqrt(
            x * x +
            y * y +
            z * z
        );


    /*
       Difference from previous reading.
    */

    motionDifference =
        Math.abs(
            currentMotion -
            lastMotion
        );


    lastMotion =
        currentMotion;


    sensor.innerHTML =
        "Motion: " +
        currentMotion.toFixed(2) +
        " m/s²<br>" +
        "Change: " +
        motionDifference.toFixed(2);


    /*
       Normal movement.
    */

    if (
        currentMotion >
        STILL_LEVEL
    ) {

        moving = true;

        stillSince = null;
    }


    /*
       BIG SUDDEN CHANGE.
    */

    if (
        moving &&
        motionDifference >=
        IMPACT_CHANGE
    ) {

        console.log(
            "POSSIBLE IMPACT",
            currentMotion,
            motionDifference
        );

        possibleCrash();

    }


    /*
       If motion becomes very small,
       start stillness timer.
    */

    if (
        crashActive &&
        currentMotion <
        STILL_LEVEL
    ) {

        if (stillSince === null) {

            stillSince =
                Date.now();

        }

    }

}


/* ==================================================
   POSSIBLE CRASH
================================================== */

function possibleCrash() {

    if (crashActive) {
        return;
    }


    crashActive = true;

    status.textContent =
        "⚠️ Possible impact detected";


    /*
       Wait 1 second before checking
       the stillness.
    */

    setTimeout(
        checkStillness,
        1000
    );

}


/* ==================================================
   STILLNESS
================================================== */

function checkStillness() {

    if (!crashActive) {
        return;
    }


    let stillStart =
        Date.now();


    function loop() {

        if (!crashActive) {
            return;
        }


        /*
           Current motion is low.
        */

        if (
            currentMotion <=
            STILL_LEVEL
        ) {

            const elapsed =
                Date.now() -
                stillStart;


            sensor.textContent =
                "Stillness: " +
                Math.floor(
                    elapsed / 1000
                ) +
                "s";


            if (
                elapsed >=
                STILL_TIME
            ) {

                showCrash();

                return;
            }


        } else {

            /*
               Movement happened again.
            */

            stillStart =
                Date.now();

        }


        requestAnimationFrame(loop);

    }


    loop();

}


/* ==================================================
   SHOW CRASH
================================================== */

function showCrash() {

    crashScreen.style.display =
        "flex";


    countdown = 10;

    number.textContent =
        countdown;


    confirmed.style.display =
        "none";


    beeping.textContent =
        "Beeping for 10 seconds";


    say(
        "Car crash detected. " +
        "Say emergency or cancel."
    );


    startBeeping();

    startCountdown();

    startRecognition();

}


/* ==================================================
   BEEP
================================================== */

function beep() {

    if (!audio) {
        return;
    }


    try {

        if (
            audio.state ===
            "suspended"
        ) {

            audio.resume();
        }


        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.value =
            900;


        gain.gain.value =
            0.18;


        oscillator.connect(gain);

        gain.connect(
            audio.destination
        );


        oscillator.start();


        oscillator.stop(
            audio.currentTime +
            0.13
        );

    } catch (e) {

        console.log(e);

    }

}


/* ==================================================
   BEEPING
================================================== */

function startBeeping() {

    stopBeeping();


    beep();


    beepInterval =
        setInterval(
            function() {

                beep();

            },
            1000
        );

}


/* ==================================================
   STOP BEEPING
================================================== */

function stopBeeping() {

    if (beepInterval !== null) {

        clearInterval(
            beepInterval
        );

        beepInterval = null;

    }

}


/* ==================================================
   COUNTDOWN
================================================== */

function startCountdown() {

    clearInterval(
        countdownInterval
    );


    countdownInterval =
        setInterval(
            function() {

                countdown--;

                number.textContent =
                    countdown;


                if (countdown <= 0) {

                    clearInterval(
                        countdownInterval
                    );


                    stopBeeping();


                    number.textContent =
                        "0";


                    beeping.textContent =
                        "Beeping stopped";


                    say(
                        "The alarm has ended."
                    );

                }

            },
            1000
        );

}


/* ==================================================
   CANCEL
================================================== */

function cancelCrash() {

    crashActive = false;

    moving = false;

    stillSince = null;


    clearInterval(
        countdownInterval
    );


    stopBeeping();


    stopRecognition();


    crashScreen.style.display =
        "none";


    status.textContent =
        "🟢 Crash detection active";


    sensor.textContent =
        "Sensor: active";


    say(
        "Cancelled."
    );

}


cancelButton.addEventListener(
    "click",
    cancelCrash
);


/* ==================================================
   EMERGENCY
================================================== */

function confirmEmergency() {

    clearInterval(
        countdownInterval
    );


    stopBeeping();


    confirmed.style.display =
        "block";


    beeping.textContent =
        "Alarm stopped";


    number.textContent =
        "✓";


    say(
        "Emergency confirmed."
    );


    stopRecognition();

}


emergencyButton.addEventListener(
    "click",
    confirmEmergency
);


/* ==================================================
   VOICE RECOGNITION
================================================== */

function startRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        beeping.textContent =
            "Voice recognition unavailable.";

        return;
    }


    try {

        recognition =
            new SpeechRecognition();


        recognition.lang =
            "en-US";


        recognition.continuous =
            true;


        recognition.interimResults =
            false;


        recognition.onresult =
            function(event) {

                const result =
                    event.results[
                        event.results.length - 1
                    ][0]
                    .transcript
                    .toLowerCase();


                console.log(
                    "Voice:",
                    result
                );


                if (
                    result.includes("cancel")
                ) {

                    cancelCrash();

                    return;
                }


                if (
                    result.includes("emergency")
                ) {

                    confirmEmergency();

                }

            };


        recognition.onerror =
            function(event) {

                console.log(
                    "Recognition:",
                    event.error
                );

            };


        recognition.onend =
            function() {

                if (
                    crashActive &&
                    recognition
                ) {

                    try {

                        recognition.start();

                    } catch (e) {}

                }

            };


        recognition.start();

    } catch (e) {

        console.log(e);

    }

}


/* ==================================================
   STOP RECOGNITION
================================================== */

function stopRecognition() {

    if (!recognition) {
        return;
    }


    try {

        recognition.onend = null;

        recognition.stop();

    } catch (e) {}


    recognition = null;

}


/* ==================================================
   TEST CRASH
================================================== */

testButton.addEventListener(
    "click",
    function() {

        /*
           This lets you test the complete
           crash screen without moving the phone.
        */

        if (crashActive) {
            return;
        }


        crashActive = true;


        showCrash();

    }
);

</script>

</body>
</html>
