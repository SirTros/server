<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3s AI Recorder</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
}

video{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  object-fit:cover;
}

#ui{
  position:fixed;
  top:20px;
  left:20px;
  color:white;
  font-family:sans-serif;
  font-size:18px;
  background:rgba(0,0,0,0.6);
  padding:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<div id="ui">start...</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
const video = document.getElementById("video");
const ui = document.getElementById("ui");

let seen = false;
let lastSeen = 0;

let recorder;
let chunks = [];
let recording = false;

// 🔊 beep
const ctx = new (window.AudioContext || window.webkitAudioContext)();

function beep(){
  const o = ctx.createOscillator();
  const g = ctx.createGain();

  o.frequency.value = 800;
  g.gain.value = 0.04;

  o.connect(g);
  g.connect(ctx.destination);

  o.start();
  o.stop(ctx.currentTime + 0.08);
}

// 🎥 start record
async function startRecord(stream){
  chunks = [];

  recorder = new MediaRecorder(stream);

  recorder.ondataavailable = e => chunks.push(e.data);

  recorder.onstop = () => {
    const blob = new Blob(chunks, {type:"video/webm"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "ai_record.webm";
    a.click();
  };

  recorder.start();
  recording = true;
}

// stop record
function stopRecord(){
  if(recorder && recording){
    recorder.stop();
    recording = false;
  }
}

// ================= POSE =================
const pose = new Pose({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`
});

pose.setOptions({
  modelComplexity: 1,
  smoothLandmarks: true,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6
});

pose.onResults(res => {
  if(res.poseLandmarks){
    seen = true;
    lastSeen = Date.now();
  }
});

// ================= CAMERA =================
let stream;

async function startCam(){
  stream = await navigator.mediaDevices.getUserMedia({
    video:{ facingMode:"user" },
    audio:true
  });

  video.srcObject = stream;
  await video.play();

  const cam = new Camera(video, {
    onFrame: async () => {
      await pose.send({image: video});
    },
    width:1280,
    height:720
  });

  cam.start();
}

startCam();

// ================= LOOP =================
setInterval(() => {

  const now = Date.now();

  if(seen){
    beep();
    ui.innerText = "VIDÍM ČLOVĚKA 🔴";

    if(!recording){
      startRecord(stream);
    }
  }

  seen = false;

  // ⛔ 3 sekundy bez člověka → stop + download
  if(recording && now - lastSeen > 3000){
    ui.innerText = "STOP + DOWNLOAD ⛔";
    stopRecord();
  }

}, 200);

</script>

</body>
</html>
