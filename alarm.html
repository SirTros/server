<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokročilý Test Vibrací</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }

        .container {
            text-align: center;
            padding: 24px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 90%;
            width: 340px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .vib-button {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #0381fe;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(3, 129, 254, 0.3);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .vib-button:active {
            background-color: #0266cb;
            transform: scale(0.97);
        }

        /* Styl pro diagnostickou konzoli */
        .console {
            margin-top: 20px;
            padding: 12px;
            background-color: #1e1e1e;
            color: #00ff00;
            font-family: monospace;
            font-size: 12px;
            border-radius: 8px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
        }

        .log-entry {
            margin-bottom: 4px;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Test hmatové odezvy</h1>
        <p>Prohlížeč vyžaduje HTTPS (GitHub Pages je ideální). Vypni v telefonu úsporný režim.</p>
        
        <button id="vibBtn" class="vib-button">SPUSTIT VIBRACI</button>
        
        <!-- Diagnostické okno -->
        <div class="console" id="logConsole">
            <div class="log-entry">[Systém] Připraven k testu...</div>
        </div>
    </div>

    <script>
        const btn = document.getElementById('vibBtn');
        const consoleEl = document.getElementById('logConsole');

        // Pomocná funkce pro zápis do naší mini konzole na obrazovce
        function loguj(text, typ = 'info') {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            
            if (typ === 'error') entry.style.color = '#ff4d4d';
            if (typ === 'success') entry.style.color = '#00ffcc';
            
            const cas = new Date().toLocaleTimeString();
            entry.innerText = `[${cas}] ${text}`;
            consoleEl.appendChild(entry);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        function provedVibraci(e) {
            if (e) e.preventDefault();
            loguj("Detekován stisk tlačítka...");

            // 1. Kontrola protokolu HTTPS
            if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
                loguj("CHYBA: Web neběží na HTTPS! Android vibrace zablokoval.", "error");
                return;
            }

            // 2. Kontrola podpory Vibration API
            if (!("vibrate" in navigator)) {
                loguj("CHYBA: Prohlížeč vůbec nepodporuje Vibration API.", "error");
                return;
            }

            try {
                // Posíláme pulz: 400ms vibrace, 100ms pauza, 400ms vibrace
                const vysledek = navigator.vibrate([400, 100, 400]);
                
                if (vysledek) {
                    loguj("ÚSPĚCH: Příkaz odeslán do hardwaru telefonu.", "success");
                } else {
                    loguj("CHYBA: Android odmítl požadavek (zkontroluj Úsporný režim / Hmatovou odezvu v Nastavení).", "error");
                }
            } catch (err) {
                loguj("VÝJIMKA SYSTÉMU: " + err.message, "error");
            }
        }

        // Reakce na dotyk (nejrychlejší cesta na mobilech)
        btn.addEventListener('touchstart', provedVibraci, { passive: false });
        // Pojistka pro kliknutí
        btn.addEventListener('click', provedVibraci);
    </script>

</body>
</html>
