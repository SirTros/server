<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SirTros Call</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #000;
    color: white;
}

body {
    overflow: hidden;
}

.app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

/* HEADER */

.header {
    height: 70px;
    display: flex;
    align-items: center;
    padding: 0 22px;
    border-bottom: 1px solid #222;
    background: #080808;
}

.logo {
    font-size: 24px;
    font-weight: 800;
}

.logo span {
    color: #25d366;
}

.status {
    margin-left: auto;
    font-size: 13px;
    color: #777;
}

/* MAIN */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 35px 20px;
    overflow-y: auto;
}

.avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 45px;
    margin-bottom: 20px;
}

.name {
    font-size: 27px;
    font-weight: bold;
}

.call-status {
    margin-top: 8px;
    color: #888;
    min-height: 22px;
}

.timer {
    margin-top: 8px;
    font-size: 16px;
    color: #aaa;
}

.target-box {
    width: min(450px, 100%);
    margin-top: 30px;
}

.target-box label {
    display: block;
    color: #999;
    font-size: 13px;
    margin-bottom: 8px;
}

.target-box input {
    width: 100%;
    padding: 15px;
    border: 1px solid #333;
    border-radius: 12px;
    background: #111;
    color: white;
    outline: none;
    font-size: 16px;
}

.target-box input:focus {
    border-color: #25d366;
}

/* BUTTONS */

.buttons {
    display: flex;
    gap: 15px;
    margin-top: 25px;
    flex-wrap: wrap;
    justify-content: center;
}

button {
    border: 0;
    cursor: pointer;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.call-btn {
    background: #25d366;
    color: #000;
    padding: 15px 30px;
    border-radius: 30px;
}

.end-btn {
    background: #ff3b30;
    padding: 15px 30px;
    border-radius: 30px;
}

.control-btn {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: #222;
}

.control-btn.active {
    background: white;
    color: black;
}

/* HISTORY */

.history {
    width: min(600px, 100%);
    margin-top: 40px;
}

.history-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 12px;
}

.history-item {
    background: #111;
    border: 1px solid #222;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 8px;
}

.history-main {
    font-weight: bold;
}

.history-info {
    color: #777;
    font-size: 13px;
    margin-top: 5px;
}

/* PERMISSION */

.permission-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.96);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
}

.permission-card {
    width: min(430px, 100%);
    background: #111;
    border: 1px solid #292929;
    border-radius: 22px;
    padding: 30px;
    text-align: center;
}

.permission-icon {
    font-size: 55px;
    margin-bottom: 15px;
}

.permission-card h1 {
    margin: 0;
    font-size: 25px;
}

.permission-card p {
    color: #999;
    line-height: 1.5;
}

.permission-btn {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    background: #25d366;
    color: #000;
    margin-top: 10px;
}

.permission-error {
    margin-top: 15px;
    color: #ff6259;
    font-size: 13px;
    line-height: 1.5;
    word-break: break-word;
}

/* INCOMING */

.incoming {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.96);
    z-index: 900;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.incoming-card {
    text-align: center;
    width: min(400px, 100%);
}

.incoming-avatar {
    width: 120px;
    height: 120px;

    background: #222;
    margin: auto;
    display: flex;

    justify-content: center;
    font-size: 55px;
}

.incoming-title {

}

.incoming-subtitle {

    margin-top: 8px;
}

.incoming-buttons {

    justify-content: center;
    gap: 30px;

}

.accept {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #25d366;
    color: #000;
    font-size: 28px;

.reject {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #ff3b30;
    font-size: 28px;
}

/* CALL CONTROLS */

.call-controls {
    display: none;
    margin-top: 35px;
    gap: 15px;
    justify-content: center;
}

.show {
    display: flex;
}

/* NOTIFICATION */

.notification {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #181818;
    border: 1px solid #333;
    padding: 13px 18px;
    border-radius: 12px;
    display: none;
    z-index: 2000;
    max-width: 90%;
    text-align: center;
}

@media(max-width:600px) {

    .header {

        padding: 0 15px;
    }

    .logo {
        font-size: 20px;
    }

    .main {

    }

    .avatar {
        width: 85px;
        height: 85px;
        font-size: 38px;
    }

    .name {
        font-size: 23px;
    }
}
</style>

<body>

</div>


<!-- MICROPHONE PERMISSION -->

<div
    class="permission-overlay"

>

    <div class="permission-card">

        <div class="permission-icon">
            🎤
        </div>

        <h1>
            Povolení mikrofonu

<div

>

            ti někdo volá

</div>

    id="remoteAudio"
    autoplay
></audio>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

/*
   SEM VLOŽ SVÉ ÚDAJE ZE SUPABASE.
*/

const SUPABASE_URL = "https://oxfviwqkxtpxjjnogdhh.supabase.co";
const SUPABASE_KEY = "sb_publishable_hkaAJrtiV_Isz6BzxAPHtA_hZfFDEYX";

let supabaseClient = null;

function initSupabase() {

    if (
        !SUPABASE_URL ||
        !SUPABASE_URL.startsWith("http://") &&
        !SUPABASE_URL.startsWith("https://")
    ) {

        console.warn(
            "Supabase není nastavený. Vyplň SUPABASE_URL."
        );

        document.getElementById("connectionStatus").textContent =
            "Supabase není nastavený";

        return false;
    }

    try {

        supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

        document.getElementById("connectionStatus").textContent =
            "Supabase připraven";

        return true;

    } catch(error) {

        console.error(
            "Supabase chyba:",
            error
        );

        document.getElementById("connectionStatus").textContent =
            "Supabase chyba";

        return false;
    }
}


/* =========================================================
   VARIABLES
   ========================================================= */

/*
   DŮLEŽITÉ:
   localStream musí být vytvořený PŘED funkcemi,
   které ho používají.
*/

let localStream = null;
let remoteStream = null;
let peerConnection = null;

let currentCallId = null;
let currentCallStarted = null;

let incomingCallData = null;

let timerInterval = null;

let isMuted = false;
let speakerEnabled = true;


/* =========================================================
   WEBRTC
   ========================================================= */

const rtcConfig = {

    iceServers: [

        {
            urls: "stun:stun.l.google.com:19302"
        },

        {
            urls: "stun:stun1.l.google.com:19302"
        }

    ]

};


/* =========================================================
   MICROPHONE
   ========================================================= */

async function requestMicrophone() {

    const errorBox =
        document.getElementById("permissionError");

    errorBox.textContent = "";

    /*
       Kontrola HTTPS / localhost.
    */

    if (
        !window.isSecureContext &&
        location.hostname !== "localhost" &&
        location.hostname !== "127.0.0.1"
    ) {

        errorBox.innerHTML =
            "❌ Tato stránka není spuštěná přes HTTPS.<br><br>" +
            "Mikrofon v prohlížeči funguje přes HTTPS " +
            "nebo localhost.<br><br>" +
            "Pokud otevíráš index.html přímo jako " +
            "<b>file:///...</b>, spusť ho přes localhost " +
            "nebo nahraj na GitHub Pages.";

        return;
    }


    /*
       Kontrola podpory mikrofonu.
    */

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        errorBox.innerHTML =
            "❌ Tento prohlížeč nepodporuje přístup k mikrofonu.";

        return;
    }


    try {

        /*
           Pokud už stream existuje,
           mikrofon není potřeba žádat znovu.
        */

        if (localStream) {

            document.getElementById(
                "permissionOverlay"
            ).style.display = "none";

            return;
        }


        /*
           Žádost o mikrofon.
        */

        localStream =
            await navigator.mediaDevices.getUserMedia({

                audio: {

                    channelCount: {
                        ideal: 1
                    },

                    sampleRate: {
                        ideal: 16000
                    },

                    sampleSize: {
                        ideal: 16
                    },

                    echoCancellation: true,

                    noiseSuppression: true,

                    autoGainControl: true

                },

                video: false

            });


        /*
           Mikrofon úspěšně povolen.
        */

        document.getElementById(
            "permissionOverlay"
        ).style.display = "none";


        document.getElementById(
            "callStatus"
        ).textContent =
            "Mikrofon připraven 🎤";


        showNotification(
            "Mikrofon byl povolen ✅"
        );


        console.log(
            "Mikrofon povolen:",
            localStream
        );

    } catch(error) {

        console.error(
            "Mikrofon:",
            error
        );


        let message =
            "❌ Mikrofon se nepodařilo povolit.";


        switch(error.name) {

            case "NotAllowedError":

                message =
                    "❌ Přístup k mikrofonu byl zamítnut.<br><br>" +
                    "Zkontroluj oprávnění mikrofonu pro tuto stránku.";

                break;


            case "NotFoundError":

                message =
                    "❌ Nebyl nalezen žádný mikrofon.";

                break;


            case "NotReadableError":

                message =
                    "❌ Mikrofon je používán jinou aplikací.<br><br>" +
                    "Zavři například Discord, Teams nebo jinou aplikaci, " +
                    "která mikrofon používá.";

                break;


            case "SecurityError":

                message =
                    "❌ Prohlížeč zablokoval přístup k mikrofonu.";

                break;


            case "AbortError":

                message =
                    "❌ Prohlížeč přerušil žádost o mikrofon.";

                break;


            case "TypeError":

                message =
                    "❌ Chyba nastavení mikrofonu.";

                break;


            default:

                message =
                    "❌ " +
                    error.name +
                    "<br>" +
                    (error.message || "Neznámá chyba.");

        }


        errorBox.innerHTML =
            message +
            "<br><br><small>" +
            "Technická chyba: " +
            error.name +
            "</small>";

    }

}


/* =========================================================
   PEER CONNECTION
   ========================================================= */

function createPeerConnection() {

    peerConnection =
        new RTCPeerConnection(
            rtcConfig
        );


    remoteStream =
        new MediaStream();


    document.getElementById(
        "remoteAudio"
    ).srcObject =
        remoteStream;


    /*
       Přidání mikrofonu.
    */

    if (localStream) {

        localStream
            .getTracks()
            .forEach(track => {

                peerConnection.addTrack(
                    track,
                    localStream
                );

            });

    }


    /*
       Příchozí zvuk.
    */

    peerConnection.ontrack =
        event => {

            event.streams[0]
                .getTracks()
                .forEach(track => {

                    remoteStream.addTrack(
                        track
                    );

                });

        };


    /*
       ICE kandidáti.
    */

    peerConnection.onicecandidate =
        async event => {

            if (!event.candidate) {
                return;
            }

            if (!currentCallId) {
                return;
            }


            try {

                const { data } =
                    await supabaseClient
                        .from("calls")
                        .select("ice_candidates")
                        .eq("id", currentCallId)
                        .single();


                let candidates =
                    data?.ice_candidates || [];


                candidates.push(
                    event.candidate.toJSON()
                );


                await supabaseClient
                    .from("calls")
                    .update({
                        ice_candidates:
                            candidates
                    })
                    .eq(
                        "id",
                        currentCallId
                    );

            } catch(error) {

                console.error(
                    "ICE chyba:",
                    error
                );

            }

        };


    peerConnection.onconnectionstatechange =
        () => {

            const state =
                peerConnection.connectionState;


            console.log(
                "WebRTC:",
                state
            );


            if (state === "connected") {

                document.getElementById(
                    "callStatus"
                ).textContent =
                    "Hovor probíhá";

                startTimer();

            }


            if (
                state === "failed" ||
                state === "disconnected"
            ) {

                document.getElementById(
                    "callStatus"
                ).textContent =
                    "Spojení přerušeno";

            }

        };


    return peerConnection;
}


/* =========================================================
   START CALL
   ========================================================= */

async function startCall() {

    if (!localStream) {

        showNotification(
            "Nejdříve povol mikrofon 🎤"
        );

        document.getElementById(
            "permissionOverlay"
        ).style.display =
            "flex";

        return;
    }


    if (!supabaseClient) {

        showNotification(
            "Nejdříve nastav Supabase."
        );

        return;
    }


    const target =
        document
            .getElementById("target")
            .value
            .trim();


    if (!target) {

        showNotification(
            "Zadej uživatelské jméno."
        );

        return;
    }


    const myName =
        getMyName();


    try {

        document.getElementById(
            "callStatus"
        ).textContent =
            "Volám…";


        document.getElementById(
            "callButton"
        ).style.display =
            "none";


        document.getElementById(
            "endButton"
        ).style.display =
            "block";


        document.getElementById(
            "callControls"
        ).classList.add("show");


        createPeerConnection();


        const offer =
            await peerConnection
                .createOffer();


        await peerConnection
            .setLocalDescription(
                offer
            );


        const { data, error } =
            await supabaseClient
                .from("calls")
                .insert({

                    caller: myName,

                    receiver: target,

                    status: "ringing",

                    offer:
                        JSON.stringify(
                            offer
                        ),

                    ice_candidates: []

                })
                .select()
                .single();


        if (error) {
            throw error;
        }


        currentCallId =
            data.id;


        currentCallStarted =
            Date.now();


        saveTarget(target);


        subscribeToCall(
            currentCallId
        );


    } catch(error) {

        console.error(
            "Start call error:",
            error
        );


        showNotification(
            "Chyba při vytváření hovoru."
        );


        resetCall();

    }

}


/* =========================================================
   SUBSCRIBE TO CALL
   ========================================================= */

function subscribeToCall(
    callId
) {

    supabaseClient
        .channel(
            "call-" + callId
        )
        .on(
            "postgres_changes",
            {
                event: "UPDATE",
                schema: "public",
                table: "calls",
                filter:
                    "id=eq." + callId
            },
            async payload => {

                const call =
                    payload.new;


                /*
                   Druhá strana přijala hovor.
                */

                if (
                    call.status ===
                    "accepted" &&
                    call.answer &&
                    peerConnection
                ) {

                    try {

                        const answer =
                            JSON.parse(
                                call.answer
                            );


                        await peerConnection
                            .setRemoteDescription(
                                answer
                            );

                    } catch(error) {

                        console.error(
                            "Answer error:",
                            error
                        );

                    }

                }


                /*
                   Hovor byl odmítnut.
                */

                if (
                    call.status ===
                    "rejected"
                ) {

                    showNotification(
                        "Hovor byl odmítnut."
                    );

                    resetCall();

                }


                /*
                   Hovor byl ukončen.
                */

                if (
                    call.status ===
                    "ended"
                ) {

                    showNotification(
                        "Hovor byl ukončen."
                    );

                    resetCall();

                }

            }
        )
        .subscribe();

}


/* =========================================================
   INCOMING CALL CHECK
   ========================================================= */

async function checkIncomingCalls() {

    if (!supabaseClient) {
        return;
    }


    const myName =
        getMyName();


    const {
        data,
        error
    } =
        await supabaseClient
            .from("calls")
            .select("*")
            .eq(
                "receiver",
                myName
            )
            .eq(
                "status",
                "ringing"
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            )
            .limit(1);


    if (error) {

        console.error(
            error
        );

        return;
    }


    if (
        data &&
        data.length > 0 &&
        !incomingCallData &&
        !currentCallId
    ) {

        incomingCallData =
            data[0];


        showIncomingCall(
            incomingCallData
        );

    }

}


/* =========================================================
   SHOW INCOMING
   ========================================================= */

function showIncomingCall(
    call
) {

    document.getElementById(
        "incomingName"
    ).textContent =
        call.caller;


    document.getElementById(
        "incomingCall"
    ).style.display =
        "flex";


    /*
       Zvuk příchozího hovoru
       pomocí jednoduchého beepu.
    */

    playRing();

}


/* =========================================================
   ACCEPT CALL
   ========================================================= */

async function acceptCall() {

    if (!incomingCallData) {
        return;
    }


    if (!localStream) {

        document.getElementById(
            "incomingCall"
        ).style.display =
            "none";

        document.getElementById(
            "permissionOverlay"
        ).style.display =
            "flex";

        return;
    }


    const call =
        incomingCallData;


    try {

        currentCallId =
            call.id;


        createPeerConnection();


        const offer =
            JSON.parse(
                call.offer
            );


        await peerConnection
            .setRemoteDescription(
                offer
            );


        const answer =
            await peerConnection
                .createAnswer();


        await peerConnection
            .setLocalDescription(
                answer
            );


        await supabaseClient
            .from("calls")
            .update({

                status: "accepted",

                answer:
                    JSON.stringify(
                        answer
                    ),

                started_at:
                    new Date()
                        .toISOString()

            })
            .eq(
                "id",
                call.id
            );


        document.getElementById(
            "incomingCall"
        ).style.display =
            "none";


        document.getElementById(
            "callStatus"
        ).textContent =
            "Spojování…";


        document.getElementById(
            "callButton"
        ).style.display =
            "none";


        document.getElementById(
            "endButton"
        ).style.display =
            "block";


        document.getElementById(
            "callControls"
        ).classList.add("show");


        currentCallStarted =
            Date.now();


        subscribeToCall(
            currentCallId
        );


        incomingCallData =
            null;


    } catch(error) {

        console.error(
            "Accept error:",
            error
        );


        showNotification(
            "Hovor se nepodařilo přijmout."
        );

    }

}


/* =========================================================
   REJECT CALL
   ========================================================= */

async function rejectCall() {

    if (!incomingCallData) {
        return;
    }


    try {

        await supabaseClient
            .from("calls")
            .update({

                status:
                    "rejected"

            })
            .eq(
                "id",
                incomingCallData.id
            );

    } catch(error) {

        console.error(
            error
        );

    }


    document.getElementById(
        "incomingCall"
    ).style.display =
        "none";


    incomingCallData =
        null;

}


/* =========================================================
   END CALL
   ========================================================= */

async function endCall() {

    if (currentCallId && supabaseClient) {

        try {

            const duration =
                currentCallStarted
                    ? Math.floor(
                        (
                            Date.now() -
                            currentCallStarted
                        ) / 1000
                    )
                    : 0;


            await supabaseClient
                .from("calls")
                .update({

                    status:
                        "ended",

                    ended_at:
                        new Date()
                            .toISOString(),

                    duration:
                        duration

                })
                .eq(
                    "id",
                    currentCallId
                );

        } catch(error) {

            console.error(
                "End call:",
                error
            );

        }

    }


    resetCall();

}


/* =========================================================
   RESET
   ========================================================= */

function resetCall() {

    if (timerInterval) {

        clearInterval(
            timerInterval
        );

        timerInterval =
            null;

    }


    if (peerConnection) {

        try {

            peerConnection.close();

        } catch(e) {}

        peerConnection =
            null;

    }


    remoteStream =
        null;


    currentCallId =
        null;


    currentCallStarted =
        null;


    document.getElementById(
        "callStatus"
    ).textContent =
        "Připraven";


    document.getElementById(
        "timer"
    ).textContent =
        "00:00";


    document.getElementById(
        "callButton"
    ).style.display =
        "block";


    document.getElementById(
        "endButton"
    ).style.display =
        "none";


    document.getElementById(
        "callControls"
    ).classList.remove(
        "show"
    );


    loadHistory();

}


/* =========================================================
   MUTE
   ========================================================= */

function toggleMute() {

    if (!localStream) {
        return;
    }


    isMuted =
        !isMuted;


    localStream
        .getAudioTracks()
        .forEach(
            track => {

                track.enabled =
                    !isMuted;

            }
        );


    const button =
        document.getElementById(
            "muteButton"
        );


    button.classList.toggle(
        "active",
        isMuted
    );


    button.textContent =
        isMuted
            ? "🔇"
            : "🎤";

}


/* =========================================================
   SPEAKER
   ========================================================= */

function toggleSpeaker() {

    speakerEnabled =
        !speakerEnabled;


    const audio =
        document.getElementById(
            "remoteAudio"
        );


    audio.muted =
        !speakerEnabled;


    const button =
        document.getElementById(
            "speakerButton"
        );


    button.classList.toggle(
        "active",
        !speakerEnabled
    );


    button.textContent =
        speakerEnabled
            ? "🔊"
            : "🔇";

}


/* =========================================================
   TIMER
   ========================================================= */

function startTimer() {

    if (timerInterval) {
        return;
    }


    if (!currentCallStarted) {

        currentCallStarted =
            Date.now();

    }


    timerInterval =
        setInterval(
            () => {

                const seconds =
                    Math.floor(
                        (
                            Date.now() -
                            currentCallStarted
                        ) / 1000
                    );


                const minutes =
                    Math.floor(
                        seconds / 60
                    );


                const sec =
                    seconds % 60;


                document.getElementById(
                    "timer"
                ).textContent =

                    String(minutes)
                        .padStart(2, "0")
                    +
                    ":" +
                    String(sec)
                        .padStart(2, "0");

            },
            1000
        );

}


/* =========================================================
   HISTORY
   ========================================================= */

async function loadHistory() {

    const list =
        document.getElementById(
            "historyList"
        );


    if (!supabaseClient) {

        list.innerHTML =
            "<div style='color:#666'>" +
            "Supabase není nastavený" +
            "</div>";

        return;
    }


    const myName =
        getMyName();


    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from("calls")
                .select("*")
                .or(
                    "caller.eq." +
                    myName +
                    ",receiver.eq." +
                    myName
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                )
                .limit(20);


        if (error) {
            throw error;
        }


        if (!data || data.length === 0) {

            list.innerHTML =
                "<div style='color:#666'>" +
                "Žádné hovory" +
                "</div>";

            return;
        }


        list.innerHTML = "";


        data.forEach(
            call => {

                const other =
                    call.caller === myName
                        ? call.receiver
                        : call.caller;


                const direction =
                    call.caller === myName
                        ? "📤 Odchozí"
                        : "📥 Příchozí";


                const duration =
                    call.duration || 0;


                const minutes =
                    Math.floor(
                        duration / 60
                    );


                const seconds =
                    duration % 60;


                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "history-item";


                item.innerHTML =

                    "<div class='history-main'>" +
                    direction +
                    " • " +
                    escapeHtml(other) +
                    "</div>" +

                    "<div class='history-info'>" +
                    String(minutes)
                        .padStart(2, "0") +
                    ":" +
                    String(seconds)
                        .padStart(2, "0") +
                    "</div>";


                list.appendChild(
                    item
                );

            }
        );


    } catch(error) {

        console.error(
            "History:",
            error
        );


        list.innerHTML =
            "<div style='color:#666'>" +
            "Historii se nepodařilo načíst" +
            "</div>";

    }

}


/* =========================================================
   USERNAME
   ========================================================= */

function getMyName() {

    let name =
        localStorage.getItem(
            "sirtros_call_name"
        );


    if (!name) {

        name =
            prompt(
                "Zadej své uživatelské jméno:"
            );


        if (!name) {

            name =
                "SirTros";

        }


        localStorage.setItem(
            "sirtros_call_name",
            name
        );

    }


    document.getElementById(
        "currentName"
    ).textContent =
        name;


    return name;

}


/* =========================================================
   TARGET
   ========================================================= */

function saveTarget(
    target
) {

    localStorage.setItem(
        "sirtros_call_target",
        target
    );

}


function loadTarget() {

    const target =
        localStorage.getItem(
            "sirtros_call_target"
        );


    if (target) {

        document.getElementById(
            "target"
        ).value =
            target;

    }

}


/* =========================================================
   NOTIFICATION
   ========================================================= */

function showNotification(
    text
) {

    const notification =
        document.getElementById(
            "notification"
        );


    notification.innerHTML =
        text;


    notification.style.display =
        "block";


    setTimeout(
        () => {

            notification.style.display =
                "none";

        },
        3000
    );

}


/* =========================================================
   RING
   ========================================================= */

function playRing() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if (!AudioContext) {
            return;
        }


        const ctx =
            new AudioContext();


        const oscillator =
            ctx.createOscillator();


        const gain =
            ctx.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.value =
            700;


        gain.gain.value =
            0.08;


        oscillator.connect(
            gain
        );


        gain.connect(
            ctx.destination
        );


        oscillator.start();


        setTimeout(
            () => {

                oscillator.stop();

                ctx.close();

            },
            500
        );

    } catch(error) {

        console.log(
            "Ring není dostupný."
        );

    }

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(
    text
) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   START
   ========================================================= */

window.addEventListener(
    "load",
    () => {

        initSupabase();

        getMyName();

        loadTarget();

        loadHistory();

        /*
           Nekoušíme mikrofon automaticky.
           Uživatel klikne na "Povolit mikrofon",
           což je spolehlivější způsob získání oprávnění.
        */

        setInterval(
            checkIncomingCalls,
            2000
        );

    }
);

</script>
