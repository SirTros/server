<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibrace mobilem</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            background-color: #f0f0f0;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:active {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <!-- Tlačítko, které spustí vibraci -->
    <button onclick="rozvibruj()">Zavibruj!</button>

    <script>
        function rozvibruj() {
            // Kontrola, zda prohlížeč vibrace podporuje
            if ("vibrate" in navigator) {
                // Vibruje po dobu 500 milisekund (půl sekundy)
                navigator.vibrate(500);
            } else {
                alert("Tvůj prohlížeč nebo zařízení nepodporuje vibrace.");
            }
        }
    </script>

</body>
</html>
