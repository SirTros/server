<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ověření zařízení</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #101114;
    color: white;
    font-family: Arial, sans-serif;
}

.card {
    width: min(90%, 420px);
    background: #1b1d22;
    border-radius: 28px;
    padding: 35px 28px;
    text-align: center;
    box-shadow: 0 15px 50px rgba(0,0,0,.45);
}

.icon {
    width: 82px;
    height: 82px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #292c33;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
}

h1 {
    margin: 0 0 10px;
}

p {
    color: #b9bcc4;
    line-height: 1.5;
}

button {
    width: 100%;
    border: 0;
    border-radius: 18px;
    padding: 16px;
    margin-top: 15px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

#verify {
    background: white;
    color: #111;
}

#retry {
    display: none;
    background: #30333a;
    color: white;
}

#status {
    margin-top: 22px;
    font-size: 18px;
    font-weight: bold;
}

.success {
    color: #55e878;
}

.error {
    color: #ff6262;
}
</style>
</head>

<body>

<div class="card">

    <div class="icon" id="icon">🔐</div>

    <h1>Ověření zařízení</h1>

    <p id="description">
        Pro pokračování ověřte svou identitu pomocí zabezpečení tohoto zařízení.
    </p>

    <button id="verify">
        Ověřit zařízení
    </button>

    <button id="retry">
        Opakovat
    </button>

    <div id="status"></div>

</div>

<script>
const verifyButton = document.getElementById("verify");
const retryButton = document.getElementById("retry");
const statusText = document.getElementById("status");
const description = document.getElementById("description");
const icon = document.getElementById("icon");

async function verifyDevice() {

    statusText.textContent = "";
    statusText.className = "";

    if (!window.PublicKeyCredential) {
        showError("Toto zařízení nebo prohlížeč WebAuthn nepodporuje.");
        return;
    }

    try {

        const supported =
            await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();

        if (!supported) {
            showError("Ověření zařízení není dostupné.");
            return;
        }

        /*
         * Testovací WebAuthn přihlášení.
         * Prohlížeč může zobrazit systémové ověření
         * pomocí PINu, otisku nebo jiné dostupné metody.
         */

        const challenge = crypto.getRandomValues(
            new Uint8Array(32)
        );

        const userId = crypto.getRandomValues(
            new Uint8Array(16)
        );

        const credential = await navigator.credentials.create({
            publicKey: {
                challenge: challenge,

                rp: {
                    name: "Test ověření zařízení"
                },

                user: {
                    id: userId,
                    name: "test@example.com",
                    displayName: "Testovací uživatel"
                },

                pubKeyCredParams: [
                    {
                        type: "public-key",
                        alg: -7
                    },
                    {
                        type: "public-key",
                        alg: -257
                    }
                ],

                authenticatorSelection: {
                    authenticatorAttachment: "platform",
                    userVerification: "required"
                },

                timeout: 60000,

                attestation: "none"
            }
        });

        if (credential) {
            showSuccess();
        } else {
            showError("Nemůžete pokračovat");
        }

    } catch (error) {

        console.log(error);

        showError("Nemůžete pokračovat");

    }
}

function showSuccess() {

    icon.textContent = "✓";

    description.textContent =
        "Vaše zařízení bylo úspěšně ověřeno.";

    statusText.textContent =
        "Povoleno";

    statusText.className = "success";

    verifyButton.style.display = "none";
    retryButton.style.display = "block";
}

function showError(message) {

    icon.textContent = "✕";

    description.textContent =
        "Ověření se nepodařilo dokončit.";

    statusText.textContent =
        message;

    statusText.className = "error";

    verifyButton.style.display = "none";
    retryButton.style.display = "block";
}

function reset() {

    icon.textContent = "🔐";

    description.textContent =
        "Pro pokračování ověřte svou identitu pomocí zabezpečení tohoto zařízení.";

    statusText.textContent = "";
    statusText.className = "";

    verifyButton.style.display = "block";
    retryButton.style.display = "none";
}

verifyButton.addEventListener("click", verifyDevice);
retryButton.addEventListener("click", reset);

</script>

</body>
</html>
