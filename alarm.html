<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Person Recorder</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
body { margin:0; background:black; overflow:hidden; }
video { position:fixed; width:100vw; height:100vh; object-fit:cover; }
#ui {
  position:fixed;
  top:20px; left:20px;
  color:white;
  font-family:sans-serif;
  background:rgba(0,0,0,0.6);
  padding:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<div id="ui">Loading AI...</div>

<script>
const video = document.getElementById("video");
const ui = document.getElementById("ui");

let model;
let stream;

let recorder;
let chunks = [];
let recording = false;

let lastPerson = 0;

// camera
async function startCam(){
  stream = await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  video.srcObject = stream;
  await video.play();
}

// record
function startRecord(){
  chunks = [];
  recorder = new MediaRecorder(stream);

  recorder.ondataavailable = e => chunks.push(e.data);

  recorder.onstop = () => {
    const blob = new Blob(chunks, {type:"video/webm"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "record.webm";
    a.click();
  };

  recorder.start();
  recording = true;
}

function stopRecord(){
  if(recorder && recording){
    recorder.stop();
    recording = false;
  }
}

// AI loop
async function detect(){
  const preds = await model.detect(video);

  let person = preds.some(p => p.class === "person" && p.score > 0.6);

  if(person){
    lastPerson = Date.now();
    ui.innerText = "VIDÍM ČLOVĚKA 🔴";

    if(!recording) startRecord();
  } else {
    ui.innerText = "NIC NEDETEKUJI ⚪";
  }

  if(recording && Date.now() - lastPerson > 3000){
    ui.innerText = "STOP + DOWNLOAD ⛔";
    stopRecord();
  }

  requestAnimationFrame(detect);
}

async function main(){
  await startCam();
  model = await cocoSsd.load();

  ui.innerText = "READY";
  detect();
}

main();
</script>

</body>
</html>
