<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Privacy Display AI</title>

<style>
body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial;
    height:100vh;
}

#screen{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    transition:.4s;
}

.lock{
    filter:blur(15px);
    opacity:.2;
}

video{
    display:none;
}
</style>

</head>

<body>

<video id="video" autoplay muted playsinline></video>

<div id="screen">
    <h1>🔒 Privacy Display</h1>
    <h2>SirTros</h2>
    <p>Soukromý obsah</p>
</div>


<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


<script>

const video=document.getElementById("video");
const screen=document.getElementById("screen");


function privacy(on){
    if(on){
        screen.classList.add("lock");
    }else{
        screen.classList.remove("lock");
    }
}


const detector=new FaceDetection({
    locateFile:(file)=>{
        return "https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/"+file;
    }
});


detector.setOptions({
    model:"short",
    minDetectionConfidence:0.6
});


detector.onResults((result)=>{

    let faces=result.detections;


    if(!faces || faces.length!==1){
        privacy(true);
        return;
    }


    let face=faces[0].boundingBox;


    if(face.xCenter>0.3 && face.xCenter<0.7){
        privacy(false);
    }
    else{
        privacy(true);
    }

});



navigator.mediaDevices.getUserMedia({
    video:{
        facingMode:"user"
    }
})
.then(stream=>{
    video.srcObject=stream;
});



const camera=new Camera(video,{
    onFrame:async()=>{
        await detector.send({image:video});
    },
    width:640,
    height:480
});


camera.start();

</script>

</body>
</html>
