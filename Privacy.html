<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐑 BAAA / KLIŠ — BASS TEST</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #080b12;
    color: white;
    font-family: Arial, sans-serif;
}

.box {
    width: min(92%, 500px);
    padding: 30px;
    border-radius: 25px;
    background: #111827;
    text-align: center;
    box-shadow: 0 0 40px #000;
}

h1 {
    margin-top: 0;
}

#status {
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1f2937;
    border-radius: 20px;
    font-size: 42px;
    font-weight: bold;
    margin: 25px 0;
}

button {
    border: none;
    border-radius: 14px;
    padding: 15px 28px;
    margin: 5px;
    font-size: 18px;
    font-weight: bold;
    color: white;
    cursor: pointer;
}

#start {
    background: #16a34a;
}

#stop {
    background: #dc2626;
}

button:active {
    transform: scale(.96);
}

.volumeBox {
    margin-top: 25px;
    padding: 20px;
    background: #1f2937;
    border-radius: 18px;
}

input[type="range"] {
    width: 100%;
    margin-top: 15px;
}

#volumeText {
    margin-top: 8px;
    font-size: 20px;
}

.info {
    margin-top: 20px;
    font-size: 18px;
}
</style>
</head>

<body>

<div class="box">

    <h1>🐑 BASS BAAA / KLIŠ 🔊</h1>

    <div id="status">
        PŘIPRAVEN
    </div>

    <button id="start">▶ START</button>
    <button id="stop">⏹ STOP</button>

    <div class="info">
        Cyklus: <b id="count">0</b>
    </div>

    <div class="volumeBox">
        🔊 Hlasitost

        <input
            id="volume"
            type="range"
            min="0"
            max="100"
            value="70"
        >

        <div id="volumeText">
            70 %
        </div>
    </div>

</div>

<script>

let running = false;
let timer = null;
let count = 0;

let audioContext = null;

const status = document.getElementById("status");
const countEl = document.getElementById("count");
const volume = document.getElementById("volume");
const volumeText = document.getElementById("volumeText");


/* =========================
   BASOVÝ ZVUK
========================= */

function playBass(frequency, duration) {

    if (!audioContext) {
        audioContext = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    /*
       Velmi nízké frekvence = hlubší tón.
       Nejde o skutečné zesílení reproduktoru,
       telefon může velmi hluboké basy oříznout.
    */

    oscillator.type = "sine";
    oscillator.frequency.value = frequency;

    const volumeValue =
        Number(volume.value) / 100;

    gain.gain.setValueAtTime(
        0.001,
        audioContext.currentTime
    );

    gain.gain.linearRampToValueAtTime(
        volumeValue * 0.8,
        audioContext.currentTime + 0.05
    );

    gain.gain.setValueAtTime(
        volumeValue * 0.8,
        audioContext.currentTime + duration - 0.08
    );

    gain.gain.linearRampToValueAtTime(
        0.001,
        audioContext.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + duration
    );
}


/* =========================
   BAAA
========================= */

function baa() {

    status.textContent = "🐑 BAAA";

    // hluboký bas
    playBass(75, 0.8);
}


/* =========================
   KLIŠ
========================= */

function klis() {

    status.textContent = "🔊 KLIŠ";

    // trochu vyšší, ale stále hluboký bas
    playBass(55, 1.3);
}


/* =========================
   CYKLUS
========================= */

function cycle() {

    if (!running) return;

    // BAAA
    baa();

    timer = setTimeout(() => {

        if (!running) return;

        // KLIŠ
        klis();

        count++;
        countEl.textContent = count;

        timer = setTimeout(() => {

            if (!running) return;

            cycle();

        }, 2000);

    }, 1000);
}


/* =========================
   START
========================= */

document.getElementById("start").onclick =
async function() {

    if (running) return;

    running = true;

    if (!audioContext) {

        audioContext = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    if (audioContext.state === "suspended") {
        await audioContext.resume();
    }

    count = 0;
    countEl.textContent = "0";

    cycle();
};


/* =========================
   STOP
========================= */

document.getElementById("stop").onclick =
function() {

    running = false;

    clearTimeout(timer);

    status.textContent = "⏹ ZASTAVENO";
};


/* =========================
   HLASITOST
========================= */

volume.oninput = function() {

    volumeText.textContent =
        volume.value + " %";
};

</script>

</body>
</html>
