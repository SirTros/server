<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ouškův NFC Finder</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle at top, #19364b 0%, #071018 45%, #03070a 100%);

    color: white;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 520px;
    text-align: center;

    background: rgba(15, 27, 38, 0.96);

    border: 1px solid rgba(255,255,255,0.1);

    border-radius: 28px;

    padding: 35px 25px;

    box-shadow:
        0 25px 70px rgba(0,0,0,0.55);
}

.logo {
    font-size: 85px;

    animation:
        float 3s ease-in-out infinite;
}

@keyframes float {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}

h1 {
    margin: 10px 0 5px;

    font-size: 30px;
}

.subtitle {
    color: #9eb4c4;
    margin-bottom: 25px;
}

.status {
    padding: 22px;

    border-radius: 18px;

    background: #14232f;

    color: #b9c9d4;

    font-size: 17px;

    line-height: 1.5;

    margin-bottom: 20px;
}

.status.scanning {
    border: 1px solid #238cff;
    background: #102b40;
    color: #8fc9ff;
}

.status.success {
    border: 1px solid #35c76f;
    background: #10351f;
    color: #7df0a3;

    animation: successPulse 1.2s infinite;
}

@keyframes successPulse {

    0%, 100% {
        box-shadow: 0 0 0 rgba(53,199,111,0);
    }

    50% {
        box-shadow: 0 0 30px rgba(53,199,111,0.25);
    }
}

.status.error {
    border: 1px solid #d94b55;
    background: #351519;
    color: #ff9ba2;
}

button {
    width: 100%;

    border: 0;

    border-radius: 16px;

    padding: 17px;

    background: #1687e8;

    color: white;

    font-size: 17px;

    font-weight: 700;

    cursor: pointer;

    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
}

button:active {
    transform: scale(0.98);
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

.info {
    margin-top: 20px;

    color: #7890a0;

    font-size: 13px;

    line-height: 1.5;
}

.nfc-info {
    margin-top: 15px;

    padding: 12px;

    background: rgba(255,255,255,0.04);

    border-radius: 12px;

    color: #91a7b5;

    font-size: 13px;

    word-break: break-word;
}

.reset {
    margin-top: 12px;

    background: #253744;

    font-size: 14px;

    display: none;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        🐻
    </div>

    <h1>
        OUŠKŮV NFC FINDER
    </h1>

    <div class="subtitle">
        NFC detektor pro Ouška
    </div>

    <div
        id="status"
        class="status"
    >
        📡 NFC skenování není spuštěné.
    </div>

    <button
        id="scanButton"
    >
        📡 SPUSTIT NFC SKENOVÁNÍ
    </button>

    <button
        id="resetButton"
        class="reset"
    >
        🔄 SPUSTIT ZNOVU
    </button>

    <div
        id="nfcInfo"
        class="nfc-info"
        style="display:none;"
    ></div>

    <div class="info">
        Přilož NFC kartu nebo jiný kompatibilní NFC tag
        k zadní straně telefonu.
    </div>

</div>


<script>

const scanButton =
    document.getElementById("scanButton");

const resetButton =
    document.getElementById("resetButton");

const statusBox =
    document.getElementById("status");

const nfcInfo =
    document.getElementById("nfcInfo");


let ndef = null;


/* =========================================
   SPUŠTĚNÍ NFC
========================================= */

async function startNFC() {

    /*
        Kontrola podpory Web NFC
    */

    if (!("NDEFReader" in window)) {

        statusBox.className =
            "status error";

        statusBox.innerHTML =
            "❌ Tento prohlížeč nepodporuje Web NFC.<br><br>" +
            "Použij kompatibilní Android prohlížeč.";

        return;
    }


    try {

        ndef = new NDEFReader();


        /*
            Spustíme skenování
        */

        await ndef.scan();


        scanButton.disabled = true;

        resetButton.style.display =
            "none";


        statusBox.className =
            "status scanning";


        statusBox.innerHTML =
            "📡 <strong>NFC SKENOVÁNÍ AKTIVNÍ</strong><br><br>" +
            "Přilož NFC zařízení k telefonu.";


        /*
            NFC TAG NALEZEN
        */

        ndef.onreading = event => {

            console.log(
                "NFC zařízení nalezeno!"
            );


            console.log(
                "Serial:",
                event.serialNumber
            );


            /*
                LIBOVOLNÉ NFC = ÚSPĚCH
            */

            statusBox.className =
                "status success";


            statusBox.innerHTML =
                "🐻 <strong>OUŠKO NALEZENO!</strong><br><br>" +
                "NFC zařízení bylo úspěšně detekováno. 💙";


            /*
                Informace o tagu
            */

            nfcInfo.style.display =
                "block";


            nfcInfo.innerHTML =
                "📡 NFC zařízení detekováno<br>" +
                "ID: " +
                (
                    event.serialNumber ||
                    "neuvedeno"
                );


            /*
                Vibrace telefonu
            */

            if (
                "vibrate" in navigator
            ) {

                navigator.vibrate([
                    200,
                    100,
                    200
                ]);

            }


            /*
                Zvukové upozornění
            */

            playSuccessSound();


            /*
                Po nalezení necháme
                skener dál běžet.
            */

        };


        /*
            Chyba čtení NFC
        */

        ndef.onreadingerror = () => {

            statusBox.className =
                "status error";


            statusBox.innerHTML =
                "⚠️ NFC zařízení bylo zachyceno," +
                " ale nepodařilo se přečíst jeho obsah.<br><br>" +
                "Zkus ho přiložit znovu.";

        };

    }

    catch (error) {

        console.error(error);


        statusBox.className =
            "status error";


        statusBox.innerHTML =
            "❌ NFC skenování se nepodařilo spustit.<br><br>" +
            error.message;


        scanButton.disabled =
            false;

    }

}


/* =========================================
   ZVUK
========================================= */

function playSuccessSound() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if (!AudioContext) {
            return;
        }


        const audio =
            new AudioContext();


        const oscillator =
            audio.createOscillator();


        const gain =
            audio.createGain();


        oscillator.frequency.value =
            880;


        oscillator.type =
            "sine";


        gain.gain.value =
            0.12;


        oscillator.connect(gain);

        gain.connect(
            audio.destination
        );


        oscillator.start();


        setTimeout(() => {

            oscillator.frequency.value =
                1175;

        }, 150);


        setTimeout(() => {

            oscillator.stop();

            audio.close();

        }, 350);

    }

    catch (error) {

        console.log(
            "Zvuk nelze přehrát.",
            error
        );

    }

}


/* =========================================
   TLAČÍTKO START
========================================= */

scanButton.addEventListener(
    "click",
    startNFC
);


/* =========================================
   RESET
========================================= */

resetButton.addEventListener(
    "click",
    () => {

        location.reload();

    }
);

</script>

</body>
</html>
