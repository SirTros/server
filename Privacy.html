<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Privacy Display</title>

<style>
body {
    margin:0;
    background:#000;
    color:white;
    font-family:Arial;
    overflow:hidden;
}

#content {
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    transition:0.4s;
}

.blur {
    filter:blur(15px);
    opacity:0.25;
}

video {
    display:none;
}
</style>

</head>

<body>

<video id="camera" autoplay muted playsinline></video>

<div id="content">

<h1>SirTros</h1>

<h2>Privacy Display</h2>

<p>
🔒 Soukromý obsah
</p>

</div>


<script src="https://cdn.jsdelivr.net/npm/face-api.js"></script>


<script>

const video = document.getElementById("camera");
const content = document.getElementById("content");

let savedFace = localStorage.getItem("privacyFace");


// kamera
navigator.mediaDevices.getUserMedia({
    video:{
        facingMode:"user"
    }
})
.then(stream=>{
    video.srcObject = stream;
});



// načtení AI modelů

async function start(){

await faceapi.nets.tinyFaceDetector.loadFromUri(
"https://justadudewhohacks.github.io/face-api.js/models"
);

await faceapi.nets.faceLandmark68Net.loadFromUri(
"https://justadudewhohacks.github.io/face-api.js/models"
);

await faceapi.nets.faceRecognitionNet.loadFromUri(
"https://justadudewhohacks.github.io/face-api.js/models"
);


setInterval(checkFace,1000);

}


async function checkFace(){

if(video.readyState !== 4) return;


let result =
await faceapi
.detectSingleFace(
video,
new faceapi.TinyFaceDetectorOptions()
)
.withFaceLandmarks()
.withFaceDescriptor();



if(!result){

privacy(true);
return;

}



let descriptor =
Array.from(result.descriptor);



if(!savedFace){

localStorage.setItem(
"privacyFace",
JSON.stringify(descriptor)
);

savedFace =
JSON.stringify(descriptor);

privacy(false);

return;

}



let old =
new Float32Array(
JSON.parse(savedFace)
);



let distance =
faceapi.euclideanDistance(
old,
result.descriptor
);



if(distance > 0.55){

privacy(true);

}
else{

privacy(false);

}



}



function privacy(state){

if(state){

content.classList.add("blur");

}
else{

content.classList.remove("blur");

}

}


start();

</script>

</body>
</html>
