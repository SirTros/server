<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>Fotoaparát</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:white;
    font-family:Arial,Segoe UI,sans-serif;
}

#app{
    width:100%;
    height:100%;
    position:relative;
    background:#000;
    overflow:hidden;
}

/* =========================
   CAMERA
========================= */

#cameraView{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:#000;
}

#video{
    position:absolute;
    width:100%;
    height:100%;

    object-fit:cover;

    transform-origin:center center;

    will-change:transform;
}

/*
Skrytý canvas pro snímky
*/
#photoCanvas{
    display:none;
}

/* =========================
   TOP BAR
========================= */

#topBar{
    position:absolute;
    top:0;
    left:0;
    right:0;

    height:90px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:
        env(safe-area-inset-top)
        18px
        0
        18px;

    z-index:10;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.65),
            rgba(0,0,0,0)
        );
}

.topButton{
    width:44px;
    height:44px;

    border:0;
    border-radius:50%;

    background:rgba(0,0,0,.35);

    color:white;

    font-size:22px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.topButton:active{
    transform:scale(.88);
}

#flashIcon{
    font-size:20px;
}

#flashIcon.off{
    opacity:.45;
}

/* =========================
   ZOOM
========================= */

#zoomBar{
    position:absolute;

    left:50%;
    bottom:155px;

    transform:translateX(-50%);

    display:flex;
    align-items:center;
    gap:7px;

    padding:5px;

    border-radius:30px;

    background:rgba(0,0,0,.42);

    backdrop-filter:blur(12px);

    z-index:10;
}

.zoomButton{
    border:0;

    width:45px;
    height:35px;

    border-radius:20px;

    background:transparent;

    color:white;

    font-size:13px;
    font-weight:bold;
}

.zoomButton.active{
    background:#f6b91a;
    color:#000;
}

.zoomButton:active{
    transform:scale(.92);
}

/* =========================
   MODE BAR
========================= */

#modeBar{
    position:absolute;

    bottom:112px;

    left:0;
    right:0;

    display:flex;

    justify-content:center;

    gap:28px;

    z-index:10;
}

.mode{
    border:0;
    background:none;

    color:#aaa;

    font-size:14px;
    font-weight:bold;
}

.mode.active{
    color:white;
}

/* =========================
   BOTTOM
========================= */

#bottom{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:110px;

    padding-bottom:
        env(safe-area-inset-bottom);

    display:flex;
    align-items:center;
    justify-content:space-around;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.85),
            rgba(0,0,0,0)
        );

    z-index:10;
}

/* =========================
   SHUTTER
========================= */

#shutter{
    width:76px;
    height:76px;

    border-radius:50%;

    border:5px solid white;

    background:white;

    box-shadow:
        0 0 0 3px rgba(0,0,0,.35);

    transition:.12s;
}

#shutter.videoMode{
    border:5px solid white;
    background:#ff3b30;
}

#shutter:active{
    transform:scale(.88);
}

/* =========================
   SIDE BUTTONS
========================= */

.bottomButton{
    width:50px;
    height:50px;

    border:0;
    border-radius:50%;

    background:rgba(0,0,0,.4);

    color:white;

    font-size:23px;
}

.bottomButton:active{
    transform:scale(.88);
}

/* =========================
   GALLERY
========================= */

#galleryPreview{
    width:48px;
    height:48px;

    border-radius:12px;

    object-fit:cover;

    background:#222;

    border:2px solid white;

    display:none;
}

/* =========================
   FOCUS
========================= */

#focus{
    position:absolute;

    width:70px;
    height:70px;

    border:2px solid #ffd21c;

    border-radius:4px;

    display:none;

    transform:
        translate(-50%,-50%);

    z-index:8;

    pointer-events:none;

    animation:focusAnim .5s;
}

@keyframes focusAnim{

    0%{
        transform:
            translate(-50%,-50%)
            scale(1.3);
        opacity:0;
    }

    100%{
        transform:
            translate(-50%,-50%)
            scale(1);
        opacity:1;
    }

}

/* =========================
   START SCREEN
========================= */

#startScreen{
    position:absolute;
    inset:0;

    background:#000;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    z-index:100;
}

#startScreen h1{
    margin:0 0 8px;
    font-size:28px;
}

#startScreen p{
    margin:0 0 25px;
    color:#999;
}

#startCamera{
    border:0;

    padding:15px 26px;

    border-radius:30px;

    background:white;
    color:black;

    font-size:16px;
    font-weight:bold;
}

/* =========================
   RECORDING
========================= */

#recording{
    position:absolute;

    top:105px;
    left:50%;

    transform:translateX(-50%);

    display:none;

    align-items:center;
    gap:7px;

    padding:7px 12px;

    border-radius:20px;

    background:rgba(0,0,0,.5);

    font-size:13px;

    z-index:10;
}

#recordDot{
    width:9px;
    height:9px;

    border-radius:50%;

    background:#ff3b30;
}

/* =========================
   HIDDEN STABILIZATION
========================= */

#stabilizationStatus{
    position:absolute;

    width:1px;
    height:1px;

    overflow:hidden;

    opacity:0;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:700px){

    #cameraView{
        width:430px;
        height:calc(100% - 20px);

        top:10px;
        left:50%;

        transform:translateX(-50%);

        border-radius:25px;

        overflow:hidden;
    }

}

</style>
</head>

<body>

<div id="app">

    <!-- CAMERA -->

    <div id="cameraView">

        <video
            id="video"
            autoplay
            muted
            playsinline>
        </video>

        <canvas id="photoCanvas"></canvas>

        <div id="focus"></div>

        <div id="recording">
            <span id="recordDot"></span>
            <span id="recordTime">00:00</span>
        </div>

    </div>


    <!-- TOP -->

    <div id="topBar">

        <button
            class="topButton"
            id="flashButton">
            ⚡
        </button>

        <button
            class="topButton"
            id="settingsButton">
            ⚙
        </button>

    </div>


    <!-- ZOOM -->

    <div id="zoomBar">

        <button
            class="zoomButton"
            data-zoom="0.5">
            0.5×
        </button>

        <button
            class="zoomButton active"
            data-zoom="1">
            1×
        </button>

        <button
            class="zoomButton"
            data-zoom="2">
            2×
        </button>

    </div>


    <!-- MODES -->

    <div id="modeBar">

        <button
            class="mode"
            data-mode="video">
            VIDEO
        </button>

        <button
            class="mode active"
            data-mode="photo">
            FOTO
        </button>

    </div>


    <!-- BOTTOM -->

    <div id="bottom">

        <button
            class="bottomButton"
            id="galleryButton">
            🖼️
        </button>

        <img
            id="galleryPreview"
            alt=""
        >

        <button
            id="shutter">
        </button>

        <button
            class="bottomButton"
            id="switchCamera">
            🔄
        </button>

    </div>


    <!-- START -->

    <div id="startScreen">

        <h1>📷 Fotoaparát</h1>

        <p>
            Kamera se stabilizací
        </p>

        <button id="startCamera">
            Spustit fotoaparát
        </button>

    </div>


    <div id="stabilizationStatus">
        Stabilizace aktivní
    </div>

</div>


<script type="module">

/* =====================================================
   AI OBJECT DETECTOR
===================================================== */

import {
    ObjectDetector,
    FilesetResolver
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs";


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const cameraView =
    document.getElementById("cameraView");

const startScreen =
    document.getElementById("startScreen");

const startCamera =
    document.getElementById("startCamera");

const shutter =
    document.getElementById("shutter");

const switchCamera =
    document.getElementById("switchCamera");

const flashButton =
    document.getElementById("flashButton");

const focus =
    document.getElementById("focus");

const canvas =
    document.getElementById("photoCanvas");

const galleryPreview =
    document.getElementById("galleryPreview");

const recording =
    document.getElementById("recording");

const recordTime =
    document.getElementById("recordTime");


/* =====================================================
   CAMERA
===================================================== */

let stream = null;

let facingMode = "environment";

let currentZoom = 1;

let currentMode = "photo";

let flash = false;

let detector = null;


/* =====================================================
   STABILIZATION
===================================================== */

let stabilization = true;

let stableX = 0;

let stableY = 0;

let stableRotation = 0;

let wantedX = 0;

let wantedY = 0;

let wantedRotation = 0;


/* =====================================================
   OBJECT TRACKING
===================================================== */

let previousObjects = [];

let lastAI =
    0;


/* =====================================================
   GYRO
===================================================== */

let gyroEnabled = true;

let lastGamma = 0;

let gyroMovement = 0;


/* =====================================================
   START CAMERA
===================================================== */

startCamera.onclick =
    async () => {

        await openCamera();

    };


/* =====================================================
   OPEN CAMERA
===================================================== */

async function openCamera(){

    try{

        if(stream){

            stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }


        stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio:false,

                video:{

                    facingMode:{
                        ideal:
                            facingMode
                    },

                    width:{
                        ideal:1920
                    },

                    height:{
                        ideal:1080
                    },

                    frameRate:{
                        ideal:60,
                        max:60
                    }

                }

            });


        video.srcObject =
            stream;


        await video.play();


        startScreen.style.display =
            "none";


        await setupCameraZoom();


        /*
        AI načteme na pozadí.
        */

        loadAI();


        requestAnimationFrame(
            stabilizationLoop
        );


    }catch(error){

        console.error(error);

        alert(
            "Kamera není dostupná."
        );

    }

}


/* =====================================================
   CAMERA ZOOM
===================================================== */

async function setupCameraZoom(){

    if(!stream)
        return;


    const track =
        stream.getVideoTracks()[0];


    if(
        !track ||
        !track.getCapabilities
    ){

        return;

    }


    const capabilities =
        track.getCapabilities();


    if(!capabilities.zoom)
        return;


    /*
    Browser může mít jiný rozsah
    než klasické 0.5× / 1× / 2×.
    */

    const min =
        capabilities.zoom.min;

    const max =
        capabilities.zoom.max;


    let wanted =
        currentZoom;


    wanted =
        Math.max(
            min,
            Math.min(
                max,
                wanted
            )
        );


    try{

        await track.applyConstraints({

            advanced:[
                {
                    zoom:wanted
                }
            ]

        });

    }catch(error){

        console.log(
            "Hardware zoom není dostupný."
        );

    }

}


/* =====================================================
   ZOOM BUTTONS
===================================================== */

document
.querySelectorAll(".zoomButton")
.forEach(button => {

    button.onclick =
        async () => {

            const zoom =
                Number(
                    button.dataset.zoom
                );


            currentZoom =
                zoom;


            document
            .querySelectorAll(
                ".zoomButton"
            )
            .forEach(
                b =>
                    b.classList.remove(
                        "active"
                    )
            );


            button.classList.add(
                "active"
            );


            await setupCameraZoom();


            /*
            Pokud hardware zoom neumí,
            použijeme digitální zoom.
            */

            if(
                !stream ||
                !stream
                .getVideoTracks()[0]
                .getCapabilities
            ){

                applyDigitalZoom();

            }

        };

});


/* =====================================================
   DIGITAL ZOOM
===================================================== */

function applyDigitalZoom(){

    /*
    Hardware zoom má přednost.
    Tohle je pouze fallback.
    */

    if(currentZoom <= 1){

        video.style.zoom =
            1;

        return;

    }


    video.style.zoom =
        currentZoom;

}


/* =====================================================
   FLASH
===================================================== */

flashButton.onclick =
    () => {

        flash =
            !flash;


        flashButton.classList.toggle(
            "off",
            !flash
        );


        /*
        HTML kamera nemůže
        spolehlivě ovládat fyzický
        blesk na každém telefonu.
        */

        if(
            stream
        ){

            const track =
                stream.getVideoTracks()[0];


            if(
                track &&
                track.getCapabilities
            ){

                const capabilities =
                    track.getCapabilities();


                if(
                    capabilities.torch
                ){

                    track.applyConstraints({

                        advanced:[
                            {
                                torch:
                                    flash
                            }
                        ]

                    }).catch(
                        () => {}
                    );

                }

            }

        }

    };


/* =====================================================
   SWITCH CAMERA
===================================================== */

switchCamera.onclick =
    async () => {

        facingMode =
            facingMode ===
            "environment"
            ? "user"
            : "environment";


        await openCamera();

    };


/* =====================================================
   FOCUS
===================================================== */

cameraView.addEventListener(
    "click",
    event => {

        /*
        Nechceme fokusovat,
        když uživatel klikne na UI.
        */

        const rect =
            cameraView
            .getBoundingClientRect();


        const x =
            event.clientX -
            rect.left;


        const y =
            event.clientY -
            rect.top;


        focus.style.left =
            x + "px";


        focus.style.top =
            y + "px";


        focus.style.display =
            "block";


        clearTimeout(
            focus.hideTimer
        );


        focus.hideTimer =
            setTimeout(
                () => {

                    focus.style.display =
                        "none";

                },
                700
            );

    }
);


/* =====================================================
   MODES
===================================================== */

document
.querySelectorAll(".mode")
.forEach(button => {

    button.onclick =
        () => {

            currentMode =
                button.dataset.mode;


            document
            .querySelectorAll(".mode")
            .forEach(
                b =>
                    b.classList.remove(
                        "active"
                    )
            );


            button.classList.add(
                "active"
            );


            if(
                currentMode ===
                "video"
            ){

                shutter.classList.add(
                    "videoMode"
                );

            }else{

                shutter.classList.remove(
                    "videoMode"
                );

            }

        };

});


/* =====================================================
   PHOTO
===================================================== */

shutter.onclick =
    async () => {

        if(
            currentMode ===
            "photo"
        ){

            takePhoto();

        }else{

            toggleRecording();

        }

    };


/* =====================================================
   TAKE PHOTO
===================================================== */

function takePhoto(){

    if(
        video.readyState < 2
    ){

        return;

    }


    canvas.width =
        video.videoWidth;


    canvas.height =
        video.videoHeight;


    const c =
        canvas.getContext("2d");


    /*
    Zrcadlení přední kamery.
    */

    if(
        facingMode ===
        "user"
    ){

        c.save();

        c.translate(
            canvas.width,
            0
        );

        c.scale(
            -1,
            1
        );

    }


    c.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    if(
        facingMode ===
        "user"
    ){

        c.restore();

    }


    const image =
        canvas.toDataURL(
            "image/jpeg",
            .95
        );


    galleryPreview.src =
        image;


    galleryPreview.style.display =
        "block";


    /*
    Stažení fotografie.
    */

    const link =
        document.createElement(
            "a"
        );


    link.href =
        image;


    link.download =
        "foto-" +
        Date.now() +
        ".jpg";


    link.click();


    /*
    Malá animace spouště.
    */

    shutter.animate(
        [
            {
                transform:
                    "scale(1)"
            },

            {
                transform:
                    "scale(.82)"
            },

            {
                transform:
                    "scale(1)"
            }
        ],
        {
            duration:180
        }
    );

}


/* =====================================================
   VIDEO RECORDING
===================================================== */

let recorder = null;

let chunks = [];

let recordingStart = 0;

let recordingTimer = null;


function toggleRecording(){

    if(
        !recorder ||
        recorder.state ===
        "inactive"
    ){

        startRecording();

    }else{

        stopRecording();

    }

}


/* =====================================================
   START RECORD
===================================================== */

function startRecording(){

    if(!stream)
        return;


    chunks = [];


    try{

        recorder =
            new MediaRecorder(
                stream,
                {
                    mimeType:
                        "video/webm"
                }
            );


    }catch(error){

        recorder =
            new MediaRecorder(
                stream
            );

    }


    recorder.ondataavailable =
        event => {

            if(
                event.data.size > 0
            ){

                chunks.push(
                    event.data
                );

            }

        };


    recorder.onstop =
        saveVideo;


    recorder.start();


    recording.style.display =
        "flex";


    recordingStart =
        Date.now();


    recordingTimer =
        setInterval(
            updateRecordingTime,
            500
        );


    shutter.classList.add(
        "videoMode"
    );

}


/* =====================================================
   STOP RECORD
===================================================== */

function stopRecording(){

    if(
        recorder &&
        recorder.state !==
        "inactive"
    ){

        recorder.stop();

    }


    clearInterval(
        recordingTimer
    );


    recording.style.display =
        "none";


    recordTime.textContent =
        "00:00";


    shutter.classList.remove(
        "videoMode"
    );

}


/* =====================================================
   RECORD TIME
===================================================== */

function updateRecordingTime(){

    const seconds =
        Math.floor(
            (
                Date.now() -
                recordingStart
            ) / 1000
        );


    const min =
        String(
            Math.floor(
                seconds / 60
            )
        ).padStart(
            2,
            "0"
        );


    const sec =
        String(
            seconds % 60
        ).padStart(
            2,
            "0"
        );


    recordTime.textContent =
        min +
        ":" +
        sec;

}


/* =====================================================
   SAVE VIDEO
===================================================== */

function saveVideo(){

    const blob =
        new Blob(
            chunks,
            {
                type:
                    "video/webm"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        "video-" +
        Date.now() +
        ".webm";


    link.click();


    setTimeout(
        () => {

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );

}


/* =====================================================
   AI
===================================================== */

async function loadAI(){

    if(detector)
        return;


    try{

        const vision =
            await FilesetResolver
            .forVisionTasks(

                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

            );


        detector =
            await ObjectDetector
            .createFromOptions(
                vision,
                {

                    baseOptions:{

                        modelAssetPath:

                        "https://storage.googleapis.com/mediapipe-tasks/object_detector/efficientdet_lite0.tflite",

                        delegate:
                            "GPU"

                    },

                    runningMode:
                        "VIDEO",

                    maxResults:
                        8,

                    scoreThreshold:
                        .3

                }
            );


    }catch(error){

        console.log(
            "AI není dostupná:",
            error
        );

    }

}


/* =====================================================
   OBJECT DETECTION
===================================================== */

function detectMotion(){

    if(
        !detector ||
        video.readyState < 2
    ){

        return;

    }


    const now =
        performance.now();


    if(
        now -
        lastAI <
        90
    ){

        return;

    }


    lastAI =
        now;


    try{

        const result =
            detector.detectForVideo(
                video,
                now
            );


        if(
            !result.detections ||
            result.detections.length === 0
        ){

            return;

        }


        /*
        Největší objekt
        použijeme jako referenci.
        */

        let best = null;


        for(
            const detection
            of result.detections
        ){

            const box =
                detection.boundingBox;


            const score =
                detection
                .categories?.[0]
                ?.score || 0;


            if(!box)
                continue;


            const area =
                box.width *
                box.height;


            const value =
                area *
                score;


            if(
                !best ||
                value >
                best.value
            ){

                best = {
                    box,
                    value
                };

            }

        }


        if(!best)
            return;


        const box =
            best.box;


        const x =
            box.originX +
            box.width / 2;


        const y =
            box.originY +
            box.height / 2;


        const nx =
            x /
            video.videoWidth;


        const ny =
            y /
            video.videoHeight;


        /*
        Sledujeme změnu pozice
        objektu mezi snímky.
        */

        if(
            previousObjects.length
        ){

            const old =
                previousObjects[0];


            const dx =
                nx -
                old.x;


            const dy =
                ny -
                old.y;


            /*
            Opačný pohyb =
            stabilizace.
            */

            wantedX =
                dx *
                220;


            wantedY =
                dy *
                220;

        }


        previousObjects = [
            {
                x:nx,
                y:ny
            }
        ];


    }catch(error){

        console.log(error);

    }

}


/* =====================================================
   GYRO
===================================================== */

window.addEventListener(
    "deviceorientation",
    event => {

        if(
            !gyroEnabled
        )
            return;


        const gamma =
            event.gamma || 0;


        const difference =
            gamma -
            lastGamma;


        lastGamma =
            gamma;


        /*
        Nízkopásmový filtr.
        Malé náhodné změny ignorujeme.
        */

        if(
            Math.abs(
                difference
            ) <
            .08
        ){

            return;

        }


        gyroMovement +=
            difference;


        /*
        Opačná rotace.
        */

        wantedRotation =
            gyroMovement *
            .55;


        /*
        Pomalu vracíme nulovou hodnotu.
        */

        gyroMovement *=
            .94;

    },
    true
);


/* =====================================================
   SMOOTH
===================================================== */

function smooth(
    current,
    target,
    amount
){

    return current +
        (
            target -
            current
        ) *
        amount;

}


/* =====================================================
   STABILIZER LOOP
===================================================== */

function stabilizationLoop(){

    detectMotion();


    if(
        stabilization
    ){

        /*
        Pohyb postupně vyhladíme.
        */

        stableX =
            smooth(
                stableX,
                wantedX,
                .055
            );


        stableY =
            smooth(
                stableY,
                wantedY,
                .055
            );


        stableRotation =
            smooth(
                stableRotation,
                wantedRotation,
                .045
            );


        /*
        Omezíme maximální korekci.
        */

        stableX =
            Math.max(
                -35,
                Math.min(
                    35,
                    stableX
                )
            );


        stableY =
            Math.max(
                -35,
                Math.min(
                    35,
                    stableY
                )
            );


        stableRotation =
            Math.max(
                -5,
                Math.min(
                    5,
                    stableRotation
                )
            );


        /*
        1.12× = malý ořez,
        aby stabilizace měla
        místo pro pohyb obrazu.
        */

        video.style.transform =

            "translate(" +
            (-stableX) +
            "px," +
            (-stableY) +
            "px)" +

            " rotate(" +
            (-stableRotation) +
            "deg)" +

            " scale(1.12)";


        /*
        Po každém pohybu
        se korekce postupně vrací.
        */

        wantedX *=
            .92;


        wantedY *=
            .92;


        wantedRotation *=
            .92;

    }


    requestAnimationFrame(
        stabilizationLoop
    );

}

   GALLERY

galleryPreview.onclick =
    () => {

        if(
            galleryPreview.src
        ){

            window.open(
                galleryPreview.src,
                "_blank"
            );

        }

    };


/* =====================================================
   PREVENT DOUBLE TAP ZOOM
===================================================== */

let lastTap = 0;

document.addEventListener(
    "touchend",
    event => {

        const now =
            Date.now();


        if(
            now -
            lastTap <
            300
        ){

            event.preventDefault();

        }


        lastTap =
            now;

    },
    {
        passive:false
    }
);
