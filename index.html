<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>SirTros Compass</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    touch-action: none;
}

#compass {
    width: 100vw;
    height: 100dvh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* Stupnice */
#scale {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 90px;
    overflow: hidden;
    border-bottom: 1px solid #333;
}

#scaleInner {
    position: absolute;
    top: 0;
    height: 90px;
    display: flex;
    align-items: flex-end;
    transition: transform .08s linear;
}

.tick {
    width: 30px;
    height: 22px;
    border-left: 1px solid #777;
    position: relative;
}

.tick.major {
    height: 36px;
    border-left: 2px solid #fff;
}

.tick span {
    position: absolute;
    bottom: 42px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #aaa;
}

.tick.major span {
    color: #fff;
    font-size: 12px;
}

/* Středový ukazatel */
#indicator {
    position: absolute;
    top: 0;
    left: 50%;
    width: 2px;
    height: 90px;
    transform: translateX(-50%);
    background: #fff;
    z-index: 10;
}

/* Kompas */
#dial {
    width: min(78vw, 390px);
    height: min(78vw, 390px);
    border: 2px solid #444;
    border-radius: 50%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

#dial::before {
    content: "";
    position: absolute;
    width: 86%;
    height: 86%;
    border: 1px solid #222;
    border-radius: 50%;
}

.direction {
    position: absolute;
    font-size: 28px;
    font-weight: 700;
}

#north {
    top: 24px;
    color: #ff4b4b;
}

#south {
    bottom: 24px;
    color: #fff;
}

#east {
    right: 28px;
    color: #fff;
}

#west {
    left: 28px;
    color: #fff;
}

#needle {
    position: absolute;
    width: 4px;
    height: 78%;
    transform-origin: center;
    transition: transform .08s linear;
}

#needleNorth {
    position: absolute;
    top: 0;
    left: 50%;
    width: 0;
    height: 0;
    transform: translateX(-50%);
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-bottom: 125px solid #ff3333;
}

#needleSouth {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 0;
    height: 0;
    transform: translateX(-50%);
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 125px solid #ddd;
}

#center {
    width: 18px;
    height: 18px;
    background: #fff;
    border-radius: 50%;
    position: absolute;
    z-index: 5;
    box-shadow: 0 0 15px rgba(255,255,255,.3);
}

/* Hodnoty */
#info {
    position: absolute;
    bottom: 45px;
    left: 0;
    width: 100%;
    text-align: center;
}

#degrees {
    font-size: 48px;
    font-weight: 800;
    line-height: 1;
}

#cardinal {
    margin-top: 8px;
    font-size: 22px;
    font-weight: 600;
    color: #aaa;
}

#status {
    margin-top: 12px;
    font-size: 13px;
    color: #777;
}

/* Start tlačítko */
#start {
    position: absolute;
    inset: 0;
    z-index: 100;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 18px;
}

#start h1 {
    margin: 0;
    font-size: 30px;
}

#start p {
    margin: 0;
    color: #999;
    text-align: center;
    max-width: 330px;
    line-height: 1.5;
}

#start button {
    border: 0;
    border-radius: 999px;
    padding: 15px 30px;
    background: #fff;
    color: #000;
    font-weight: 700;
    font-size: 17px;
    cursor: pointer;
}

#error {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 200;
    background: #000;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
}

#errorBox {
    max-width: 400px;
}

#error h2 {
    margin-top: 0;
}

#error p {
    color: #aaa;
    line-height: 1.5;
}

#retry {
    border: 0;
    border-radius: 999px;
    padding: 13px 24px;
    background: #fff;
    color: #000;
    font-weight: 700;
}
</style>
</head>

<body>

<div id="compass">

    <div id="start">
        <div class="logo">🧭</div>
        <h1>Kompas</h1>
        <p>
            Pro správné fungování povol přístup k orientaci zařízení.
        </p>
        <button id="startButton">Spustit kompas</button>
    </div>

    <div id="error">
        <div id="errorBox">
            <h2>Kompas není dostupný</h2>
            <p id="errorText">
                Tento prohlížeč neposkytuje potřebný orientační senzor.
            </p>
            <button id="retry">Zkusit znovu</button>
        </div>
    </div>

    <div id="scale">
        <div id="scaleInner"></div>
        <div id="indicator"></div>
    </div>

    <div id="dial">

        <div id="north" class="direction">N</div>
        <div id="east" class="direction">E</div>
        <div id="south" class="direction">S</div>
        <div id="west" class="direction">W</div>

        <div id="needle">
            <div id="needleNorth"></div>
            <div id="needleSouth"></div>
        </div>

        <div id="center"></div>

    </div>

    <div id="info">
        <div id="degrees">---°</div>
        <div id="cardinal">Čekám na senzor…</div>
        <div id="status">Kompas není spuštěný</div>
    </div>

</div>

<script>
"use strict";

const degreesEl = document.getElementById("degrees");
const cardinalEl = document.getElementById("cardinal");
const statusEl = document.getElementById("status");

const start = document.getElementById("start");
const startButton = document.getElementById("startButton");

const error = document.getElementById("error");
const errorText = document.getElementById("errorText");
const retry = document.getElementById("retry");

const needle = document.getElementById("needle");
const scaleInner = document.getElementById("scaleInner");

let heading = null;
let running = false;

/* =========================
   STUPNICE
========================= */

function createScale() {

    scaleInner.innerHTML = "";

    /*
        360° + 360° + 360°
        aby šla stupnice plynule posouvat.
    */

    for (let i = -360; i <= 720; i += 10) {

        const tick = document.createElement("div");

        tick.className = "tick";

        if (i % 30 === 0) {
            tick.classList.add("major");

            const label = document.createElement("span");

            let value = ((i % 360) + 360) % 360;

            label.textContent = value + "°";

            tick.appendChild(label);
        }

        scaleInner.appendChild(tick);
    }
}

createScale();

/* =========================
   SMĚR
========================= */

function getDirection(deg) {

    if (deg >= 337.5 || deg < 22.5) {
        return "Sever";
    }

    if (deg >= 22.5 && deg < 67.5) {
        return "Severovýchod";
    }

    if (deg >= 67.5 && deg < 112.5) {
        return "Východ";
    }

    if (deg >= 112.5 && deg < 157.5) {
        return "Jihovýchod";
    }

    if (deg >= 157.5 && deg < 202.5) {
        return "Jih";
    }

    if (deg >= 202.5 && deg < 247.5) {
        return "Jihozápad";
    }

    if (deg >= 247.5 && deg < 292.5) {
        return "Západ";
    }

    return "Severozápad";
}

/* =========================
   NORMALIZACE
========================= */

function normalize(value) {

    value %= 360;

    if (value < 0) {
        value += 360;
    }

    return value;
}

/* =========================
   KOMPAS
========================= */

function updateCompass(value) {

    if (!Number.isFinite(value)) {
        return;
    }

    heading = normalize(value);

    const rounded = Math.round(heading);

    degreesEl.textContent =
        String(rounded).padStart(3, "0") + "°";

    cardinalEl.textContent = getDirection(heading);

    statusEl.textContent = "Senzor aktivní";

    /*
        Jehla ukazuje na sever.
        Když se telefon otočí třeba o 90°,
        otočíme jehlu opačným směrem.
    */

    needle.style.transform =
        "rotate(" + (-heading) + "deg)";

    /*
        Horní stupnice.
    */

    const center = window.innerWidth / 2;

    const pxPer10 = 30;

    const offset =
        center -
        (heading / 10) * pxPer10;

    scaleInner.style.transform =
        "translateX(" + offset + "px)";
}

/* =========================
   ORIENTACE
========================= */

function handleOrientation(event) {

    let value = null;

    /*
        iOS / některá zařízení
    */

    if (
        typeof event.webkitCompassHeading === "number" &&
        Number.isFinite(event.webkitCompassHeading)
    ) {

        value = event.webkitCompassHeading;

    } else if (
        typeof event.alpha === "number" &&
        Number.isFinite(event.alpha)
    ) {

        /*
            Android většinou:
            alpha = rotace kolem osy Z.

            Přibližný kompas:
            360 - alpha
        */

        value = 360 - event.alpha;
    }

    if (value !== null) {
        updateCompass(value);
    }
}

/* =========================
   START
========================= */

async function startCompass() {

    startButton.disabled = true;

    try {

        /*
            iOS vyžaduje povolení přes tlačítko.
        */

        if (
            typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function"
        ) {

            const permission =
                await DeviceOrientationEvent.requestPermission();

            if (permission !== "granted") {

                throw new Error(
                    "Přístup k orientaci nebyl povolen."
                );
            }
        }

        if (
            typeof DeviceOrientationEvent === "undefined"
        ) {

            throw new Error(
                "Tento prohlížeč nepodporuje DeviceOrientation."
            );
        }

        window.addEventListener(
            "deviceorientationabsolute",
            handleOrientation,
            true
        );

        window.addEventListener(
            "deviceorientation",
            handleOrientation,
            true
        );

        running = true;

        start.style.display = "none";

        statusEl.textContent =
            "Čekám na data ze senzoru…";

        /*
            Kontrola, jestli senzor skutečně něco posílá.
        */

        setTimeout(() => {

            if (
                running &&
                heading === null
            ) {

                showError(
                    "Prohlížeč neposílá údaje z kompasu. " +
                    "Zkontroluj oprávnění k senzorům nebo " +
                    "zkus jiný prohlížeč."
                );
            }

        }, 5000);

    } catch (e) {

        showError(
            e && e.message
                ? e.message
                : "Kompas se nepodařilo spustit."
        );
    }

    startButton.disabled = false;
}

/* =========================
   CHYBA
========================= */

function showError(message) {

    running = false;

    errorText.textContent = message;

    error.style.display = "flex";

    statusEl.textContent =
        "Senzor není dostupný";
}

/* =========================
   ZNOVU
========================= */

retry.addEventListener("click", () => {

    error.style.display = "none";

    heading = null;

    degreesEl.textContent = "---°";

    cardinalEl.textContent =
        "Čekám na senzor…";

    startCompass();
});

/* =========================
   START BUTTON
========================= */

startButton.addEventListener(
    "click",
    startCompass
);

/* =========================
   FULLSCREEN
========================= */

document.addEventListener("click", async () => {

    try {

        if (
            !document.fullscreenElement &&
            document.documentElement.requestFullscreen
        ) {
            await document.documentElement.requestFullscreen();
        }

    } catch {}
}, { once: true });

/* =========================
   WAKE LOCK
========================= */

let wakeLock = null;

async function keepAwake() {

    try {

        if (
            "wakeLock" in navigator &&
            !wakeLock
        ) {

            wakeLock =
                await navigator.wakeLock.request("screen");
        }

    } catch {}
}

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.visibilityState === "visible" &&
            running
        ) {
            keepAwake();
        }

    }
);

startButton.addEventListener(
    "click",
    keepAwake
);

</script>

</body>
</html>
