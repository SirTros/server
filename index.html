<!DOCTYPE html>
<html lang="cs">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pokladna OBCHOD</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,Segoe UI;
}


body{

margin:0;
background:#000;
color:white;
overflow:auto;

}



#fullscreenIntro,
#loginScreen,
#app{

display:none;
width:100%;
min-height:100vh;

flex-direction:column;
align-items:center;
justify-content:center;

}



#fullscreenIntro{

display:flex;

}




#fullscreenButton{

padding:15px 30px;

font-size:20px;

font-weight:bold;

background:cyan;

color:black;

border:0;

border-radius:10px;

}





#loadingScreen{

display:none;

position:fixed;

inset:0;

background:black;

z-index:999;

flex-direction:column;

align-items:center;

justify-content:center;

font-size:25px;

}




.loaderBar{

width:300px;

height:12px;

border:2px solid white;

border-radius:10px;

overflow:hidden;

}



.loaderFill{

height:100%;

width:0%;

background:cyan;

}



@keyframes load{

from{

width:0%;

}

to{

width:100%;

}

}





h1{

color:cyan;

}





input{

background:#111;

color:white;

border:2px solid cyan;

border-radius:8px;

padding:15px;

font-size:20px;

text-align:center;

}





button{

cursor:pointer;

font-weight:bold;

border:0;

border-radius:8px;

}





#loginButton,
.pro-button{

background:cyan;

color:black;

padding:12px 25px;

margin:10px;

}





#app{

display:none;

justify-content:flex-start;

padding:20px;

position:relative;

}




.lock-button{

position:absolute;

top:15px;

right:15px;

background:white;

color:black;

padding:10px;

}




#kodScanner{

width:300px;

margin:20px;

}





#zboziList{

list-style:none;

padding:0;

width:95%;

max-width:700px;

}





.addedItem{

background:#111;

border-left:4px solid cyan;

padding:12px;

margin:8px;

border-radius:8px;

display:flex;

justify-content:space-between;

align-items:center;

}




.removeBtn{

background:red;

color:white;

padding:8px;

}





#celkovaCena{

color:cyan;

}





#paymentWindow{

display:none;

position:fixed;

top:50%;

left:50%;

transform:translate(-50%,-50%);

background:#111;

border:2px solid cyan;

padding:25px;

border-radius:10px;

z-index:2000;

}





#zaplatitMessage{

display:none;

position:fixed;

top:50%;

left:50%;

transform:translate(-50%,-50%);

background:lime;

color:black;

padding:30px;

font-size:30px;

border-radius:15px;

z-index:3000;

}



</style>

</head>


<body>



<div id="fullscreenIntro">

<h2>Kioskový systém</h2>

<button id="fullscreenButton" onclick="requestFullscreenAndLoad()">

AKTIVOVAT POKLADNU

</button>

</div>




<div id="loadingScreen">

Načítání...

<div class="loaderBar">

<div class="loaderFill"></div>

</div>

</div>





<div id="loginScreen">

<h1>Zadejte PIN</h1>


<input 
id="loginInput"
type="password"
placeholder="PIN">



<button id="loginButton" onclick="login()">

VSTOUPIT

</button>


</div>







<div id="app">


<button class="lock-button" onclick="logout()">

🔒 ZAMKNOUT

</button>




<h1>🛒 POKLADNA</h1>




<input

id="kodScanner"

placeholder="Zadej KÓD + ENTER"

onkeydown="naskenovatKod(event)"

>




<ul id="zboziList">

</ul>




<h2 id="celkovaCena">

CELKEM: 0 Kč

</h2>





<button class="pro-button"

onclick="openPaymentWindow()">

💳 ZAPLATIT

</button>



<button class="pro-button"

style="background:red;color:white"

onclick="vymazatKosik()">

🗑 VYMAZAT KOŠÍK

</button>



</div>







<div id="paymentWindow">


<h2>

Celkem:

<span id="cashTotalDisplay">

0 Kč

</span>

</h2>



<button class="pro-button"

onclick="finishPayment()">

POTVRDIT PLATBU

</button>



<button class="pro-button"

onclick="closePaymentWindow()">

ZPĚT

</button>


</div>






<div id="zaplatitMessage">

ZAPLACENO ✔

</div>






<script>



const produktyData=[


{kod:1,nazev:"Clever pitná voda jemně perlivá 0,5l",cena:9.90},

{kod:2,nazev:"Vincentka 250ml",cena:24.90},

{kod:3,nazev:"Vlhčené ubrousky antibakteriální",cena:34.90},

{kod:4,nazev:"Nástavec na mop",cena:169.90},

{kod:5,nazev:"Toaletní papír 1ks",cena:8.90},

{kod:6,nazev:"Balíček kapesníků 3 vrstvý 10ks",cena:29.90},

{kod:7,nazev:"Krabice kapesníků",cena:34.90},

{kod:8,nazev:"Rohlík Vita 4ks",cena:22.90},

{kod:9,nazev:"Houska 4ks",cena:19.90},

{kod:10,nazev:"Kubík Water Pomeranč Perlivý",cena:19.90},

{kod:11,nazev:"Dupetky Rajče a Bylinky 70g",cena:24.90},

{kod:12,nazev:"Okurka s obalem 1ks",cena:24.90},

{kod:13,nazev:"Okurka nakládačka",cena:8.90},

{kod:14,nazev:"Banán",cena:7.90},

{kod:15,nazev:"Jablko",cena:8.90},

{kod:16,nazev:"Orbit máta",cena:29.90},

{kod:17,nazev:"Mentos rainbow",cena:21.90},

{kod:18,nazev:"Birell světlý nealkoholický",cena:19.90},

{kod:19,nazev:"Tatra plnotučné mléko",cena:29.90},

{kod:20,nazev:"Křehké plátky různé příchutě",cena:34.90},

{kod:21,nazev:"Mrkvový džus 100% šťáva Ovocňák",cena:39.90},

{kod:22,nazev:"Nescafé crema 100g",cena:149.90}



];


let celkem=0;



function naskenovatKod(event){


if(event.key==="Enter"){


let kod=document
.getElementById("kodScanner")
.value
.trim();



let produkt=produktyData.find(p=>

String(p.kod)===kod

);



if(produkt){

pridatProdukt(produkt);


}else{


alert("❌ Kód neexistuje");


}



document
.getElementById("kodScanner")
.value="";


}


}


function pridatProdukt(produkt){


    let existuje = [...document.querySelectorAll(".addedItem")]
    .find(item => item.dataset.kod == produkt.kod);



    if(existuje){


        let pocet = Number(existuje.dataset.pocet) + 1;


        existuje.dataset.pocet = pocet;



        existuje.querySelector(".kusy").innerText =
        pocet + " ks";



        existuje.querySelector(".cena").innerText =
        (pocet * produkt.cena).toFixed(2) + " Kč";



    }else{


        let li=document.createElement("li");


        li.className="addedItem";


        li.dataset.kod=produkt.kod;


        li.dataset.pocet=1;



        li.innerHTML=`

        <span>

        ${produkt.kod} - ${produkt.nazev}

        </span>



        <span>


        <b class="kusy">

        1 ks

        </b>


        <br>


        <b class="cena">

        ${produkt.cena.toFixed(2)} Kč

        </b>



        <br>


        <button

        class="removeBtn"

        onclick="odebratProdukt(this,${produkt.kod})">

        SMAZAT

        </button>



        </span>


        `;



        document
        .getElementById("zboziList")
        .prepend(li);



    }



    celkem += produkt.cena;


    aktualizovat();


}







function odebratProdukt(tlacitko,kod){



    let item = tlacitko.parentElement.parentElement;



    let produkt = produktyData.find(p =>

    p.kod == kod

    );



    let pocet = Number(item.dataset.pocet);





    if(pocet > 1){


        pocet--;


        item.dataset.pocet=pocet;



        item.querySelector(".kusy").innerText =
        pocet + " ks";



        item.querySelector(".cena").innerText =
        (pocet * produkt.cena).toFixed(2)+" Kč";



        celkem -= produkt.cena;



    }else{


        item.remove();


        celkem -= produkt.cena;


    }



    aktualizovat();


}







function vymazatKosik(){



    document
    .getElementById("zboziList")
    .innerHTML="";



    celkem=0;



    aktualizovat();



}







function aktualizovat(){



    document
    .getElementById("celkovaCena")
    .innerText =

    "CELKEM: " + celkem.toFixed(2) + " Kč";




    document
    .getElementById("cashTotalDisplay")
    .innerText =

    celkem.toFixed(2) + " Kč";



}


// FULLSCREEN + LOADING

async function requestFullscreenAndLoad(){


    if(document.documentElement.requestFullscreen){

        await document.documentElement.requestFullscreen();

    }



    document.getElementById("fullscreenIntro")
    .style.display="none";



    document.getElementById("loadingScreen")
    .style.display="flex";



    document.querySelector(".loaderFill")
    .style.animation="load 1s forwards";



    setTimeout(()=>{


        document.getElementById("loadingScreen")
        .style.display="none";



        document.getElementById("loginScreen")
        .style.display="flex";



    },1000);


}







// LOGIN PIN

function login(){


    let pin=document
    .getElementById("loginInput")
    .value;



    if(pin==="153500"){


        document.getElementById("loginScreen")
        .style.display="none";



        document.getElementById("app")
        .style.display="flex";



        document
        .getElementById("kodScanner")
        .focus();



    }else{


        alert("❌ Špatný PIN");


    }



    document
    .getElementById("loginInput")
    .value="";


}








// PLATBA


function openPaymentWindow(){


    if(celkem>0){


        document
        .getElementById("paymentWindow")
        .style.display="block";


    }else{


        alert("Košík je prázdný");


    }


}






function closePaymentWindow(){


    document
    .getElementById("paymentWindow")
    .style.display="none";


}






function finishPayment(){



    closePaymentWindow();



    document
    .getElementById("zaplatitMessage")
    .style.display="block";




    setTimeout(()=>{



        document
        .getElementById("zaplatitMessage")
        .style.display="none";



        vymazatKosik();



    },2000);



}







// ZAMKNOUT


function logout(){



    document
    .getElementById("app")
    .style.display="none";



    document
    .getElementById("fullscreenIntro")
    .style.display="flex";



    if(document.fullscreenElement){


        document.exitFullscreen();


    }


}






</script>


</body>

</html>
