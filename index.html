<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>SirTros Camera</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,Segoe UI,sans-serif;
}

#app{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
}

#video{
    position:absolute;
    left:-10%;
    top:-10%;
    width:120%;
    height:120%;
    object-fit:cover;
    transform-origin:center;
    will-change:transform;
    background:#000;
}

#top{
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:100px;
    padding:20px;
    display:flex;
    justify-content:space-between;
    z-index:20;
    background:linear-gradient(#000b,transparent);
}

.round{
    width:46px;
    height:46px;
    border:0;
    border-radius:50%;
    background:#0008;
    color:white;
    font-size:20px;
    backdrop-filter:blur(12px);
}

#zoom{
    position:absolute;
    left:50%;
    bottom:180px;
    transform:translateX(-50%);
    display:flex;
    gap:5px;
    padding:5px;
    border-radius:30px;
    background:#0008;
    backdrop-filter:blur(15px);
    z-index:20;
}

.zoom{
    width:52px;
    height:40px;
    border:0;
    border-radius:22px;
    color:white;
    background:transparent;
    font-weight:bold;
}

.zoom.active{
    background:#ffffff30;
}

#mode{
    position:absolute;
    left:0;
    right:0;
    bottom:115px;
    display:flex;
    justify-content:center;
    gap:35px;
    z-index:20;
    font-weight:bold;
    font-size:14px;
}

.mode{
    color:#888;
}

.mode.active{
    color:white;
}

#bottom{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:20;
    background:linear-gradient(transparent,#000d);
}

#shutter{
    width:80px;
    height:80px;
    border-radius:50%;
    border:5px solid #ddd;
    background:white;
}

#shutter.recording{
    background:#ff3b30;
    border-radius:22px;
}

.side{
    position:absolute;
    width:52px;
    height:52px;
    border:0;
    border-radius:50%;
    background:#0008;
    color:white;
    font-size:21px;
}

#flash{
    left:22px;
}

#switch{
    right:22px;
}

#status{
    position:absolute;
    top:90px;
    left:50%;
    transform:translateX(-50%);
    padding:9px 15px;
    border-radius:20px;
    background:#0009;
    font-size:13px;
    opacity:0;
    transition:.2s;
    z-index:50;
    white-space:nowrap;
}

#status.show{
    opacity:1;
}

#focus{
    position:absolute;
    width:65px;
    height:65px;
    border:2px solid #ffd60a;
    border-radius:8px;
    display:none;
    z-index:15;
    pointer-events:none;
}

#start{
    position:absolute;
    inset:0;
    z-index:100;
    background:#050505;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:30px;
}

#start h1{
    margin:0 0 10px;
    font-size:30px;
}

#start p{
    color:#aaa;
    max-width:330px;
    line-height:1.5;
}

#startButton{
    margin-top:20px;
    padding:15px 28px;
    border:0;
    border-radius:30px;
    background:white;
    color:black;
    font-size:16px;
    font-weight:bold;
}

#error{
    color:#ff6666;
    max-width:340px;
    margin-top:18px;
    font-size:13px;
}

#aiCanvas{
    position:fixed;
    left:-10000px;
    top:-10000px;
    width:320px;
    height:240px;
}
</style>
</head>

<body>

<div id="app">

    <video id="video"
           autoplay
           playsinline
           muted></video>

    <canvas id="aiCanvas"
            width="320"
            height="240"></canvas>

    <div id="focus"></div>

    <div id="top">

        <button class="round" id="close">
            ✕
        </button>

        <button class="round" id="settings">
            ⚙
        </button>

    </div>

    <div id="status"></div>

    <div id="zoom">

        <button class="zoom active" data-zoom="1">
            1×
        </button>

        <button class="zoom" data-zoom="2">
            2×
        </button>

    </div>

    <div id="mode">

        <span class="mode active" id="photoMode">
            FOTO
        </span>

        <span class="mode" id="videoMode">
            VIDEO
        </span>

    </div>

    <div id="bottom">

        <button class="side" id="flash">
            ⚡
        </button>

        <button id="shutter"></button>

        <button class="side" id="switch">
            🔄
        </button>

    </div>

    <div id="start">

        <h1>📷 Fotoaparát</h1>

        <p>
            Stabilizace používá senzory telefonu
            a lehké AI sledování objektů.
        </p>

        <button id="startButton">
            Spustit fotoaparát
        </button>

        <div id="error"></div>

    </div>

</div>

<script>

/* ======================================================
   ELEMENTY
====================================================== */

const video =
    document.getElementById("video");

const aiCanvas =
    document.getElementById("aiCanvas");

const aiCtx =
    aiCanvas.getContext("2d", {
        willReadFrequently:true
    });

const start =
    document.getElementById("start");

const startButton =
    document.getElementById("startButton");

const errorBox =
    document.getElementById("error");

const status =
    document.getElementById("status");

const shutter =
    document.getElementById("shutter");


/* ======================================================
   STAV
====================================================== */

let stream = null;

let facing = "environment";

let zoom = 1;

let mode = "photo";

let flash = false;

let recorder = null;

let chunks = [];


/* ======================================================
   STABILIZACE
====================================================== */

/*
   Důležité:

   Kamera NEJDE přes canvas.

   Video zůstává přímo <video>,
   takže je mnohem plynulejší.

   Canvas se používá pouze pro občasnou
   AI analýzu.
*/

let sensorX = 0;
let sensorY = 0;
let sensorRotation = 0;

let smoothX = 0;
let smoothY = 0;
let smoothRotation = 0;


/* ======================================================
   AI
====================================================== */

let aiModel = null;

let aiLoading = false;

let aiBusy = false;

let aiTimer = null;

let objectOffsetX = 0;

let objectOffsetY = 0;


/* ======================================================
   STATUS
====================================================== */

function showStatus(text){

    status.textContent = text;

    status.classList.add("show");

    clearTimeout(showStatus.timer);

    showStatus.timer =
        setTimeout(
            ()=>{
                status.classList.remove("show");
            },
            1500
        );
}


/* ======================================================
   SENSORY
====================================================== */

function onOrientation(e){

    if(typeof e.gamma !== "number")
        return;

    /*
       Gyroskop/orientace.

       Malé změny → stabilizace.
    */

    const rotation =
        Math.max(
            -2.5,
            Math.min(
                2.5,
                -e.gamma * 0.035
            )
        );

    sensorRotation =
        sensorRotation * 0.90 +
        rotation * 0.10;
}


function onMotion(e){

    const a =
        e.accelerationIncludingGravity;

    if(!a)
        return;

    if(typeof a.x === "number"){

        sensorX =
            sensorX * 0.92 +
            a.x * 0.08;

    }

    if(typeof a.y === "number"){

        sensorY =
            sensorY * 0.92 +
            a.y * 0.08;

    }

}


/* ======================================================
   STABILIZACE
====================================================== */

function stabilizationFrame(){

    /*
       senzory
    */

    const sensorMoveX =
        Math.max(
            -5,
            Math.min(
                5,
                sensorX * 0.8
            )
        );

    const sensorMoveY =
        Math.max(
            -5,
            Math.min(
                5,
                sensorY * 0.8
            )
        );


    /*
       AI objekt

       AI má mnohem menší váhu,
       aby nerozhodila obraz.
    */

    const wantedX =
        sensorMoveX +
        objectOffsetX * 0.35;

    const wantedY =
        sensorMoveY +
        objectOffsetY * 0.35;


    smoothX +=
        (wantedX - smoothX) * 0.08;

    smoothY +=
        (wantedY - smoothY) * 0.08;

    smoothRotation +=
        (sensorRotation - smoothRotation) * 0.08;


    /*
       Skrytá rezerva obrazu.

       120 % obrazu znamená,
       že stabilizátor má prostor
       pro pohyb bez černých okrajů.
    */

    video.style.transform =
        `
        translate3d(
            ${-smoothX}px,
            ${-smoothY}px,
            0
        )
        rotate(${-smoothRotation}deg)
        scale(${zoom})
        `;


    requestAnimationFrame(
        stabilizationFrame
    );
}


/* ======================================================
   AI
====================================================== */

async function loadAI(){

    /*
       TensorFlow a COCO-SSD se načtou
       až po spuštění kamery.
    */

    if(aiLoading || aiModel)
        return;

    aiLoading = true;

    try{

        /*
           Pokud knihovny nejsou načtené,
           AI prostě nebude blokovat kameru.
        */

        if(
            typeof tf === "undefined" ||
            typeof cocoSsd === "undefined"
        ){

            aiLoading = false;
            return;

        }


        await tf.ready();

        aiModel =
            await cocoSsd.load();


        showStatus(
            "AI stabilizace aktivní"
        );


        /*
           AI pouze 3× za sekundu.
           Kamera samotná běží nezávisle.
        */

        aiTimer =
            setInterval(
                detectObject,
                330
            );

    }catch(e){

        console.log(
            "AI chyba:",
            e
        );

    }

    aiLoading = false;
}


/* ======================================================
   DETEKCE OBJEKTU
====================================================== */

async function detectObject(){

    if(
        !aiModel ||
        aiBusy ||
        video.readyState < 2
    )
        return;


    aiBusy = true;

    try{

        /*
           malá kopie obrazu
           → mnohem menší zatížení
        */

        aiCtx.drawImage(
            video,
            0,
            0,
            320,
            240
        );


        const predictions =
            await aiModel.detect(
                aiCanvas,
                10,
                0.55
            );


        let best = null;

        for(
            const prediction
            of predictions
        ){

            if(
                prediction.score < 0.60
            )
                continue;


            const x =
                prediction.bbox[0];

            const y =
                prediction.bbox[1];

            const w =
                prediction.bbox[2];

            const h =
                prediction.bbox[3];


            const area =
                w * h;


            if(
                !best ||
                area > best.area
            ){

                best = {

                    x:x + w / 2,
                    y:y + h / 2,

                    area:area

                };

            }

        }


        if(best){

            /*
               rozdíl od středu obrazu
            */

            const dx =
                best.x - 160;

            const dy =
                best.y - 120;


            /*
               velmi slabá korekce.

               AI tedy nepřetahuje obraz.
            */

            objectOffsetX =
                objectOffsetX * 0.85 +
                dx * 0.015;


            objectOffsetY =
                objectOffsetY * 0.85 +
                dy * 0.015;


            objectOffsetX =
                Math.max(
                    -4,
                    Math.min(
                        4,
                        objectOffsetX
                    )
                );


            objectOffsetY =
                Math.max(
                    -4,
                    Math.min(
                        4,
                        objectOffsetY
                    )
                );

        }else{

            /*
               když objekt zmizí,
               AI korekce pomalu zmizí
            */

            objectOffsetX *= 0.90;
            objectOffsetY *= 0.90;

        }

    }catch(e){

        console.log(
            "AI detection error:",
            e
        );

    }

    aiBusy = false;
}


/* ======================================================
   KAMERA
====================================================== */

async function startCamera(){

    errorBox.textContent = "";


    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        errorBox.textContent =
            "Tento prohlížeč nepodporuje kameru.";

        return;

    }


    if(
        location.protocol !== "https:" &&
        location.hostname !== "localhost" &&
        location.hostname !== "127.0.0.1"
    ){

        errorBox.textContent =
            "Kamera potřebuje HTTPS nebo localhost.";

        return;

    }


    try{

        if(stream){

            stream
            .getTracks()
            .forEach(
                track=>track.stop()
            );

        }


        /*
           první pokus
        */

        try{

            stream =
                await navigator.mediaDevices
                .getUserMedia({

                    video:{

                        facingMode:{
                            ideal:facing
                        },

                        width:{
                            ideal:1280
                        },

                        height:{
                            ideal:720
                        },

                        frameRate:{
                            ideal:30,
                            max:30
                        }

                    },

                    audio:false

                });

        }catch(e){

            /*
               jednoduchý fallback
            */

            stream =
                await navigator.mediaDevices
                .getUserMedia({

                    video:{
                        facingMode:facing
                    },

                    audio:false

                });

        }


        video.srcObject =
            stream;


        await video.play();


        start.style.display =
            "none";


        showStatus(
            "Kamera spuštěna"
        );


        /*
           AI se načte až po spuštění
           a nikdy neblokuje kameru.
        */

        setTimeout(
            loadAI,
            500
        );


    }catch(e){

        console.error(e);


        if(
            e.name ===
            "NotAllowedError"
        ){

            errorBox.textContent =
                "Přístup ke kameře byl zamítnut. Povol kameru v prohlížeči.";

        }else if(
            e.name ===
            "NotFoundError"
        ){

            errorBox.textContent =
                "Kamera nebyla nalezena.";

        }else{

            errorBox.textContent =
                "Kamera se nepodařila spustit: "+
                e.message;

        }

    }

}


/* ======================================================
   START BUTTON
====================================================== */

startButton.addEventListener(
    "click",
    async()=>{

        /*
           senzory musí být na některých
           telefonech povoleny přímo
           po kliknutí.
        */

        try{

            if(
                typeof DeviceOrientationEvent !==
                "undefined" &&
                typeof DeviceOrientationEvent
                .requestPermission ===
                "function"
            ){

                await DeviceOrientationEvent
                    .requestPermission();

            }


            if(
                typeof DeviceMotionEvent !==
                "undefined" &&
                typeof DeviceMotionEvent
                .requestPermission ===
                "function"
            ){

                await DeviceMotionEvent
                    .requestPermission();

            }

        }catch(e){

            console.log(
                "Senzory:",
                e
            );

        }


        window.addEventListener(
            "deviceorientation",
            onOrientation,
            true
        );


        window.addEventListener(
            "devicemotion",
            onMotion,
            true
        );


        await startCamera();

    }
);


/* ======================================================
   ZOOM
====================================================== */

document
.querySelectorAll(".zoom")
.forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            zoom =
                Number(
                    button.dataset.zoom
                );


            document
            .querySelectorAll(".zoom")
            .forEach(b=>{

                b.classList.toggle(
                    "active",
                    b === button
                );

            });

        }
    );

});


/* ======================================================
   FOTO
====================================================== */

function takePhoto(){

    if(!video.videoWidth){

        showStatus(
            "Kamera není připravená"
        );

        return;

    }


    const photo =
        document.createElement(
            "canvas"
        );


    photo.width =
        video.videoWidth;

    photo.height =
        video.videoHeight;


    const pctx =
        photo.getContext("2d");


    /*
       Použije se aktuální obraz
       přímo z kamery.
    */

    pctx.drawImage(
        video,
        0,
        0,
        photo.width,
        photo.height
    );


    photo.toBlob(
        blob=>{

            if(!blob)
                return;


            const url =
                URL.createObjectURL(
                    blob
                );


            const a =
                document.createElement(
                    "a"
                );


            a.href = url;

            a.download =
                "foto-" +
                Date.now() +
                ".jpg";


            document.body.appendChild(a);

            a.click();

            a.remove();


            setTimeout(
                ()=>{
                    URL.revokeObjectURL(
                        url
                    );
                },
                1000
            );


            showStatus(
                "Fotka uložena 📸"
            );

        },
        "image/jpeg",
        0.95
    );

}


/* ======================================================
   VIDEO
====================================================== */

function startRecording(){

    if(
        !window.MediaRecorder
    ){

        showStatus(
            "Video není podporováno"
        );

        return;

    }


    let mime = "";


    const formats = [

        "video/webm;codecs=vp9",

        "video/webm;codecs=vp8",

        "video/webm"

    ];


    for(
        const format
        of formats
    ){

        if(
            MediaRecorder.isTypeSupported(
                format
            )
        ){

            mime = format;
            break;

        }

    }


    try{

        recorder =
            new MediaRecorder(
                stream,
                mime
                ? {
                    mimeType:mime
                }
                : undefined
            );

    }catch(e){

        showStatus(
            "Video se nepodařilo spustit"
        );

        return;

    }


    chunks=[];


    recorder.ondataavailable =
        event=>{

            if(
                event.data &&
                event.data.size
            ){

                chunks.push(
                    event.data
                );

            }

        };


    recorder.onstop =
        ()=>{

            const blob =
                new Blob(
                    chunks,
                    {
                        type:
                            recorder.mimeType ||
                            "video/webm"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const a =
                document.createElement(
                    "a"
                );


            a.href=url;

            a.download =
                "video-" +
                Date.now() +
                ".webm";


            a.click();


            setTimeout(
                ()=>{
                    URL.revokeObjectURL(
                        url
                    );
                },
                1000
            );


            showStatus(
                "Video uloženo 🎥"
            );

        };


    recorder.start();

    shutter.classList.add(
        "recording"
    );

    showStatus(
        "Nahrávání…"
    );

}


function stopRecording(){

    if(
        recorder &&
        recorder.state !==
        "inactive"
    ){

        recorder.stop();

    }


    shutter.classList.remove(
        "recording"
    );

}


/* ======================================================
   SHUTTER
====================================================== */

shutter.addEventListener(
    "click",
    ()=>{

        if(!stream){

            showStatus(
                "Nejdřív spusť kameru"
            );

            return;

        }


        if(mode === "photo"){

            takePhoto();

        }else{

            if(
                recorder &&
                recorder.state ===
                "recording"
            ){

                stopRecording();

            }else{

                startRecording();

            }

        }

    }
);


/* ======================================================
   REŽIM FOTO
====================================================== */

document
.getElementById("photoMode")
.addEventListener(
    "click",
    ()=>{

        mode="photo";

        document
        .getElementById("photoMode")
        .classList.add("active");

        document
        .getElementById("videoMode")
        .classList.remove("active");

    }
);


/* ======================================================
   REŽIM VIDEO
====================================================== */

document
.getElementById("videoMode")
.addEventListener(
    "click",
    ()=>{

        mode="video";

        document
        .getElementById("videoMode")
        .classList.add("active");

        document
        .getElementById("photoMode")
        .classList.remove("active");

    }
);


/* ======================================================
   PŘEPÍNÁNÍ KAMERY
====================================================== */

document
.getElementById("switch")
.addEventListener(
    "click",
    async()=>{

        facing =
            facing === "environment"
            ? "user"
            : "environment";


        await startCamera();

    }
);


/* ======================================================
   BLESK
====================================================== */

document
.getElementById("flash")
.addEventListener(
    "click",
    async()=>{

        if(!stream)
            return;


        const track =
            stream
            .getVideoTracks()[0];


        if(!track)
            return;


        if(!track.getCapabilities){

            showStatus(
                "Blesk není dostupný"
            );

            return;

        }


        const capabilities =
            track.getCapabilities();


        if(!capabilities.torch){

            showStatus(
                "Blesk není dostupný"
            );

            return;

        }


        flash = !flash;


        try{

            await track.applyConstraints({

                advanced:[
                    {
                        torch:flash
                    }
                ]

            });

        }catch(e){

            showStatus(
                "Blesk není podporován"
            );

        }

    }
);


/* ======================================================
   FOCUS
====================================================== */

document
.getElementById("app")
.addEventListener(
    "pointerdown",
    event=>{

        if(
            event.target.closest(
                "button"
            )
        )
            return;


        const focus =
            document.getElementById(
                "focus"
            );


        focus.style.left =
            (
                event.clientX - 32
            ) + "px";


        focus.style.top =
            (
                event.clientY - 32
            ) + "px";


        focus.style.display =
            "block";


        clearTimeout(
            focus.timer
        );


        focus.timer =
            setTimeout(
                ()=>{
                    focus.style.display =
                        "none";
                },
                900
            );

    }
);


/* ======================================================
   CLOSE
====================================================== */

document
.getElementById("close")
.addEventListener(
    "click",
    ()=>{

        if(stream){

            stream
            .getTracks()
            .forEach(
                t=>t.stop()
            );

        }


        video.srcObject=null;

        start.style.display =
            "flex";

    }
);


/* ======================================================
   SETTINGS
====================================================== */

document
.getElementById("settings")
.addEventListener(
    "click",
    ()=>{

        showStatus(
            aiModel
            ? "AI + senzory + stabilizace ✓"
            : "Senzory + stabilizace ✓"
        );

    }
);


/* ======================================================
   START STABILIZACE
====================================================== */

stabilizationFrame();

</script>
