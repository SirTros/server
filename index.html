<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Camera AI</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,Segoe UI,sans-serif;
}

#app{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#000;
}

#camera{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:#000;
}

#canvas{
    position:absolute;
    left:-12%;
    top:-12%;
    width:124%;
    height:124%;
    object-fit:cover;
    transform-origin:center center;
    will-change:transform;
}

#video{
    display:none;
}

#top{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:100px;
    padding:22px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    z-index:10;
    background:linear-gradient(#0008,transparent);
}

.btn{
    width:46px;
    height:46px;
    border:0;
    border-radius:50%;
    background:#0007;
    color:#fff;
    font-size:20px;
    backdrop-filter:blur(15px);
}

#zoom{
    position:absolute;
    bottom:178px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:8px;
    padding:6px;
    border-radius:30px;
    background:#0007;
    backdrop-filter:blur(15px);
    z-index:10;
}

.zoom{
    min-width:50px;
    height:40px;
    border:0;
    border-radius:22px;
    background:transparent;
    color:#fff;
    font-weight:bold;
}

.zoom.active{
    background:#ffffff35;
}

#bottom{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:145px;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
    background:linear-gradient(transparent,#000c);
}

#shutter{
    width:78px;
    height:78px;
    border-radius:50%;
    border:5px solid #ddd;
    background:#fff;
}

#shutter.recording{
    background:#f33;
    border-radius:22px;
}

.side{
    position:absolute;
    width:52px;
    height:52px;
    border:0;
    border-radius:50%;
    background:#0007;
    color:white;
    font-size:21px;
}

#flash{
    left:24px;
}

#switch{
    right:24px;
}

#mode{
    position:absolute;
    bottom:112px;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    gap:35px;
    z-index:11;
    font-size:14px;
    font-weight:bold;
}

.mode{
    color:#999;
}

.mode.active{
    color:#fff;
}

#focus{
    position:absolute;
    width:65px;
    height:65px;
    border:2px solid #ffd60a;
    border-radius:8px;
    display:none;
    pointer-events:none;
    z-index:9;
}

#status{
    position:absolute;
    top:90px;
    left:50%;
    transform:translateX(-50%);
    background:#0009;
    padding:9px 15px;
    border-radius:20px;
    font-size:13px;
    opacity:0;
    transition:.2s;
    z-index:50;
    white-space:nowrap;
}

#status.show{
    opacity:1;
}

#start{
    position:absolute;
    inset:0;
    background:#050505;
    z-index:100;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:30px;
    text-align:center;
}

#start h1{
    font-size:30px;
    margin:0 0 10px;
}

#start p{
    color:#aaa;
    max-width:330px;
    line-height:1.5;
}

#startButton{
    margin-top:20px;
    padding:15px 27px;
    border:0;
    border-radius:30px;
    background:#fff;
    color:#000;
    font-weight:bold;
    font-size:16px;
}

#error{
    color:#ff6868;
    max-width:340px;
    margin-top:18px;
    font-size:13px;
}

#ai{
    position:absolute;
    left:-9999px;
    top:-9999px;
    width:320px;
    height:240px;
}
</style>
</head>

<body>

<div id="app">

    <div id="camera">

        <video id="video"
               autoplay
               playsinline
               muted></video>

        <canvas id="canvas"></canvas>

        <canvas id="ai"></canvas>

        <div id="focus"></div>

    </div>

    <div id="top">
        <button class="btn" id="close">✕</button>
        <button class="btn" id="settings">⚙</button>
    </div>

    <div id="status"></div>

    <div id="zoom">
        <button class="zoom active" data-z="1">1×</button>
        <button class="zoom" data-z="2">2×</button>
    </div>

    <div id="mode">
        <span class="mode active" id="photo">FOTO</span>
        <span class="mode" id="videoMode">VIDEO</span>
    </div>

    <div id="bottom">

        <button class="side" id="flash">⚡</button>

        <button id="shutter"></button>

        <button class="side" id="switch">🔄</button>

    </div>

    <div id="start">

        <h1>📷 Fotoaparát</h1>

        <p>
            Stabilizace používá gyroskop,
            akcelerometr, orientaci telefonu
            a AI sledování objektů.
        </p>

        <button id="startButton">
            Spustit fotoaparát
        </button>

        <div id="error"></div>

    </div>

</div>

<script>

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const aiCanvas=document.getElementById("ai");
const aiCtx=aiCanvas.getContext("2d");

const start=document.getElementById("start");
const startButton=document.getElementById("startButton");
const error=document.getElementById("error");

const status=document.getElementById("status");

const shutter=document.getElementById("shutter");

let stream=null;
let facing="environment";

let zoom=1;

let mode="photo";

let recorder=null;
let chunks=[];

let aiModel=null;
let aiRunning=false;

let flash=false;


/* =========================================
   STABILIZACE
========================================= */

let gyroX=0;
let gyroY=0;

let accelX=0;
let accelY=0;

let targetX=0;
let targetY=0;

let smoothX=0;
let smoothY=0;

let targetRotation=0;
let smoothRotation=0;

let objectX=0;
let objectY=0;

let haveObject=false;

const MAX_X=7;
const MAX_Y=7;
const MAX_ROTATION=2.5;


/* =========================================
   STATUS
========================================= */

function showStatus(t){

    status.textContent=t;
    status.classList.add("show");

    clearTimeout(showStatus.timer);

    showStatus.timer=setTimeout(()=>{
        status.classList.remove("show");
    },1800);
}


/* =========================================
   SENSORS
========================================= */

function orientation(e){

    if(typeof e.gamma!=="number") return;

    gyroX=e.gamma;
    gyroY=e.beta || 0;

    targetRotation=
        Math.max(
            -MAX_ROTATION,
            Math.min(
                MAX_ROTATION,
                -gyroX*0.035
            )
        );
}

function motion(e){

    const a=e.accelerationIncludingGravity;

    if(!a) return;

    if(typeof a.x==="number")
        accelX=a.x;

    if(typeof a.y==="number")
        accelY=a.y;

    /*
       Akcelerometr pomáhá proti malým
       rychlým pohybům telefonu.
    */

    targetX += accelX*0.018;
    targetY += accelY*0.018;

    targetX=Math.max(
        -MAX_X,
        Math.min(MAX_X,targetX)
    );

    targetY=Math.max(
        -MAX_Y,
        Math.min(MAX_Y,targetY)
    );
}


/* =========================================
   AI OBJECT TRACKING
========================================= */

async function loadAI(){

    try{

        showStatus("Načítám AI…");

        await tf.ready();

        aiModel=await cocoSsd.load();

        showStatus("AI stabilizace připravena");

    }catch(e){

        console.log("AI:",e);

        /*
           Kamera funguje i bez AI.
        */

        showStatus("Kamera spuštěna");

    }

}


/*
   AI nehledá rámečky na displeji.
   Pouze si interně zapamatuje objekt
   a podle jeho pohybu upravuje obraz.
*/

async function detectObjects(){

    if(
        !aiModel ||
        !video.videoWidth ||
        aiRunning
    ) return;

    aiRunning=true;

    try{

        aiCanvas.width=320;
        aiCanvas.height=240;

        aiCtx.drawImage(
            video,
            0,
            0,
            320,
            240
        );

        const predictions=
            await aiModel.detect(aiCanvas);

        /*
           Vybereme největší dobře rozpoznaný
           objekt v obrazu.
        */

        let best=null;

        for(const p of predictions){

            if(p.score<0.55) continue;

            const area=
                p.bbox[2]*p.bbox[3];

            if(!best || area>best.area){

                best={
                    x:p.bbox[0]+p.bbox[2]/2,
                    y:p.bbox[1]+p.bbox[3]/2,
                    area:area
                };

            }

        }


        if(best){

            const centerX=160;
            const centerY=120;

            const dx=
                best.x-centerX;

            const dy=
                best.y-centerY;


            /*
               Objekt se snažíme držet stabilně
               uprostřed bez viditelných rámečků.
            */

            objectX += dx*0.0025;
            objectY += dy*0.0025;

            objectX=Math.max(
                -5,
                Math.min(5,objectX)
            );

            objectY=Math.max(
                -5,
                Math.min(5,objectY)
            );

            haveObject=true;

        }

    }catch(e){

        console.log("AI detection:",e);

    }

    aiRunning=false;

}


/* =========================================
   STABILIZAČNÍ SMYČKA
========================================= */

function stabilize(){

    /*
       pomalé uklidnění senzoru
    */

    targetX*=0.985;
    targetY*=0.985;

    objectX*=0.992;
    objectY*=0.992;


    const finalX=
        targetX + objectX;

    const finalY=
        targetY + objectY;


    smoothX +=
        (finalX-smoothX)*0.12;

    smoothY +=
        (finalY-smoothY)*0.12;

    smoothRotation +=
        (targetRotation-smoothRotation)*0.08;


    /*
       Skrytá rezerva obrazu = přibližně
       "0.5× prostor", který stabilizace používá.
    */

    canvas.style.transform=
        `
        translate3d(
            ${-smoothX}px,
            ${-smoothY}px,
            0
        )
        rotate(${-smoothRotation}deg)
        scale(${zoom})
        `;


    requestAnimationFrame(stabilize);
}


/* =========================================
   CAMERA
========================================= */

async function startCamera(){

    error.textContent="";

    if(!window.isSecureContext){

        error.textContent=
            "Kamera potřebuje HTTPS nebo localhost. " +
            "Spusť stránku přes VS Code Live Server.";

        return;
    }

    if(!navigator.mediaDevices?.getUserMedia){

        error.textContent=
            "Tento prohlížeč nepodporuje kameru.";

        return;
    }


    try{

        if(stream){

            stream
            .getTracks()
            .forEach(t=>t.stop());

        }


        try{

            stream=
                await navigator.mediaDevices.getUserMedia({

                    video:{
                        facingMode:{
                            ideal:facing
                        },

                        width:{
                            ideal:1920
                        },

                        height:{
                            ideal:1080
                        },

                        frameRate:{
                            ideal:60,
                            max:60
                        }
                    },

                    audio:false

                });

        }catch(e){

            stream=
                await navigator.mediaDevices.getUserMedia({

                    video:{
                        facingMode:facing
                    },

                    audio:false

                });

        }


        video.srcObject=stream;

        await video.play();


        canvas.width=
            video.videoWidth;

        canvas.height=
            video.videoHeight;


        start.style.display="none";

        showStatus("Kamera spuštěna");

        /*
           Automatická AI detekce
           přibližně 5× za sekundu.
        */

        setInterval(
            detectObjects,
            200
        );

    }catch(e){

        console.error(e);

        if(e.name==="NotAllowedError"){

            error.textContent=
                "Přístup ke kameře byl zamítnut. " +
                "Povol kameru v nastavení prohlížeče.";

        }else if(e.name==="NotFoundError"){

            error.textContent=
                "Kamera nebyla nalezena.";

        }else{

            error.textContent=
                "Kameru se nepodařilo spustit: "+
                e.message;

        }

    }

}


/* =========================================
   DRAW CAMERA
========================================= */

function draw(){

    if(video.readyState>=2){

        ctx.save();

        /*
           obraz se vykresluje větší než displej,
           aby stabilizace měla prostor.
        */

        ctx.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.restore();

    }

    requestAnimationFrame(draw);
}


/* =========================================
   ZOOM
========================================= */

document.querySelectorAll(".zoom")
.forEach(button=>{

    button.addEventListener("click",()=>{

        zoom=
            Number(button.dataset.z);

        document
        .querySelectorAll(".zoom")
        .forEach(x=>{
            x.classList.toggle(
                "active",
                Number(x.dataset.z)===zoom
            );
        });

    });

});


/* =========================================
   START
========================================= */

startButton.addEventListener(
    "click",
    async()=>{

        /*
           iPhone/iPad vyžaduje povolení
           senzorů přímo po kliknutí.
        */

        try{

            if(
                typeof DeviceOrientationEvent!=="undefined" &&
                typeof DeviceOrientationEvent.requestPermission==="function"
            ){

                await DeviceOrientationEvent
                    .requestPermission();

            }

            if(
                typeof DeviceMotionEvent!=="undefined" &&
                typeof DeviceMotionEvent.requestPermission==="function"
            ){

                await DeviceMotionEvent
                    .requestPermission();

            }

        }catch(e){

            console.log("Sensor permission:",e);

        }


        window.addEventListener(
            "deviceorientation",
            orientation,
            true
        );

        window.addEventListener(
            "devicemotion",
            motion,
            true
        );


        await startCamera();

        loadAI();

    }
);


/* =========================================
   SHUTTER
========================================= */

shutter.addEventListener(
    "click",
    ()=>{

        if(!stream){

            showStatus("Spusť nejdřív kameru");

            return;
        }

        if(mode==="photo"){

            takePhoto();

        }else{

            if(
                recorder &&
                recorder.state==="recording"
            ){

                stopVideo();

            }else{

                startVideo();

            }

        }

    }
);


/* =========================================
   PHOTO
========================================= */

function takePhoto(){

    const out=
        document.createElement("canvas");

    out.width=video.videoWidth;
    out.height=video.videoHeight;

    const c=
        out.getContext("2d");


    if(facing==="user"){

        c.translate(
            out.width,
            0
        );

        c.scale(-1,1);

    }


    c.drawImage(
        video,
        0,
        0,
        out.width,
        out.height
    );


    out.toBlob(
        blob=>{

            const url=
                URL.createObjectURL(blob);

            const a=
                document.createElement("a");

            a.href=url;
            a.download=
                "foto-"+Date.now()+".jpg";

            a.click();

            setTimeout(
                ()=>URL.revokeObjectURL(url),
                1000
            );

            showStatus("Fotka uložena 📸");

        },
        "image/jpeg",
        0.95
    );

}


/* =========================================
   VIDEO
========================================= */

function startVideo(){

    if(!window.MediaRecorder){

        showStatus(
            "Video není podporováno"
        );

        return;
    }


    let type="";


    const types=[
        "video/webm;codecs=vp9",
        "video/webm;codecs=vp8",
        "video/webm"
    ];


    for(const t of types){

        if(
            MediaRecorder.isTypeSupported &&
            MediaRecorder.isTypeSupported(t)
        ){

            type=t;
            break;

        }

    }


    try{

        recorder=
            new MediaRecorder(
                stream,
                type
                ? {mimeType:type}
                : undefined
            );

    }catch(e){

        showStatus(
            "Video se nepodařilo spustit"
        );

        return;

    }


    chunks=[];


    recorder.ondataavailable=e=>{

        if(e.data.size)
            chunks.push(e.data);

    };


    recorder.onstop=()=>{

        const blob=
            new Blob(
                chunks,
                {
                    type:
                        recorder.mimeType ||
                        "video/webm"
                }
            );


        const url=
            URL.createObjectURL(blob);

        const a=
            document.createElement("a");

        a.href=url;
        a.download=
            "video-"+Date.now()+".webm";

        a.click();

        setTimeout(
            ()=>URL.revokeObjectURL(url),
            1000
        );

        showStatus("Video uloženo 🎥");

    };


    recorder.start();

    shutter.classList.add("recording");

    showStatus("Nahrávání…");

}


function stopVideo(){

    if(
        recorder &&
        recorder.state!=="inactive"
    ){

        recorder.stop();

    }

    shutter.classList.remove(
        "recording"
    );

}


/* =========================================
   MODES
========================================= */

document.getElementById("photo")
.addEventListener("click",()=>{

    mode="photo";

    document
    .getElementById("photo")
    .classList.add("active");

    document
    .getElementById("videoMode")
    .classList.remove("active");

});


document.getElementById("videoMode")
.addEventListener("click",()=>{

    mode="video";

    document
    .getElementById("videoMode")
    .classList.add("active");

    document
    .getElementById("photo")
    .classList.remove("active");

});


/* =========================================
   SWITCH CAMERA
========================================= */

document.getElementById("switch")
.addEventListener("click",async()=>{

    facing=
        facing==="environment"
        ? "user"
        : "environment";

    await startCamera();

});


/* =========================================
   FLASH
========================================= */

document.getElementById("flash")
.addEventListener("click",async()=>{

    if(!stream) return;

    const track=
        stream.getVideoTracks()[0];

    if(!track) return;

    const caps=
        track.getCapabilities
        ? track.getCapabilities()
        : {};


    if(!caps.torch){

        showStatus(
            "Blesk není dostupný"
        );

        return;
    }


    flash=!flash;


    try{

        await track.applyConstraints({

            advanced:[
                {
                    torch:flash
                }
            ]

        });

    }catch(e){

        showStatus(
            "Blesk není podporován"
        );

    }

});


/* =========================================
   FOCUS
========================================= */

document
.getElementById("camera")
.addEventListener(
    "pointerdown",
    e=>{

        if(e.target.closest("button"))
            return;


        const rect=
            document
            .getElementById("camera")
            .getBoundingClientRect();


        const x=
            e.clientX-rect.left;

        const y=
            e.clientY-rect.top;


        const focus=
            document.getElementById("focus");


        focus.style.left=
            (x-32)+"px";

        focus.style.top=
            (y-32)+"px";

        focus.style.display="block";


        clearTimeout(focus.timer);

        focus.timer=
            setTimeout(
                ()=>focus.style.display="none",
                900
            );

    }
);


/* =========================================
   CLOSE
========================================= */

document.getElementById("close")
.addEventListener("click",()=>{

    if(stream){

        stream
        .getTracks()
        .forEach(t=>t.stop());

    }

    video.srcObject=null;

    start.style.display="flex";

});


/* =========================================
   SETTINGS
========================================= */

document.getElementById("settings")
.addEventListener("click",()=>{

    showStatus(
        "AI + senzory + stabilizace jsou aktivní"
    );

});


/* =========================================
   START RENDER
========================================= */

draw();

stabilize();

</script>

</body>
</html>
