<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pokladna OBCHOD</title>
<style>
    /* Zajištění, aby se prvky nepřekrývaly */
    body { font-family: Arial, sans-serif; background: #000; color: white; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    
    #fullscreenIntro, #loginScreen, #app { 
        display: none; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        width: 100%; 
        height: 100%; 
    }

    /* Úvodní obrazovka musí být vidět jako první */
    #fullscreenIntro { display: flex; }

    #fullscreenButton { padding: 15px 30px; font-size: 20px; background: cyan; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; font-weight: bold; }
    
    #loadingScreen { position: fixed; top:0; left:0; width:100%; height:100%; background:black; color:white; display:none; flex-direction:column; justify-content:center; align-items:center; font-size:26px; z-index:9999; }
    .loaderBar { width:300px; height:12px; border:2px solid white; margin-top:20px; overflow:hidden; border-radius:10px; }
    .loaderFill { height:100%; width:0%; background: linear-gradient(90deg, cyan, royalblue); }
    @keyframes loadAnim { 100%{width:100%;} }
    .fadeOut { animation: fadeOut 0.5s ease forwards; }
    @keyframes fadeOut { 100%{opacity:0; visibility:hidden;} }

    #loginInput { padding:12px; font-size:20px; background:#111; border:1px solid cyan; border-radius:6px; color:white; width:180px; text-align: center; }
    #loginButton { margin-top:15px; padding:12px 20px; background:cyan; border-radius:6px; font-weight:bold; cursor:pointer; border:none; }
    #loginError { display:none; background:red; color:white; padding:15px; border-radius:6px; margin-top:10px; font-weight:bold; }
    
    #app { position: relative; }
    h1 { margin-top:20px; font-size:34px; letter-spacing:2px; text-shadow:0 0 10px cyan; }
    input { padding:12px; margin-top:10px; font-size:18px; border-radius:6px; border:none; width:180px; background:#111; color:white; border:1px solid cyan; }
    button { cursor:pointer; font-weight:bold; transition:0.2s; border:none; padding:12px; border-radius:6px; }
    .pro-button { background:cyan; color:black; margin-top: 10px; }
    .lock-button { position: absolute; top: 10px; right: 10px; background: white; color: black; padding: 8px 15px; font-size: 14px; }
    
    #zboziList { list-style:none; padding:0; margin-top:25px; width:80%; max-width:600px; max-height: 40vh; overflow-y: auto; }
    .addedItem { background:#111; padding:12px; margin-bottom:8px; border-radius:6px; border-left:4px solid cyan; display:flex; justify-content:space-between; align-items:center; text-align: left; }
    .addedItem button { background:red; color:white; padding:6px 10px; border-radius:4px; font-size: 14px; margin-left: 10px; }
    
    .payment-modal { display:none; position:fixed; top:20%; left:50%; transform:translateX(-50%); background:#111; padding:25px; border-radius:10px; border:2px solid cyan; width:320px; text-align:center; z-index:1000; }
    .close-button { position:absolute; top:10px; right:10px; background:red; color:white; font-size:16px; border-radius:50%; padding:4px 8px; cursor:pointer; }
    #zaplatitMessage { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#0f0; color:black; padding:30px; font-size:36px; border-radius:15px; font-weight:bold; box-shadow:0 0 30px lime; text-align:center; z-index: 2000; }
</style>
</head>
<body>

<div id="fullscreenIntro">
    <h2>Vítejte u pokladního systému</h2>
    <button id="fullscreenButton" onclick="requestFullscreenAndLoad()">Přejít na celou obrazovku a zamknout displej</button>
</div>

<div id="loadingScreen">
  Načítání pokladny...
  <div class="loaderBar"><div class="loaderFill"></div></div>
</div>

<div id="loginScreen">
  <h1>Přihlášení</h1>
  <input id="loginInput" type="password" placeholder="PIN">
  <button id="loginButton" onclick="login()">Přihlásit</button>
  <div id="loginError">Špatný PIN!</div>
</div>

<div id="app">
  <button class="lock-button" onclick="logout()">Zamknout</button>
  <h1>Pokladna OBCHOD</h1>
  <input type="number" id="productCode" placeholder="Kód zboží" onkeydown="if(event.key==='Enter') pridatZbozi()">
  <button class="pro-button" onclick="pridatZbozi()">PŘIDAT (Enter)</button>
  <ul id="zboziList"></ul>
  <h3 id="celkovaCena">CENA: 0 Kč</h3>
  <button class="pro-button" style="background: lime;" onclick="openPaymentWindow()">ZAPLATIT</button>
</div>

<!-- PLATEBNÍ MODÁLY -->
<div id="paymentWindow" class="payment-modal">
  <button class="close-button" onclick="closePaymentWindow()">X</button>
  <h3>Zvolte způsob platby:</h3>
  <button class="pro-button" onclick="openCashWindow()">Hotově</button>
  <button class="pro-button" onclick="payCard()">Kartou</button>
</div>

<div id="cashWindow" class="payment-modal">
    <h3>Platba hotově</h3>
    <p>Částka k úhradě: <strong id="cashTotalDisplay">0 Kč</strong></p>
    <button class="pro-button" onclick="finishPayment()">Zaplatit</button>
    <button class="pro-button" style="background: grey;" onclick="closePaymentWindow()">Zpět</button>
</div>

<div id="cardWindow" class="payment-modal">
  <div id="cardText">Probíhá platba kartou...</div>
  <button class="pro-button" id="cardDoneBtn" style="display:none;" onclick="finishPayment()">Hotovo</button>
</div>

<div id="zaplatitMessage">ZAPLACENO ✔</div>

<script>
let wakeLock = null;

const requestWakeLock = async () => {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (err) {
    console.log("WakeLock nelze aktivovat (pravděpodobně chybí HTTPS)");
  }
};

const zbozi = {
  1: [20, "Kubík Waterrr 500ml"], 
  2: [25, "Relax Mango 330ml"],
  3: [22, "Madeta mléko"],
  4: [16, "Corny 50g"],
  5: [18, "Opavia Florenta"],
  10: [98, "Nutella 350g"],
  31: [1, "Rohlík ks"]
};

let celkem = 0;
const PIN = "153500";

async function requestFullscreenAndLoad() {
    const element = document.documentElement;
    if (element.requestFullscreen) element.requestFullscreen();
    await requestWakeLock();

    document.getElementById("fullscreenIntro").style.display = "none";
    const loadingScreen = document.getElementById("loadingScreen");
    loadingScreen.style.display = "flex";
    document.querySelector(".loaderFill").style.animation = "loadAnim 3s forwards";

    setTimeout(()=>{
      loadingScreen.classList.add("fadeOut");
      setTimeout(()=>{
        loadingScreen.style.display="none";
        document.getElementById("loginScreen").style.display="flex";
      },500);
    },3000);
}

function login(){
  if(document.getElementById("loginInput").value === PIN){
    document.getElementById("loginScreen").style.display="none";
    document.getElementById("app").style.display="flex";
    document.getElementById("productCode").focus();
  } else {
    document.getElementById("loginError").style.display="block";
  }
  document.getElementById("loginInput").value = "";
}

function pridatZbozi() {
    const input = document.getElementById("productCode");
    const item = zbozi[input.value];
    
    if (item) {
        celkem += item[0]; // OPRAVA: přičítáme jen cenu (první prvek pole)
        const li = document.createElement("li");
        li.className = "addedItem";
        li.innerHTML = `<span>${item[1]}</span> <span>${item[0]} Kč <button onclick="odebratZbozi(this, ${item[0]})">X</button></span>`;
        document.getElementById("zboziList").appendChild(li);
        aktualizovatCenu();
    } else if(input.value !== "") {
        alert("Kód nenalezen!");
    }
    input.value = "";
    input.focus();
}

function odebratZbozi(btn, cena) {
    btn.closest('li').remove();
    celkem -= cena;
    aktualizovatCenu();
}

function aktualizovatCenu() {
    document.getElementById("celkovaCena").innerText = `CENA: ${celkem} Kč`;
    document.getElementById("cashTotalDisplay").innerText = `${celkem} Kč`;
}

function logout() {
    document.getElementById("app").style.display="none";
    document.getElementById("loginScreen").style.display="flex";
    document.getElementById("zboziList").innerHTML="";
    celkem = 0;
    aktualizovatCenu();
}

function openPaymentWindow() {
    if(celkem > 0) document.getElementById("paymentWindow").style.display = "block";
}

function closePaymentWindow() {
    document.querySelectorAll(".payment-modal").forEach(m => m.style.display = "none");
}

function openCashWindow() {
    closePaymentWindow();
    document.getElementById("cashWindow").style.display = "block";
}

function payCard() {
    closePaymentWindow();
    document.getElementById("cardWindow").style.display = "block";
    document.getElementById("cardText").innerText = "Přiložte kartu...";
    setTimeout(() => {
        document.getElementById("cardText").innerText = "Platba schválena!";
        document.getElementById("cardDoneBtn").style.display = "inline-block";
    }, 1500);
}

function finishPayment() {
    closePaymentWindow();
    document.getElementById("zaplatitMessage").style.display = "block";
    setTimeout(() => {
        document.getElementById("zaplatitMessage").style.display = "none";
        document.getElementById("zboziList").innerHTML = "";
        celkem = 0;
        aktualizovatCenu();
        document.getElementById("cardDoneBtn").style.display = "none";
    }, 2000);
}
</script>
</body>
</html>
