<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Camera</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

#app{
    position:fixed;
    inset:0;
    background:#000;
    overflow:hidden;
}

/* ================= CAMERA ================= */

#cameraArea{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:#000;
}

#videoWrap{
    position:absolute;

    /*
       Větší obraz než displej = stabilizátor má
       prostor pro pohyb bez černých okrajů.
    */
    left:-12%;
    top:-12%;
    width:124%;
    height:124%;

    transform-origin:center center;

    will-change:transform;
}

#video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;

    background:#000;
}

/* jemné černé překrytí nahoře/dole */
#topShade{
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:140px;

    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.65),
        rgba(0,0,0,0)
    );

    pointer-events:none;
}

#bottomShade{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:260px;

    background:linear-gradient(
        to top,
        rgba(0,0,0,.85),
        rgba(0,0,0,0)
    );

    pointer-events:none;
}

/* ================= TOP BAR ================= */

#topBar{
    position:absolute;
    left:0;
    right:0;
    top:0;

    height:82px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:20px 22px;

    z-index:10;
}

.topButton{
    width:46px;
    height:46px;

    border:0;
    border-radius:50%;

    background:rgba(0,0,0,.35);
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:21px;

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    cursor:pointer;
}

.topButton:active{
    transform:scale(.9);
}

/* ================= ZOOM ================= */

#zoomBar{
    position:absolute;
    left:50%;
    bottom:170px;

    transform:translateX(-50%);

    display:flex;
    gap:10px;

    padding:7px;

    border-radius:30px;

    background:rgba(0,0,0,.38);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    z-index:10;
}

.zoomButton{
    min-width:48px;
    height:40px;

    border:0;
    border-radius:22px;

    color:white;
    background:transparent;

    font-size:14px;
    font-weight:bold;

    cursor:pointer;
}

.zoomButton.active{
    background:rgba(255,255,255,.22);
}

.zoomButton:active{
    transform:scale(.92);
}

/* ================= BOTTOM ================= */

#bottomBar{
    position:absolute;
    left:0;
    right:0;
    bottom:0;

    height:145px;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:10;
}

/* shutter */

#shutter{
    width:82px;
    height:82px;

    border-radius:50%;

    background:white;

    border:5px solid rgba(255,255,255,.35);

    box-shadow:
        0 0 0 3px rgba(0,0,0,.45);

    cursor:pointer;

    transition:.12s;
}

#shutter:active{
    transform:scale(.88);
}

/* recording */

#shutter.recording{
    background:#ff3b30;
    border-radius:24px;
}

/* side buttons */

.sideButton{
    position:absolute;

    width:52px;
    height:52px;

    border:0;
    border-radius:50%;

    background:rgba(0,0,0,.35);
    color:white;

    font-size:22px;

    display:flex;
    align-items:center;
    justify-content:center;

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    cursor:pointer;
}

.sideButton:active{
    transform:scale(.9);
}

#switchCamera{
    right:24px;
}

#flashButton{
    left:24px;
}

/* ================= MODE ================= */

#modeBar{
    position:absolute;
    bottom:105px;
    left:0;
    right:0;

    display:flex;
    justify-content:center;
    gap:28px;

    z-index:10;
}

.mode{
    color:rgba(255,255,255,.65);

    font-size:14px;
    font-weight:bold;

    cursor:pointer;
}

.mode.active{
    color:white;
}

/* ================= FOCUS ================= */

#focusBox{
    position:absolute;

    width:70px;
    height:70px;

    border:2px solid #ffd60a;
    border-radius:8px;

    display:none;

    pointer-events:none;

    z-index:9;
}

/* ================= STATUS ================= */

#status{
    position:absolute;

    left:50%;
    top:92px;

    transform:translateX(-50%);

    padding:9px 15px;

    border-radius:18px;

    background:rgba(0,0,0,.45);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    color:white;

    font-size:13px;

    opacity:0;

    transition:.2s;

    z-index:30;

    white-space:nowrap;
}

#status.show{
    opacity:1;
}

/* ================= START ================= */

#startScreen{
    position:absolute;
    inset:0;

    background:#050505;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    z-index:100;
}

#startIcon{
    width:84px;
    height:84px;

    border-radius:24px;

    background:#222;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:42px;

    margin-bottom:22px;
}

#startTitle{
    font-size:26px;
    font-weight:bold;
    margin-bottom:8px;
}

#startText{
    max-width:320px;

    text-align:center;

    color:#aaa;

    line-height:1.5;

    font-size:14px;

    margin-bottom:25px;
}

#startButton{
    border:0;

    padding:14px 28px;

    border-radius:30px;

    background:white;
    color:black;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;
}

#startButton:active{
    transform:scale(.95);
}

#errorText{
    margin-top:18px;

    max-width:330px;

    text-align:center;

    color:#ff6b6b;

    font-size:13px;

    line-height:1.4;

    display:none;
}

/* ================= VIDEO MODE ================= */

body.videoMode #zoomBar{
    display:none;
}

/* ================= DESKTOP ================= */

@media(min-width:800px){

    #app{
        max-width:520px;
        max-height:920px;

        left:50%;
        top:50%;

        transform:translate(-50%,-50%);

        border-radius:25px;

        box-shadow:0 0 60px rgba(0,0,0,.8);
    }

}
</style>
</head>

<body>

<div id="app">

    <div id="cameraArea">

        <div id="videoWrap">
            <video id="video"
                   autoplay
                   playsinline
                   muted></video>
        </div>

        <div id="topShade"></div>
        <div id="bottomShade"></div>

        <div id="focusBox"></div>

    </div>

    <!-- TOP -->

    <div id="topBar">

        <button class="topButton" id="closeButton">
            ✕
        </button>

        <button class="topButton" id="settingsButton">
            ⚙
        </button>

    </div>

    <!-- STATUS -->

    <div id="status"></div>

    <!-- ZOOM -->

    <div id="zoomBar">

        <button class="zoomButton active" data-zoom="1">
            1×
        </button>

        <button class="zoomButton" data-zoom="2">
            2×
        </button>

    </div>

    <!-- MODE -->

    <div id="modeBar">

        <div class="mode active" id="photoMode">
            FOTO
        </div>

        <div class="mode" id="videoMode">
            VIDEO
        </div>

    </div>

    <!-- BOTTOM -->

    <div id="bottomBar">

        <button class="sideButton" id="flashButton">
            ⚡
        </button>

        <button id="shutter"></button>

        <button class="sideButton" id="switchCamera">
            🔄
        </button>

    </div>

    <!-- START -->

    <div id="startScreen">

        <div id="startIcon">
            📷
        </div>

        <div id="startTitle">
            Fotoaparát
        </div>

        <div id="startText">
            Povol přístup ke kameře a fotoaparát se spustí.
            Stabilizace obrazu běží automaticky na pozadí.
        </div>

        <button id="startButton">
            Spustit fotoaparát
        </button>

        <div id="errorText"></div>

    </div>

</div>


<script>

/* =========================================================
   CAMERA
========================================================= */

const video = document.getElementById("video");
const videoWrap = document.getElementById("videoWrap");

const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("startButton");
const errorText = document.getElementById("errorText");

const statusBox = document.getElementById("status");

const shutter = document.getElementById("shutter");

const switchCamera = document.getElementById("switchCamera");
const flashButton = document.getElementById("flashButton");

const focusBox = document.getElementById("focusBox");

const zoomButtons =
    document.querySelectorAll(".zoomButton");

const photoMode =
    document.getElementById("photoMode");

const videoMode =
    document.getElementById("videoMode");

let stream = null;
let currentFacing = "environment";

let currentZoom = 1;

let flashOn = false;

let mode = "photo";

let recorder = null;
let recordedChunks = [];

let stabilizerStarted = false;


/* =========================================================
   STATUS
========================================================= */

function showStatus(text, time = 1800){

    statusBox.textContent = text;

    statusBox.classList.add("show");

    clearTimeout(showStatus.timer);

    showStatus.timer = setTimeout(() => {

        statusBox.classList.remove("show");

    }, time);
}


/* =========================================================
   ERROR
========================================================= */

function showError(text){

    errorText.textContent = text;

    errorText.style.display = "block";

}


/* =========================================================
   CAMERA START
========================================================= */

async function startCamera(){

    errorText.style.display = "none";

    if(!window.isSecureContext){

        showError(
            "Kamera v prohlížeči potřebuje HTTPS nebo localhost. " +
            "Otevři stránku přes Live Server nebo HTTPS."
        );

        return;
    }

    if(!navigator.mediaDevices ||
       !navigator.mediaDevices.getUserMedia){

        showError(
            "Tento prohlížeč nepodporuje přístup ke kameře."
        );

        return;
    }


    try{

        if(stream){

            stream.getTracks().forEach(track => track.stop());

        }


        /* nejprve zkusíme kvalitní nastavení */

        let constraints = {

            audio:false,

            video:{
                facingMode:{
                    ideal:currentFacing
                },

                width:{
                    ideal:1920
                },

                height:{
                    ideal:1080
                },

                frameRate:{
                    ideal:60,
                    max:60
                }
            }

        };


        try{

            stream =
                await navigator.mediaDevices.getUserMedia(
                    constraints
                );

        }catch(e){

            /* fallback pro starší prohlížeče */

            stream =
                await navigator.mediaDevices.getUserMedia({

                    audio:false,

                    video:{
                        facingMode:currentFacing
                    }

                });

        }


        video.srcObject = stream;

        await video.play();


        startScreen.style.display = "none";

        showStatus("Kamera spuštěna");


        setupStabilization();

    }catch(error){

        console.error(error);

        let message =
            "Kameru se nepodařilo spustit.";

        if(error.name === "NotAllowedError"){

            message =
                "Přístup ke kameře byl zamítnut. Povol kameru v prohlížeči.";

        }

        else if(error.name === "NotFoundError"){

            message =
                "Kamera nebyla nalezena.";

        }

        else if(error.name === "NotReadableError"){

            message =
                "Kameru právě používá jiná aplikace.";

        }

        else if(error.name === "SecurityError"){

            message =
                "Prohlížeč zablokoval kameru. Použij HTTPS nebo localhost.";

        }


        showError(message);

    }

}


/* =========================================================
   SWITCH CAMERA
========================================================= */

switchCamera.addEventListener("click", async () => {

    if(!stream){

        return;
    }

    currentFacing =
        currentFacing === "environment"
        ? "user"
        : "environment";


    await startCamera();

});


/* =========================================================
   ZOOM
========================================================= */

function setZoom(value){

    currentZoom = value;

    zoomButtons.forEach(button => {

        button.classList.toggle(
            "active",
            Number(button.dataset.zoom) === value
        );

    });


    /*
       1× = normální záběr
       2× = digitální přiblížení

       Stabilizátor ale stále pracuje s větším
       interním obrazem kolem okrajů.
    */

    if(value === 1){

        video.style.transform =
            "scale(1)";

    }

    if(value === 2){

        video.style.transform =
            "scale(2)";

    }

}


zoomButtons.forEach(button => {

    button.addEventListener("click", () => {

        setZoom(
            Number(button.dataset.zoom)
        );

    });

});


/* =========================================================
   AUTOMATICKÁ STABILIZACE
=========================================================

   Důležité:

   0.5× NENÍ tlačítko.

   Stabilizátor má automaticky rezervu obrazu
   kolem displeje. Díky tomu může obraz posouvat,
   když se telefon trochu pohne.

========================================================= */

let smoothX = 0;
let smoothY = 0;

let targetX = 0;
let targetY = 0;

let smoothRotation = 0;
let targetRotation = 0;


let lastGamma = null;
let lastBeta = null;


/* nastavení stabilizace */

const STABILIZATION_POWER = 0.55;
const MAX_MOVE = 4.5;
const MAX_ROTATION = 2.2;


/* gyro */

function orientationHandler(event){

    if(
        typeof event.gamma !== "number" ||
        typeof event.beta !== "number"
    ){

        return;
    }


    if(lastGamma === null){

        lastGamma = event.gamma;
        lastBeta = event.beta;

        return;

    }


    let dg =
        event.gamma - lastGamma;

    let db =
        event.beta - lastBeta;


    /*
       omezení náhlých skoků
    */

    dg =
        Math.max(-8,Math.min(8,dg));

    db =
        Math.max(-8,Math.min(8,db));


    targetX +=
        dg * STABILIZATION_POWER;

    targetY +=
        db * STABILIZATION_POWER;


    targetX =
        Math.max(
            -MAX_MOVE,
            Math.min(MAX_MOVE,targetX)
        );

    targetY =
        Math.max(
            -MAX_MOVE,
            Math.min(MAX_MOVE,targetY)
        );


    targetRotation =
        Math.max(
            -MAX_ROTATION,
            Math.min(
                MAX_ROTATION,
                targetRotation + dg * 0.08
            )
        );


    lastGamma = event.gamma;
    lastBeta = event.beta;

}


/* stabilizace */

function stabilizationLoop(){

    smoothX +=
        (targetX - smoothX) * 0.08;

    smoothY +=
        (targetY - smoothY) * 0.08;

    smoothRotation +=
        (targetRotation - smoothRotation) * 0.06;


    /*
       pomalé vracení středu
    */

    targetX *= 0.985;
    targetY *= 0.985;
    targetRotation *= 0.97;


    /*
       0.5× rezervní plocha je automatická.
       Uživatel ji nevidí a nemusí nic nastavovat.
    */

    videoWrap.style.transform =
        `translate3d(${-smoothX}px, ${-smoothY}px, 0)
         rotate(${-smoothRotation}deg)`;


    requestAnimationFrame(stabilizationLoop);

}


function setupStabilization(){

    if(stabilizerStarted){

        return;

    }

    stabilizerStarted = true;


    window.addEventListener(
        "deviceorientation",
        orientationHandler,
        true
    );


    stabilizationLoop();

}


/* =========================================================
   IOS / GYRO PERMISSION
========================================================= */

async function requestMotionPermission(){

    try{

        if(
            typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function"
        ){

            const permission =
                await DeviceOrientationEvent.requestPermission();

            if(permission === "granted"){

                showStatus("Stabilizace aktivní");

            }

        }

    }catch(e){

        console.log(e);

    }

}


/* =========================================================
   START BUTTON
========================================================= */

startButton.addEventListener("click", async () => {

    await requestMotionPermission();

    await startCamera();

});


/* =========================================================
   FLASH
========================================================= */

flashButton.addEventListener("click", async () => {

    if(!stream){

        return;
    }


    const track =
        stream.getVideoTracks()[0];


    if(!track){

        return;
    }


    const capabilities =
        track.getCapabilities
        ? track.getCapabilities()
        : {};


    if(!capabilities.torch){

        showStatus("Blesk není v prohlížeči dostupný");

        return;
    }


    try{

        flashOn = !flashOn;

        await track.applyConstraints({

            advanced:[
                {
                    torch:flashOn
                }
            ]

        });


        flashButton.textContent =
            flashOn ? "⚡" : "⚡";

        showStatus(
            flashOn
            ? "Blesk zapnutý"
            : "Blesk vypnutý"
        );

    }catch(e){

        showStatus("Blesk se nepodařilo změnit");

    }

});


/* =========================================================
   FOCUS
========================================================= */

document.getElementById("cameraArea")
.addEventListener("pointerdown", event => {

    if(
        event.target.closest("button") ||
        event.target.closest("#zoomBar")
    ){

        return;
    }


    const rect =
        document
        .getElementById("cameraArea")
        .getBoundingClientRect();


    const x =
        event.clientX - rect.left;

    const y =
        event.clientY - rect.top;


    focusBox.style.left =
        `${x - 35}px`;

    focusBox.style.top =
        `${y - 35}px`;

    focusBox.style.display =
        "block";


    clearTimeout(focusBox.timer);

    focusBox.timer =
        setTimeout(() => {

            focusBox.style.display =
                "none";

        },1000);


    const track =
        stream?.getVideoTracks()?.[0];


    if(track &&
       track.getCapabilities){

        const caps =
            track.getCapabilities();

        if(
            caps.focusMode &&
            caps.focusMode.includes("single-shot")
        ){

            track.applyConstraints({

                advanced:[
                    {
                        focusMode:"single-shot"
                    }
                ]

            }).catch(()=>{});

        }

    }

});


/* =========================================================
   PHOTO
========================================================= */

function takePhoto(){

    if(!video.videoWidth){

        showStatus("Kamera ještě není připravená");

        return;

    }


    const canvas =
        document.createElement("canvas");


    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;


    const ctx =
        canvas.getContext("2d");


    /*
       Zrcadlení pouze přední kamery.
    */

    if(currentFacing === "user"){

        ctx.translate(
            canvas.width,
            0
        );

        ctx.scale(-1,1);

    }


    /*
       Foto z aktuálního obrazu.
    */

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    canvas.toBlob(blob => {

        if(!blob){

            showStatus("Fotku se nepodařilo uložit");

            return;

        }


        const url =
            URL.createObjectURL(blob);


        const a =
            document.createElement("a");


        const now =
            new Date();


        const filename =
            "foto-" +
            now.getFullYear() +
            "-" +
            String(now.getMonth()+1).padStart(2,"0") +
            "-" +
            String(now.getDate()).padStart(2,"0") +
            "-" +
            String(now.getHours()).padStart(2,"0") +
            String(now.getMinutes()).padStart(2,"0") +
            String(now.getSeconds()).padStart(2,"0") +
            ".jpg";


        a.href = url;
        a.download = filename;

        document.body.appendChild(a);

        a.click();

        a.remove();

        setTimeout(() => {

            URL.revokeObjectURL(url);

        },1000);


        showStatus("Fotka uložena 📸");

    },"image/jpeg",0.95);

}


/* =========================================================
   VIDEO
========================================================= */

function getRecorder(){

    if(!window.MediaRecorder){

        return null;

    }


    const types = [

        "video/webm;codecs=vp9",

        "video/webm;codecs=vp8",

        "video/webm",

        "video/mp4"

    ];


    for(const type of types){

        try{

            if(
                MediaRecorder.isTypeSupported &&
                MediaRecorder.isTypeSupported(type)
            ){

                return new MediaRecorder(
                    stream,
                    {
                        mimeType:type
                    }
                );

            }

        }catch(e){}

    }


    try{

        return new MediaRecorder(stream);

    }catch(e){

        return null;

    }

}


function startRecording(){

    recorder =
        getRecorder();


    if(!recorder){

        showStatus(
            "Video není v tomto prohlížeči podporované"
        );

        return;

    }


    recordedChunks = [];


    recorder.ondataavailable =
        event => {

            if(event.data &&
               event.data.size > 0){

                recordedChunks.push(
                    event.data
                );

            }

        };


    recorder.onstop =
        saveRecording;


    recorder.start();


    shutter.classList.add("recording");

    showStatus("Nahrávání…");

}


function stopRecording(){

    if(
        recorder &&
        recorder.state !== "inactive"
    ){

        recorder.stop();

    }


    shutter.classList.remove(
        "recording"
    );

}


function saveRecording(){

    if(!recordedChunks.length){

        showStatus(
            "Video nemá žádná data"
        );

        return;

    }


    const type =
        recorder.mimeType ||
        "video/webm";


    const blob =
        new Blob(
            recordedChunks,
            {
                type:type
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href = url;

    a.download =
        "video-" +
        Date.now() +
        ".webm";


    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(() => {

        URL.revokeObjectURL(url);

    },1000);


    showStatus("Video uloženo 🎥");

}


/* =========================================================
   SHUTTER
========================================================= */

shutter.addEventListener("click", async () => {

    if(!stream){

        showStatus("Nejdřív spusť kameru");

        return;

    }


    if(mode === "photo"){

        takePhoto();

    }else{

        if(
            recorder &&
            recorder.state === "recording"
        ){

            stopRecording();

        }else{

            startRecording();

        }

    }

});


/* =========================================================
   MODES
========================================================= */

photoMode.addEventListener("click", () => {

    mode = "photo";

    photoMode.classList.add("active");
    videoMode.classList.remove("active");

    shutter.classList.remove("recording");

});


videoMode.addEventListener("click", () => {

    mode = "video";

    videoMode.classList.add("active");
    photoMode.classList.remove("active");

});


/* =========================================================
   CLOSE
========================================================= */

document.getElementById("closeButton")
.addEventListener("click", () => {

    if(stream){

        stream
        .getTracks()
        .forEach(track => track.stop());

    }


    video.srcObject = null;

    startScreen.style.display =
        "flex";

});


/* =========================================================
   SETTINGS
========================================================= */

document.getElementById("settingsButton")
.addEventListener("click", () => {

    showStatus(
        "Automatická stabilizace je zapnutá"
    );

});


/* =========================================================
   INITIAL
========================================================= */

setZoom(1);

</script>

</body>
</html>
