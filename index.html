<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>SirTros Compass</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
}

body {
    touch-action: none;
}

#app {
    width: 100vw;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: #000;
}

/* START */

#start {
    position: absolute;
    inset: 0;
    z-index: 20;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: #000;
    text-align: center;
    padding: 30px;
}

#startIcon {
    font-size: 64px;
    margin-bottom: 20px;
}

#start h1 {
    margin: 0 0 12px;
    font-size: 30px;
}

#start p {
    margin: 0 0 25px;
    color: #999;
    max-width: 340px;
    line-height: 1.5;
}

#startButton {
    border: 0;
    background: #fff;
    color: #000;
    border-radius: 999px;
    padding: 15px 30px;
    font-size: 17px;
    font-weight: 700;
}

/* KOMPAS */

#compass {
    width: min(86vw, 390px);
    height: min(86vw, 390px);

    border: 2px solid #333;
    border-radius: 50%;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* Vnitřní kruh */

#inner {
    position: absolute;
    width: 88%;
    height: 88%;
    border: 1px solid #222;
    border-radius: 50%;
}

/* SMĚRY */

.direction {
    position: absolute;
    font-size: 27px;
    font-weight: 700;
}

#n {
    top: 20px;
    color: #ff3b30;
}

#e {
    right: 20px;
}

#s {
    bottom: 20px;
}

#w {
    left: 20px;
}

/* Menší směry */

.smallDirection {
    position: absolute;
    font-size: 13px;
    color: #777;
    font-weight: 600;
}

#ne {
    top: 72px;
    right: 70px;
}

#se {
    bottom: 72px;
    right: 70px;
}

#sw {
    bottom: 72px;
    left: 70px;
}

#nw {
    top: 72px;
    left: 70px;
}

/* JEHLA */

#needle {
    position: absolute;
    width: 5px;
    height: 78%;

    transform-origin: center center;

    pointer-events: none;
}

#needleNorth {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);

    width: 0;
    height: 0;

    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-bottom: 130px solid #ff3b30;
}

#needleSouth {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);

    width: 0;
    height: 0;

    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 130px solid #777;
}

/* STŘED */

#center {
    position: absolute;

    width: 18px;
    height: 18px;

    background: #fff;
    border-radius: 50%;

    z-index: 5;
}

/* INFORMACE */

#info {
    position: absolute;
    bottom: 35px;
    left: 0;
    width: 100%;

    text-align: center;
}

#heading {
    font-size: 48px;
    font-weight: 800;
}

#directionText {
    margin-top: 5px;
    font-size: 21px;
    color: #aaa;
}

#status {
    margin-top: 10px;
    font-size: 13px;
    color: #666;
}

/* CHYBA */

#error {
    display: none;

    position: absolute;
    inset: 0;
    z-index: 30;

    background: #000;

    align-items: center;
    justify-content: center;

    text-align: center;
    padding: 30px;
}

#errorBox {
    max-width: 350px;
}

#error h2 {
    font-size: 25px;
}

#error p {
    color: #999;
    line-height: 1.5;
}

#error button {
    border: 0;
    border-radius: 999px;
    padding: 14px 25px;

    background: #fff;
    color: #000;

    font-weight: 700;
}
</style>
</head>

<body>

<div id="app">

    <!-- START -->

    <div id="start">

        <div id="startIcon">🧭</div>

        <h1>Kompas</h1>

        <p>
            Tento test používá orientační senzor telefonu.
        </p>

        <button id="startButton">
            Spustit kompas
        </button>

    </div>


    <!-- KOMPAS -->

    <div id="compass">

        <div id="inner"></div>

        <div id="directionText"></div>

        <div id="n" class="direction">N</div>
        <div id="e" class="direction">E</div>
        <div id="s" class="direction">S</div>
        <div id="w" class="direction">W</div>

        <div id="ne" class="smallDirection">NE</div>
        <div id="se" class="smallDirection">SE</div>
        <div id="sw" class="smallDirection">SW</div>
        <div id="nw" class="smallDirection">NW</div>

        <div id="needle">

            <div id="needleNorth"></div>
            <div id="needleSouth"></div>

        </div>

        <div id="center"></div>

    </div>


    <!-- INFO -->

    <div id="info">

        <div id="heading">
            ---°
        </div>

        <div id="directionText">
            Čekám na senzor…
        </div>

        <div id="status">
            Kompas není spuštěný
        </div>

    </div>


    <!-- ERROR -->

    <div id="error">

        <div id="errorBox">

            <h2>Kompas není dostupný</h2>

            <p id="errorMessage">
                Prohlížeč neposílá data z orientačního senzoru.
            </p>

            <button id="retry">
                Zkusit znovu
            </button>

        </div>

    </div>

</div>

<script>

const start = document.getElementById("start");
const startButton = document.getElementById("startButton");

const compass = document.getElementById("compass");
const needle = document.getElementById("needle");

const headingElement =
    document.getElementById("heading");

const infoDirection =
    document.querySelector("#info #directionText");

const status =
    document.getElementById("status");

const error =
    document.getElementById("error");

const errorMessage =
    document.getElementById("errorMessage");

const retry =
    document.getElementById("retry");

let started = false;
let gotSensorData = false;

let lastHeading = null;


/* =========================
   NORMALIZACE
========================= */

function normalize(value) {

    value = value % 360;

    if (value < 0) {
        value += 360;
    }

    return value;
}


/* =========================
   SMĚR
========================= */

function getDirection(deg) {

    if (deg < 22.5 || deg >= 337.5)
        return "Sever";

    if (deg < 67.5)
        return "Severovýchod";

    if (deg < 112.5)
        return "Východ";

    if (deg < 157.5)
        return "Jihovýchod";

    if (deg < 202.5)
        return "Jih";

    if (deg < 247.5)
        return "Jihozápad";

    if (deg < 292.5)
        return "Západ";

    return "Severozápad";
}


/* =========================
   AKTUALIZACE
========================= */

function updateCompass(value) {

    if (!Number.isFinite(value))
        return;

    value = normalize(value);

    gotSensorData = true;

    /*
        Omezíme zbytečné překreslování.
    */

    if (
        lastHeading !== null &&
        Math.abs(value - lastHeading) < 0.5
    ) {
        return;
    }

    lastHeading = value;

    headingElement.textContent =
        Math.round(value) + "°";

    infoDirection.textContent =
        getDirection(value);

    status.textContent =
        "Senzor aktivní";

    /*
        Jehla ukazuje na sever.
    */

    needle.style.transform =
        "rotate(" + (-value) + "deg)";
}


/* =========================
   ORIENTACE
========================= */

function orientationHandler(event) {

    let heading = null;


    /*
        Některé telefony / Safari
        mají přímo compass heading.
    */

    if (
        typeof event.webkitCompassHeading === "number" &&
        Number.isFinite(event.webkitCompassHeading)
    ) {

        heading =
            event.webkitCompassHeading;

    }


    /*
        Android / běžný DeviceOrientation.
    */

    else if (
        typeof event.alpha === "number" &&
        Number.isFinite(event.alpha)
    ) {

        heading =
            360 - event.alpha;

    }


    if (heading !== null) {
        updateCompass(heading);
    }
}


/* =========================
   START
========================= */

async function startCompass() {

    startButton.disabled = true;

    try {

        /*
            iPhone / Safari může chtít
            explicitní povolení.
        */

        if (
            typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function"
        ) {

            const permission =
                await DeviceOrientationEvent.requestPermission();

            if (permission !== "granted") {

                throw new Error(
                    "Přístup k orientaci nebyl povolen."
                );
            }
        }


        if (
            typeof DeviceOrientationEvent === "undefined"
        ) {

            throw new Error(
                "Tento prohlížeč nepodporuje orientační senzor."
            );
        }


        /*
            Posloucháme oba typy.
        */

        window.addEventListener(
            "deviceorientation",
            orientationHandler,
            true
        );

        window.addEventListener(
            "deviceorientationabsolute",
            orientationHandler,
            true
        );


        started = true;

        start.style.display = "none";

        status.textContent =
            "Čekám na senzor…";


        /*
            Když do 5 sekund nic nepřijde,
            nezůstane to viset.
        */

        setTimeout(() => {

            if (
                started &&
                !gotSensorData
            ) {

                showError(
                    "Telefon nebo prohlížeč neposílá data z kompasu."
                );

            }

        }, 5000);


        /*
            Fullscreen.
        */

        try {

            if (
                document.documentElement.requestFullscreen &&
                !document.fullscreenElement
            ) {

                await document.documentElement.requestFullscreen();

            }

        } catch {}


    } catch (e) {

        showError(
            e.message ||
            "Kompas se nepodařilo spustit."
        );

    }

    startButton.disabled = false;
}


/* =========================
   CHYBA
========================= */

function showError(message) {

    started = false;

    errorMessage.textContent = message;

    error.style.display = "flex";
}


/* =========================
   ZNOVU
========================= */

retry.addEventListener(
    "click",
    () => {

        error.style.display = "none";

        gotSensorData = false;
        lastHeading = null;

        startCompass();

    }
);


/* =========================
   START
========================= */

startButton.addEventListener(
    "click",
    startCompass
);


/* =========================
   WAKE LOCK
========================= */

let wakeLock = null;

async function keepAwake() {

    try {

        if (
            "wakeLock" in navigator &&
            !wakeLock
        ) {

            wakeLock =
                await navigator.wakeLock.request("screen");

        }

    } catch {}

}

startButton.addEventListener(
    "click",
    keepAwake
);

</script>

</body>
</html>
