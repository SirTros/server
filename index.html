<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>SirTros Phone Test</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Segoe UI,Arial,sans-serif;
    touch-action:none;
    user-select:none;
}

button{
    font-family:inherit;
}

.screen{
    position:fixed;
    inset:0;
    display:none;
}

.screen.active{
    display:flex;
}


/* =========================
   START
========================= */

#startScreen{
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:20px;
    text-align:center;
}

.title{
    font-size:30px;
    font-weight:700;
}

.subtitle{
    color:#999;
    font-size:14px;
}

#startButton{
    border:0;
    border-radius:18px;
    padding:17px 35px;
    background:#087cff;
    color:white;
    font-size:18px;
    font-weight:700;
    box-shadow:0 0 30px rgba(8,124,255,.35);
}

#startButton:active{
    transform:scale(.96);
}


/* =========================
   TEST
========================= */

#testScreen{
    background:#000;
}

#touchArea{
    position:absolute;
    inset:0;
    overflow:hidden;
    touch-action:none;
}


/* =========================
   HORNÍ INFORMACE
========================= */

#top{
    position:absolute;
    z-index:1000;
    top:10px;
    left:0;
    right:0;
    text-align:center;
    pointer-events:none;
}

#name{
    font-size:18px;
    font-weight:700;
}

#hint{
    margin-top:3px;
    color:#aaa;
    font-size:12px;
}


/* =========================
   STŘEDNÍ INFORMACE
========================= */

#info{
    position:absolute;
    z-index:500;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:92%;
    text-align:center;
    pointer-events:none;
}

.big{
    font-size:32px;
    font-weight:700;
    margin-bottom:14px;
}

.value{
    color:#ddd;
    font-size:17px;
    line-height:1.6;
    white-space:pre-line;
}


/* =========================
   DOTYKOVÉ BODY
========================= */

.point{
    position:absolute;

    width:30px;
    height:30px;

    background:#fff;

    border:2px solid #aaa;

    border-radius:5px;

    z-index:100;

    pointer-events:auto;

    touch-action:none;

    transition:
        background .12s,
        box-shadow .12s,
        border-color .12s;
}

.point.done{
    background:#087cff;

    border-color:#62adff;

    box-shadow:
        0 0 10px rgba(8,124,255,.9),
        0 0 22px rgba(8,124,255,.45);
}


/* =========================
   PROGRESS
========================= */

#progressBox{
    position:absolute;
    z-index:2000;

    left:50%;
    bottom:14px;

    transform:translateX(-50%);

    width:min(420px,82vw);

    text-align:center;

    pointer-events:none;
}

#progressText{
    color:#aaa;
    font-size:12px;
    margin-bottom:5px;
}

#progress{
    width:100%;
    height:5px;

    background:#222;

    border-radius:20px;

    overflow:hidden;
}

#fill{
    width:0%;
    height:100%;

    background:#087cff;

    transition:width .1s;
}


/* =========================
   MULTITOUCH BODY
========================= */

.multiDot{
    position:absolute;

    width:45px;
    height:45px;

    border-radius:50%;

    background:#087cff;

    box-shadow:
        0 0 20px rgba(8,124,255,.8);

    transform:translate(-50%,-50%);

    pointer-events:none;

    z-index:300;
}


/* =========================
   FINISH
========================= */

#finishScreen{
    align-items:center;
    justify-content:center;
    flex-direction:column;

    text-align:center;

    gap:10px;
}

.finishTitle{
    font-size:30px;
    font-weight:700;
}

.finishText{
    color:#aaa;
}

</style>
</head>

<body>


<!-- =========================
     START
========================= -->

<div id="startScreen" class="screen active">

    <div class="title">
        SirTros Phone Test
    </div>

    <div class="subtitle">
        Diagnostika telefonu
    </div>

    <button id="startButton">
        SPUSTIT TEST
    </button>

</div>


<!-- =========================
     TEST
========================= -->

<div id="testScreen" class="screen">

    <div id="top">

        <div id="name"></div>

        <div id="hint"></div>

    </div>


    <div id="touchArea"></div>


    <div id="info"></div>


    <div id="progressBox">

        <div id="progressText"></div>

        <div id="progress">

            <div id="fill"></div>

        </div>

    </div>

</div>


<!-- =========================
     FINISH
========================= -->

<div id="finishScreen" class="screen">

    <div class="finishTitle">
        TEST DOKONČEN
    </div>

    <div class="finishText">
        Diagnostika dokončena.
    </div>

</div>


<script>


/* =========================================================
   ELEMENTY
========================================================= */

const startScreen =
    document.getElementById("startScreen");

const testScreen =
    document.getElementById("testScreen");

const finishScreen =
    document.getElementById("finishScreen");

const startButton =
    document.getElementById("startButton");

const touchArea =
    document.getElementById("touchArea");

const nameEl =
    document.getElementById("name");

const hintEl =
    document.getElementById("hint");

const info =
    document.getElementById("info");

const progressBox =
    document.getElementById("progressBox");

const progressText =
    document.getElementById("progressText");

const fill =
    document.getElementById("fill");


/* =========================================================
   STAV
========================================================= */

let currentTest = 0;

let points = [];

let pointerData = new Map();

let touchCompleted = false;

let sensorTimer = null;


/* =========================================================
   TESTY
========================================================= */

const tests = [

    {
        id:"touch",
        name:"DISPLEJ – DOTYK",
        hint:"Dotýkej se nebo přejížděj přes čtverečky"
    },

    {
        id:"movement",
        name:"POHYB",
        hint:"Pohybuj telefonem NAHORU / DOLŮ / DOLEVA / DOPRAVA"
    },

    {
        id:"screen",
        name:"OBRAZOVKA",
        hint:"Kontrola rozlišení, DPR a velikosti"
    },

    {
        id:"battery",
        name:"BATERIE",
        hint:"Průběžná kontrola baterie"
    },

    {
        id:"orientation",
        name:"ORIENTACE",
        hint:"Nakláněj telefon"
    },

    {
        id:"rotation",
        name:"ROTACE",
        hint:"Otáčej telefonem"
    },

    {
        id:"compass",
        name:"KOMPAS",
        hint:"Otáčej telefonem"
    },

    {
        id:"network",
        name:"SÍŤ",
        hint:"Průběžná kontrola připojení"
    },

    {
        id:"multitouch",
        name:"MULTITOUCH",
        hint:"Dotkni se více míst současně"
    },

    {
        id:"vibration",
        name:"VIBRACE",
        hint:"Test vibračního motoru"
    }

];


/* =========================================================
   START
========================================================= */

startButton.addEventListener(
    "click",
    async()=>{

        try{

            if(
                document.documentElement.requestFullscreen
            ){

                await document.documentElement
                    .requestFullscreen();

            }

        }catch(e){}


        startScreen.classList.remove("active");

        testScreen.classList.add("active");

        currentTest=0;

        showTest();

    }
);


/* =========================================================
   TEST
========================================================= */

function showTest(){

    clearSensorTimer();

    touchArea.innerHTML="";

    info.innerHTML="";

    progressBox.style.display="none";

    if(currentTest>=tests.length){

        testScreen.classList.remove("active");

        finishScreen.classList.add("active");

        return;
    }


    const test=tests[currentTest];

    nameEl.textContent=test.name;

    hintEl.textContent=test.hint;


    if(test.id==="touch")
        startTouch();

    if(test.id==="movement")
        startMovement();

    if(test.id==="screen")
        startScreenInfo();

    if(test.id==="battery")
        startBattery();

    if(test.id==="orientation")
        startOrientation();

    if(test.id==="rotation")
        startRotation();

    if(test.id==="compass")
        startCompass();

    if(test.id==="network")
        startNetwork();

    if(test.id==="multitouch")
        startMultitouch();

    if(test.id==="vibration")
        startVibration();

}


/* =========================================================
   DALŠÍ TEST
========================================================= */

function nextTest(){

    clearSensorTimer();

    currentTest++;

    showTest();

}


/* =========================================================
   TIMER
========================================================= */

function clearSensorTimer(){

    if(sensorTimer){

        clearTimeout(sensorTimer);

        sensorTimer=null;

    }

}


/* =========================================================
   DOTYK
========================================================= */

function startTouch(){

    progressBox.style.display="block";

    points=[];

    touchCompleted=false;

    createTouchPoints();

    updateTouchProgress();

}


/* =========================================================
   VYTVOŘENÍ BODŮ
========================================================= */

function createTouchPoints(){

    touchArea.innerHTML="";

    points=[];


    const w=window.innerWidth;

    const h=window.innerHeight;

    const size=30;

    const spacing=45;


    const positions=[];


    function addPoint(x,y){

        x=Math.round(
            Math.max(
                0,
                Math.min(
                    w-size,
                    x
                )
            )
        );

        y=Math.round(
            Math.max(
                0,
                Math.min(
                    h-size,
                    y
                )
            )
        );


        const exists=
            positions.some(
                p=>
                    Math.abs(p.x-x)<3 &&
                    Math.abs(p.y-y)<3
            );


        if(!exists){

            positions.push({
                x:x,
                y:y
            });

        }

    }


    /* =========================
       OKRAJ
    ========================= */

    for(
        let x=0;
        x<=w-size;
        x+=spacing
    ){

        addPoint(x,0);

    }

    addPoint(w-size,0);


    for(
        let y=spacing;
        y<=h-size;
        y+=spacing
    ){

        addPoint(
            w-size,
            y
        );

    }

    addPoint(
        w-size,
        h-size
    );


    for(
        let x=w-size-spacing;
        x>=0;
        x-=spacing
    ){

        addPoint(
            x,
            h-size
        );

    }

    addPoint(
        0,
        h-size
    );


    for(
        let y=h-size-spacing;
        y>0;
        y-=spacing
    ){

        addPoint(
            0,
            y
        );

    }


    /* =========================
       X – PRVNÍ ÚHLOPŘÍČKA
    ========================= */

    const max=Math.max(w,h);


    for(
        let d=0;
        d<=max;
        d+=spacing
    ){

        const t=d/max;


        addPoint(
            (w-size)*t,
            (h-size)*t
        );

    }


    /* =========================
       X – DRUHÁ ÚHLOPŘÍČKA
    ========================= */

    for(
        let d=0;
        d<=max;
        d+=spacing
    ){

        const t=d/max;


        addPoint(
            (w-size)*(1-t),
            (h-size)*t
        );

    }


    /* =========================
       ELEMENTY
    ========================= */

    positions.forEach(
        (pos,index)=>{

            const el=
                document.createElement("div");

            el.className="point";

            el.style.left=
                pos.x+"px";

            el.style.top=
                pos.y+"px";


            touchArea.appendChild(el);


            const point={

                x:pos.x,

                y:pos.y,

                cx:pos.x+size/2,

                cy:pos.y+size/2,

                done:false,

                element:el

            };


            points.push(point);


            /* =====================
               KLIK PŘÍMO NA BOD
            ===================== */

            el.addEventListener(
                "pointerdown",
                event=>{

                    event.preventDefault();

                    event.stopPropagation();

                    completePoint(point);

                }
            );

        }
    );

}


/* =========================================================
   DOKONČENÍ BODU
========================================================= */

function completePoint(point){

    if(point.done)
        return;


    point.done=true;


    /*
       ČTVEREČEK ZŮSTÁVÁ.
       NIC SE NESMAŽE.
    */

    point.element.classList.add("done");


    updateTouchProgress();


    checkTouchFinished();

}


/* =========================================================
   PROGRESS
========================================================= */

function updateTouchProgress(){

    const total=points.length;

    const done=
        points.filter(
            p=>p.done
        ).length;


    progressText.textContent=
        done+" / "+total;


    fill.style.width=
        total ?
        (done/total*100)+"%" :
        "0%";

}


/* =========================================================
   HOTOVO
========================================================= */

function checkTouchFinished(){

    if(touchCompleted)
        return;


    if(
        points.length>0 &&
        points.every(
            p=>p.done
        )
    ){

        touchCompleted=true;


        progressText.textContent=
            "DOTYK OK";


        fill.style.width="100%";


        /*
           NEPŘEPÍNÁME HNED.
           Chvíli zůstane výsledek vidět.
        */

        setTimeout(
            nextTest,
            1000
        );

    }

}


/* =========================================================
   TAHÁNÍ
========================================================= */

touchArea.addEventListener(
    "pointerdown",
    event=>{

        pointerData.set(
            event.pointerId,
            {
                x:event.clientX,
                y:event.clientY
            }
        );


        try{

            touchArea.setPointerCapture(
                event.pointerId
            );

        }catch(e){}

    }
);


touchArea.addEventListener(
    "pointermove",
    event=>{

        const old=
            pointerData.get(
                event.pointerId
            );


        if(!old){

            pointerData.set(
                event.pointerId,
                {
                    x:event.clientX,
                    y:event.clientY
                }
            );

            return;

        }


        const x=event.clientX;

        const y=event.clientY;


        /*
           Kontrolujeme celou trasu.
           POŘADÍ NENÍ DŮLEŽITÉ.
        */

        points.forEach(
            point=>{

                if(point.done)
                    return;


                const distance=
                    distancePointToSegment(
                        point.cx,
                        point.cy,
                        old.x,
                        old.y,
                        x,
                        y
                    );


                if(distance<=32){

                    completePoint(point);

                }

            }
        );


        pointerData.set(
            event.pointerId,
            {
                x:x,
                y:y
            }
        );

    }
);


touchArea.addEventListener(
    "pointerup",
    event=>{

        pointerData.delete(
            event.pointerId
        );

    }
);


touchArea.addEventListener(
    "pointercancel",
    event=>{

        pointerData.delete(
            event.pointerId
        );

    }
);


/* =========================================================
   VZDÁLENOST OD ÚSEČKY
========================================================= */

function distancePointToSegment(
    px,
    py,
    x1,
    y1,
    x2,
    y2
){

    const dx=x2-x1;

    const dy=y2-y1;


    if(
        dx===0 &&
        dy===0
    ){

        return Math.hypot(
            px-x1,
            py-y1
        );

    }


    let t=
        (
            (px-x1)*dx+
            (py-y1)*dy
        )/
        (
            dx*dx+
            dy*dy
        );


    t=Math.max(
        0,
        Math.min(
            1,
            t
        )
    );


    const x=
        x1+t*dx;

    const y=
        y1+t*dy;


    return Math.hypot(
        px-x,
        py-y
    );

}


/* =========================================================
   POHYB
   NAHORU / DOLŮ / DOLEVA / DOPRAVA / STŘED
========================================================= */

function startMovement(){

    info.innerHTML=`

        <div class="big">
            POHYB
        </div>

        <div id="movementValue"
             class="value">
            Čekám na pohyb…
        </div>

    `;


    let lastX=null;

    let lastY=null;


    function handler(event){

        const a=
            event.accelerationIncludingGravity;


        if(!a)
            return;


        const x=a.x||0;

        const y=a.y||0;

        const z=a.z||0;


        let direction="STŘED";


        /*
           Orientace telefonu:

           X kladné → DOPRAVA
           X záporné → DOLEVA
           Y kladné → DOLŮ
           Y záporné → NAHORU
        */


        if(Math.abs(x)>2){

            if(x>0)
                direction="DOPRAVA";
            else
                direction="DOLEVA";

        }
        else if(Math.abs(y)>2){

            if(y>0)
                direction="DOLŮ";
            else
                direction="NAHORU";

        }
        else{

            direction="STŘED";

        }


        const value=
            document.getElementById(
                "movementValue"
            );


        if(value){

            value.textContent=

                direction+

                "\n\n"+

                "X: "+
                x.toFixed(2)+

                "\nY: "+
                y.toFixed(2)+

                "\nZ: "+
                z.toFixed(2);

        }

    }


    window.addEventListener(
        "devicemotion",
        handler
    );


    /*
       Pohybový test zůstane aktivní.
       Automaticky ho NEVYPNEME.
    */

    window._movementHandler=handler;

}


/* =========================================================
   OBRAZOVKA
========================================================= */

function startScreenInfo(){

    info.innerHTML=`

        <div class="big">
            OBRAZOVKA
        </div>

        <div id="screenValue"
             class="value">
        </div>

    `;


    function update(){

        const el=
            document.getElementById(
                "screenValue"
            );


        if(!el)
            return;


        const width=
            window.innerWidth;

        const height=
            window.innerHeight;


        const sw=
            screen.width;

        const sh=
            screen.height;


        const dpr=
            window.devicePixelRatio||1;


        const orientation=
            screen.orientation ?
            screen.orientation.type :
            "neznámá";


        el.textContent=

            "Okno: "+
            width+
            " × "+
            height+

            "\nDisplej: "+
            sw+
            " × "+
            sh+

            "\nDPR: "+
            dpr+

            "\nOrientace: "+
            orientation+

            "\nPoměr: "+
            (width/height).toFixed(2);

    }


    update();


    window.addEventListener(
        "resize",
        update
    );


    window.addEventListener(
        "orientationchange",
        update
    );


    window._screenUpdate=update;

}


/* =========================================================
   BATERIE
========================================================= */

async function startBattery(){

    info.innerHTML=`

        <div class="big">
            BATERIE
        </div>

        <div id="batteryValue"
             class="value">
            Načítám…
        </div>

    `;


    if(!navigator.getBattery){

        document.getElementById(
            "batteryValue"
        ).textContent=
            "Battery API není dostupné.";

        return;

    }


    try{

        const battery=
            await navigator.getBattery();


        function update(){

            const el=
                document.getElementById(
                    "batteryValue"
                );


            if(!el)
                return;


            const percent=
                Math.round(
                    battery.level*100
                );


            el.textContent=

                percent+
                " %"+

                "\n\n"+

                (
                    battery.charging
                    ?
                    "NABÍJÍ SE"
                    :
                    "NENABÍJÍ SE"
                )+

                "\n\nNapětí není přes web dostupné.";

        }


        update();


        battery.addEventListener(
            "levelchange",
            update
        );


        battery.addEventListener(
            "chargingchange",
            update
        );


        window._battery=battery;

    }
    catch(error){

        document.getElementById(
            "batteryValue"
        ).textContent=
            "Baterii nelze přečíst.";

    }

}


/* =========================================================
   ORIENTACE
========================================================= */

function startOrientation(){

    info.innerHTML=`

        <div class="big">
            ORIENTACE
        </div>

        <div id="orientationValue"
             class="value">
            Čekám…
        </div>

    `;


    function handler(event){

        const beta=
            event.beta||0;

        const gamma=
            event.gamma||0;


        let direction="STŘED";


        if(beta<-15)
            direction="NAHORU";

        else if(beta>15)
            direction="DOLŮ";

        else if(gamma<-15)
            direction="DOLEVA";

        else if(gamma>15)
            direction="DOPRAVA";


        const el=
            document.getElementById(
                "orientationValue"
            );


        if(el){

            el.textContent=

                direction+

                "\n\nBeta: "+
                beta.toFixed(1)+
                "°"+

                "\nGamma: "+
                gamma.toFixed(1)+
                "°";

        }

    }


    window.addEventListener(
        "deviceorientation",
        handler
    );


    window._orientationHandler=
        handler;

}


/* =========================================================
   ROTACE
========================================================= */

function startRotation(){

    info.innerHTML=`

        <div class="big">
            ROTACE
        </div>

        <div id="rotationValue"
             class="value">
            Čekám…
        </div>

    `;


    function handler(event){

        const r=
            event.rotationRate;


        if(!r)
            return;


        const alpha=
            r.alpha||0;

        const beta=
            r.beta||0;

        const gamma=
            r.gamma||0;


        const el=
            document.getElementById(
                "rotationValue"
            );


        if(el){

            el.textContent=

                "Alpha: "+
                alpha.toFixed(1)+
                "°/s"+

                "\nBeta: "+
                beta.toFixed(1)+
                "°/s"+

                "\nGamma: "+
                gamma.toFixed(1)+
                "°/s";

        }

    }


    window.addEventListener(
        "devicemotion",
        handler
    );


    window._rotationHandler=
        handler;

}


/* =========================================================
   KOMPAS
========================================================= */

function startCompass(){

    info.innerHTML=`

        <div class="big">
            KOMPAS
        </div>

        <div id="compassValue"
             class="value">
            Čekám…
        </div>

    `;


    function handler(event){

        let heading=
            event.webkitCompassHeading;


        if(
            heading===undefined &&
            event.alpha!==null
        ){

            heading=
                360-event.alpha;

        }


        const el=
            document.getElementById(
                "compassValue"
            );


        if(!el)
            return;


        if(heading===undefined){

            el.textContent=
                "Kompas není dostupný.";

            return;

        }


        heading=
            (heading+360)%360;


        let direction="S";


        if(
            heading>=22.5 &&
            heading<67.5
        )
            direction="SV";

        else if(
            heading>=67.5 &&
            heading<112.5
        )
            direction="V";

        else if(
            heading>=112.5 &&
            heading<157.5
        )
            direction="JV";

        else if(
            heading>=157.5 &&
            heading<202.5
        )
            direction="J";

        else if(
            heading>=202.5 &&
            heading<247.5
        )
            direction="JZ";

        else if(
            heading>=247.5 &&
            heading<292.5
        )
            direction="Z";

        else if(
            heading>=292.5 &&
            heading<337.5
        )
            direction="SZ";


        el.textContent=

            direction+

            "\n\n"+

            heading.toFixed(1)+
            "°";

    }


    window.addEventListener(
        "deviceorientation",
        handler,
        true
    );


    window._compassHandler=
        handler;

}


/* =========================================================
   SÍŤ
========================================================= */

function startNetwork(){

    info.innerHTML=`

        <div class="big">
            SÍŤ
        </div>

        <div id="networkValue"
             class="value">
        </div>

    `;


    function update(){

        const online=
            navigator.onLine;


        const connection=
            navigator.connection ||
            navigator.webkitConnection ||
            navigator.mozConnection;


        let text=
            online ?
            "ONLINE" :
            "OFFLINE";


        if(connection){

            text+=
                "\n\nTyp: "+
                (
                    connection.effectiveType||
                    "?"
                );


            if(
                connection.downlink!==undefined
            ){

                text+=
                    "\nRychlost: "+
                    connection.downlink+
                    " Mb/s";

            }

        }


        const el=
            document.getElementById(
                "networkValue"
            );


        if(el)
            el.textContent=text;

    }


    update();


    window.addEventListener(
        "online",
        update
    );


    window.addEventListener(
        "offline",
        update
    );


    window._networkUpdate=
        update;

}


/* =========================================================
   MULTITOUCH
========================================================= */

function startMultitouch(){

    info.innerHTML=`

        <div class="big">
            MULTITOUCH
        </div>

        <div id="multiValue"
             class="value">
            Dotkni se více míst současně
        </div>

    `;


    const dots=new Map();


    function down(event){

        const dot=
            document.createElement("div");


        dot.className="multiDot";


        dot.style.left=
            event.clientX+"px";

        dot.style.top=
            event.clientY+"px";


        touchArea.appendChild(dot);


        dots.set(
            event.pointerId,
            dot
        );


        update();

    }


    function move(event){

        const dot=
            dots.get(
                event.pointerId
            );


        if(!dot)
            return;


        dot.style.left=
            event.clientX+"px";

        dot.style.top=
            event.clientY+"px";

    }


    function up(event){

        const dot=
            dots.get(
                event.pointerId
            );


        if(dot)
            dot.remove();


        dots.delete(
            event.pointerId
        );


        update();

    }


    function update(){

        const el=
            document.getElementById(
                "multiValue"
            );


        if(el){

            el.textContent=
                "Aktivní dotyky: "+
                dots.size;

        }

    }


    touchArea.addEventListener(
        "pointerdown",
        down
    );

    touchArea.addEventListener(
        "pointermove",
        move
    );

    touchArea.addEventListener(
        "pointerup",
        up
    );

    touchArea.addEventListener(
        "pointercancel",
        up
    );

}

/* =========================================================
   ÚKLID STARÝCH SENSORŮ
========================================================= */

function cleanupSensors(){

    if(window._movementHandler){

        window.removeEventListener(
            "devicemotion",
            window._movementHandler
        );

        window._movementHandler=null;

    }


    if(window._orientationHandler){

        window.removeEventListener(
            "deviceorientation",
            window._orientationHandler
        );

        window._orientationHandler=null;

    }


    if(window._rotationHandler){

        window.removeEventListener(
            "devicemotion",
            window._rotationHandler
        );

        window._rotationHandler=null;

    }


    if(window._compassHandler){

        window.removeEventListener(
            "deviceorientation",
            window._compassHandler,
            true
        );

        window._compassHandler=null;

    }

}
