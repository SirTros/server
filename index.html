<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SirTros Magnetometer</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #080808;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .app {
        width: 100%;
        max-width: 600px;
        min-height: 100vh;
        padding: 24px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 16px;
    }

    .title {
        font-size: 28px;
        font-weight: 700;
        text-align: center;
    }

    .status {
        text-align: center;
        color: #aaa;
        font-size: 14px;
        min-height: 20px;
    }

    .main-card {
        background: #151515;
        border: 1px solid #292929;
        border-radius: 28px;
        padding: 28px 20px;
        text-align: center;
    }

    .value {
        font-size: 56px;
        font-weight: 700;
        letter-spacing: -2px;
    }

    .unit {
        color: #aaa;
        font-size: 17px;
        margin-top: 4px;
    }

    .state {
        margin-top: 18px;
        font-size: 20px;
        font-weight: 600;
    }

    .sub {
        margin-top: 8px;
        color: #999;
        font-size: 13px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
    }

    .axis {
        background: #151515;
        border: 1px solid #292929;
        border-radius: 18px;
        padding: 16px 8px;
        text-align: center;
    }

    .axis-name {
        color: #888;
        font-size: 13px;
    }

    .axis-value {
        margin-top: 7px;
        font-size: 18px;
        font-weight: 600;
    }

    .info {
        background: #111;
        border: 1px solid #242424;
        border-radius: 18px;
        padding: 15px;
    }

    .row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin: 7px 0;
        font-size: 14px;
    }

    .row span:first-child {
        color: #888;
    }

    button {
        width: 100%;
        border: 0;
        border-radius: 18px;
        padding: 17px;
        background: white;
        color: black;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
    }

    button:active {
        transform: scale(.98);
    }

    .warning {
        background: #1c1408;
        border: 1px solid #5a3d12;
        color: #ffc766;
        border-radius: 18px;
        padding: 16px;
        text-align: center;
        line-height: 1.4;
        display: none;
    }

    .good {
        color: #78e08f;
    }

    .magnet {
        color: #ffb45c;
    }

    .strong {
        color: #ff6666;
    }

    .normal {
        color: #aaa;
    }

    @media (max-height: 700px) {
        .app {
            padding: 14px;
            gap: 10px;
        }

        .title {
            font-size: 23px;
        }

        .main-card {
            padding: 18px;
        }

        .value {
            font-size: 44px;
        }
    }
</style>
</head>

<body>

<div class="app">

    <div class="title">🧲 Magnetometr</div>

    <div class="status" id="status">
        Připravuji senzor…
    </div>

    <div class="main-card">

        <div class="value" id="total">
            —
        </div>

        <div class="unit">
            µT
        </div>

        <div class="state normal" id="state">
            Čekám na měření
        </div>

        <div class="sub" id="change">
            Základní hodnota: —
        </div>

    </div>

    <div class="grid">

        <div class="axis">
            <div class="axis-name">X</div>
            <div class="axis-value" id="x">—</div>
        </div>

        <div class="axis">
            <div class="axis-name">Y</div>
            <div class="axis-value" id="y">—</div>
        </div>

        <div class="axis">
            <div class="axis-name">Z</div>
            <div class="axis-value" id="z">—</div>
        </div>

    </div>

    <div class="info">

        <div class="row">
            <span>Vzorky</span>
            <span id="samples">0</span>
        </div>

        <div class="row">
            <span>Minimum</span>
            <span id="min">—</span>
        </div>

        <div class="row">
            <span>Maximum</span>
            <span id="max">—</span>
        </div>

        <div class="row">
            <span>Základ</span>
            <span id="baseline">—</span>
        </div>

    </div>

    <button id="baselineBtn">
        Nastavit aktuální hodnotu jako základ
    </button>

    <button id="fullscreenBtn">
        Celá obrazovka
    </button>

    <div class="warning" id="warning"></div>

</div>

<script>

let sensor = null;

let samples = 0;
let minValue = Infinity;
let maxValue = -Infinity;

let baseline = null;

let latestX = 0;
let latestY = 0;
let latestZ = 0;
let latestTotal = 0;

let lastRender = 0;


/* -----------------------------
   DOM
----------------------------- */

const totalEl = document.getElementById("total");
const xEl = document.getElementById("x");
const yEl = document.getElementById("y");
const zEl = document.getElementById("z");

const stateEl = document.getElementById("state");
const changeEl = document.getElementById("change");

const samplesEl = document.getElementById("samples");
const minEl = document.getElementById("min");
const maxEl = document.getElementById("max");
const baselineEl = document.getElementById("baseline");

const statusEl = document.getElementById("status");
const warningEl = document.getElementById("warning");


/* -----------------------------
   Magnetometr
----------------------------- */

function startMagnetometer() {

    if (!("Magnetometer" in window)) {

        statusEl.textContent = "Magnetometr není v tomto prohlížeči dostupný.";

        warningEl.style.display = "block";
        warningEl.innerHTML =
            "Tento prohlížeč neposkytuje webu přístup k magnetometru.<br><br>" +
            "Zkus stránku otevřít v aktuálním Chrome přes HTTPS.";

        return;
    }

    try {

        sensor = new Magnetometer({
            frequency: 20
        });

        sensor.addEventListener("reading", onReading);

        sensor.addEventListener("error", function(event) {

            statusEl.textContent = "Chyba magnetometru.";

            warningEl.style.display = "block";

            if (event.error && event.error.name) {
                warningEl.textContent =
                    "Magnetometr se nepodařilo spustit: " +
                    event.error.name;
            } else {
                warningEl.textContent =
                    "Magnetometr se nepodařilo spustit.";
            }

        });

        sensor.start();

        statusEl.textContent = "Magnetometr běží";

    } catch (error) {

        statusEl.textContent = "Magnetometr nelze spustit.";

        warningEl.style.display = "block";

        warningEl.textContent =
            "Prohlížeč nepovolil přístup k magnetometru.";
    }
}


/* -----------------------------
   Měření
----------------------------- */

function onReading() {

    if (
        !Number.isFinite(sensor.x) ||
        !Number.isFinite(sensor.y) ||
        !Number.isFinite(sensor.z)
    ) {
        return;
    }

    latestX = sensor.x;
    latestY = sensor.y;
    latestZ = sensor.z;

    latestTotal = Math.sqrt(
        latestX * latestX +
        latestY * latestY +
        latestZ * latestZ
    );

    samples++;

    minValue = Math.min(minValue, latestTotal);
    maxValue = Math.max(maxValue, latestTotal);

    /*
       Nevykreslujeme DOM při každém senzoru.
       20 Hz senzor -> maximálně cca 10 UI aktualizací/s.
       Díky tomu je stránka plynulejší.
    */

    const now = performance.now();

    if (now - lastRender < 100) {
        return;
    }

    lastRender = now;

    render();
}


/* -----------------------------
   Vykreslení
----------------------------- */

function render() {

    totalEl.textContent = latestTotal.toFixed(1);

    xEl.textContent = latestX.toFixed(1);
    yEl.textContent = latestY.toFixed(1);
    zEl.textContent = latestZ.toFixed(1);

    samplesEl.textContent = samples;

    minEl.textContent =
        Number.isFinite(minValue)
            ? minValue.toFixed(1) + " µT"
            : "—";

    maxEl.textContent =
        Number.isFinite(maxValue)
            ? maxValue.toFixed(1) + " µT"
            : "—";

    if (baseline !== null) {

        const difference = latestTotal - baseline;
        const absoluteDifference = Math.abs(difference);

        changeEl.textContent =
            "Změna oproti základu: " +
            (difference >= 0 ? "+" : "") +
            difference.toFixed(1) +
            " µT";

        if (absoluteDifference >= 80) {

            stateEl.textContent =
                "🧲 Velmi silná změna pole";

            stateEl.className =
                "state strong";

        } else if (absoluteDifference >= 25) {

            stateEl.textContent =
                "🧲 Výrazná změna pole";

            stateEl.className =
                "state magnet";

        } else {

            stateEl.textContent =
                "🌍 Běžné magnetické pole";

            stateEl.className =
                "state good";
        }

    } else {

        changeEl.textContent =
            "Základní hodnota: nenastavena";

        stateEl.textContent =
            "🌍 Měření probíhá";

        stateEl.className =
            "state normal";
    }
}


/* -----------------------------
   Základní hodnota
----------------------------- */

document.getElementById("baselineBtn")
    .addEventListener("click", function() {

        if (samples === 0) {
            return;
        }

        baseline = latestTotal;

        baselineEl.textContent =
            baseline.toFixed(1) + " µT";

        changeEl.textContent =
            "Změna oproti základu: 0.0 µT";

        stateEl.textContent =
            "🌍 Základ nastaven";

        stateEl.className =
            "state good";
    });


/* -----------------------------
   Fullscreen
----------------------------- */

document.getElementById("fullscreenBtn")
    .addEventListener("click", async function() {

        try {

            if (!document.fullscreenElement) {

                await document.documentElement.requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (e) {
            // Některé prohlížeče fullscreen nepovolují.
        }
    });


/* -----------------------------
   Wake Lock
----------------------------- */

let wakeLock = null;

async function requestWakeLock() {

    if (!("wakeLock" in navigator)) {
        return;
    }

    try {
        wakeLock = await navigator.wakeLock.request("screen");
    } catch (e) {
        // Wake Lock není podporován nebo nebyl povolen.
    }
}


/* -----------------------------
   Spuštění
----------------------------- */

requestWakeLock();
startMagnetometer();


/* -----------------------------
   Obnovení Wake Locku
----------------------------- */

document.addEventListener("visibilitychange", function() {

    if (document.visibilityState === "visible") {
        requestWakeLock();
    }

});

</script>

</body>
</html>
