<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pokladna OBCHOD</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#000;
    color:white;
    margin:0;
    padding:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

#fullscreenIntro,
#loginScreen,
#app{
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    width:100%;
    height:100%;
    text-align:center;
}

#fullscreenIntro{
    display:flex;
}

#fullscreenButton{
    padding:15px 30px;
    font-size:20px;
    background:cyan;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin-top:20px;
    font-weight:bold;
}

#loadingScreen{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    color:white;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-size:26px;
    z-index:9999;
}

.loaderBar{
    width:300px;
    height:12px;
    border:2px solid white;
    margin-top:20px;
    overflow:hidden;
    border-radius:10px;
}

.loaderFill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, cyan, royalblue);
}

@keyframes loadAnim{
    100%{width:100%;}
}

#loginInput{
    padding:12px;
    font-size:20px;
    background:#111;
    border:1px solid cyan;
    border-radius:6px;
    color:white;
    width:180px;
    text-align:center;
}

#loginButton{
    margin-top:15px;
    padding:12px 20px;
    background:cyan;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
    border:none;
}

#app{
    position:relative;
}

h1{
    margin-top:10px;
    font-size:28px;
    color:cyan;
}

button{
    cursor:pointer;
    font-weight:bold;
    border:none;
    padding:12px;
    border-radius:6px;
}

.pro-button{
    background:cyan;
    color:black;
    margin-top:10px;
}

.lock-button{
    position:absolute;
    top:10px;
    right:10px;
    background:white;
    color:black;
    padding:8px 15px;
    font-size:14px;
}

#produkty{
    display:grid;
    grid-template-columns:repeat(2, 220px);
    gap:15px;
    margin-top:20px;
}

.produktBtn{
    background:#111;
    color:white;
    border:2px solid cyan;
    border-radius:12px;
    padding:20px;
    font-size:20px;
    transition:0.2s;
}

.produktBtn:hover{
    background:cyan;
    color:black;
    transform:scale(1.05);
}

.produktBtn span{
    display:block;
    margin-top:10px;
    font-size:16px;
    color:#aaa;
}

.produktBtn:hover span{
    color:black;
}

#zboziList{
    list-style:none;
    padding:0;
    margin-top:20px;
    width:90%;
    max-width:500px;
    max-height:220px;
    overflow-y:auto;
    border:1px solid #333;
    border-radius:10px;
}

.addedItem{
    background:#111;
    padding:10px;
    margin-bottom:5px;
    border-radius:6px;
    border-left:4px solid cyan;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.addedItem button{
    background:red;
    color:white;
    padding:5px 10px;
    font-size:12px;
}

.payment-modal{
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    background:#111;
    padding:25px;
    border-radius:10px;
    border:2px solid cyan;
    width:300px;
    text-align:center;
    z-index:1000;
}

#zaplatitMessage{
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:#0f0;
    color:black;
    padding:30px;
    font-size:36px;
    border-radius:15px;
    font-weight:bold;
    z-index:2000;
}
</style>
</head>

<body>

<div id="fullscreenIntro">
    <h2>Kioskový systém</h2>
    <button id="fullscreenButton" onclick="requestFullscreenAndLoad()">AKTIVOVAT POKLADNU</button>
</div>

<div id="loadingScreen">
    Načítání...
    <div class="loaderBar">
        <div class="loaderFill"></div>
    </div>
</div>

<div id="loginScreen">
    <h1>Zadejte PIN</h1>
    <input id="loginInput" type="password" placeholder="PIN">
    <button id="loginButton" onclick="login()">VSTOUPIT</button>
</div>

<div id="app">

    <button class="lock-button" onclick="logout()">ZAMKNOUT</button>

    <h1>POKLADNA</h1>

    <div id="produkty">

        <button class="produktBtn" onclick="pridatProdukt('Tričko',149)">
            Tričko
            <span>149 Kč</span>
        </button>

        <button class="produktBtn" onclick="pridatProdukt('Kalhotky',100)">
            Kalhotky
            <span>100 Kč</span>
        </button>

        <button class="produktBtn" onclick="pridatProdukt('Malý polštářek',50)">
            Malý polštářek
            <span>50 Kč</span>
        </button>

        <button class="produktBtn" onclick="pridatProdukt('Velký polštářek',120)">
            Velký polštářek
            <span>120 Kč</span>
        </button>

        <button class="produktBtn" onclick="pridatProdukt('Čepička bambule',99)">
            Čepička bambule
            <span>99 Kč</span>
        </button>

        <button class="produktBtn" onclick="pridatProdukt('Peřinka',29)">
            Peřinka
            <span>29 Kč</span>
        </button>

        <button class="produktBtn" onclick="pridatProdukt('Taška',5)">
            Taška
            <span>5 Kč</span>
        </button>

    </div>

    <ul id="zboziList"></ul>

    <h2 id="celkovaCena">CELKEM: 0 Kč</h2>

    <button class="pro-button" style="background:lime;" onclick="openPaymentWindow()">
        ZAPLATIT
    </button>

</div>

<div id="paymentWindow" class="payment-modal">
    <h3>Celkem k úhradě: <span id="cashTotalDisplay">0 Kč</span></h3>

    <button class="pro-button" onclick="finishPayment()">
        ZAPLATIT
    </button>

    <button class="pro-button" style="background:#444;color:white;" onclick="closePaymentWindow()">
        ZPĚT
    </button>
</div>

<div id="zaplatitMessage">
    ZAPLACENO ✔
</div>

<script>

const scanSound = new Audio();
const paySound = new Audio();

let wakeLock = null;
let celkem = 0;

document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement){
        logout();
    }
});

async function requestFullscreenAndLoad(){

    if(document.documentElement.requestFullscreen){
        document.documentElement.requestFullscreen();
    }

    try{
        if('wakeLock' in navigator){
            wakeLock = await navigator.wakeLock.request('screen');
        }
    }catch(e){}

    document.getElementById("fullscreenIntro").style.display = "none";
    document.getElementById("loadingScreen").style.display = "flex";

    document.querySelector(".loaderFill").style.animation = "loadAnim 1s forwards";

    setTimeout(()=>{
        document.getElementById("loadingScreen").style.display = "none";
        document.getElementById("loginScreen").style.display = "flex";
    },1000);
}

function login(){

    if(document.getElementById("loginInput").value === "153500"){

        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("app").style.display = "flex";
    }

    document.getElementById("loginInput").value = "";
}

function pridatProdukt(nazev, cena){

    scanSound.currentTime = 0;
    scanSound.play();

    celkem += cena;

    const li = document.createElement("li");

    li.className = "addedItem";

    li.innerHTML = `
        <span>${nazev}</span>
        <span>
            ${cena} Kč
            <button onclick="odebratProdukt(this, ${cena})">X</button>
        </span>
    `;

    document.getElementById("zboziList").prepend(li);

    aktualizovat();
}

function odebratProdukt(btn, cena){

    btn.parentElement.parentElement.remove();

    celkem -= cena;

    aktualizovat();
}

function aktualizovat(){

    document.getElementById("celkovaCena").innerText =
        `CELKEM: ${celkem} Kč`;

    document.getElementById("cashTotalDisplay").innerText =
        `${celkem} Kč`;
}

function openPaymentWindow(){

    if(celkem > 0){
        document.getElementById("paymentWindow").style.display = "block";
    }
}

function closePaymentWindow(){

    document.getElementById("paymentWindow").style.display = "none";
}

function finishPayment(){

    paySound.currentTime = 0;
    paySound.play();

    closePaymentWindow();

    document.getElementById("zaplatitMessage").style.display = "block";

    setTimeout(()=>{

        document.getElementById("zaplatitMessage").style.display = "none";

        document.getElementById("zboziList").innerHTML = "";

        celkem = 0;

        aktualizovat();

    },2500);
}

function logout(){

    document.getElementById("app").style.display = "none";
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("fullscreenIntro").style.display = "flex";

    if(document.exitFullscreen && document.fullscreenElement){
        document.exitFullscreen();
    }
}

</script>

</body>
</html>
