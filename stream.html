<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SirTros TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#screen{
    width:1920px;
    height:1080px;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    transform-origin:center;
    background:#000;
    overflow:hidden;
}

#video{
    width:1920px;
    height:1080px;
    object-fit:cover;
    background:#000;
    display:none;
}

#logo{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    font-size:32px;
    font-weight:bold;
    z-index:20;
}

#startBtn{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    z-index:999;
}

#startButton{
    padding:20px 40px;
    font-size:24px;
    font-weight:bold;
    border:0;
    border-radius:10px;
    cursor:pointer;
}

#status{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:900px;
    max-width:90%;
    max-height:80%;
    overflow:auto;
    padding:30px;
    background:#111;
    color:white;
    border-radius:16px;
    z-index:10;
    box-shadow:0 0 40px rgba(255,255,255,.08);
}

#status h1{
    margin:0 0 20px;
    font-size:32px;
}

#statusText{
    white-space:pre-wrap;
    font-family:Consolas,monospace;
    font-size:16px;
    line-height:1.6;
    color:#ddd;
}

#retryButton{
    margin-top:20px;
    padding:14px 25px;
    border:0;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

#debug{
    position:absolute;
    bottom:15px;
    left:15px;
    color:#aaa;
    background:rgba(0,0,0,.75);
    padding:8px 12px;
    border-radius:6px;
    font-family:Consolas,monospace;
    font-size:13px;
    z-index:30;
    display:none;
}
</style>
</head>

<body>

<div id="screen">

    <div id="logo">
        SirTros TV
    </div>

    <video
        id="video"
        autoplay
        playsinline
        controls>
    </video>

    <div id="status">

        <h1 id="statusTitle">
            Připraveno
        </h1>

        <div id="statusText">
            Klikni na Spustit SirTros TV.
        </div>

        <button id="retryButton" onclick="startStream()">
            Zkusit znovu
        </button>

    </div>

    <div id="debug"></div>

</div>

<div id="startBtn">

    <button id="startButton" onclick="startTV()">
        Spustit SirTros TV
    </button>

</div>

<script>

const video =
    document.getElementById("video");

const startBtn =
    document.getElementById("startBtn");

const status =
    document.getElementById("status");

const statusTitle =
    document.getElementById("statusTitle");

const statusText =
    document.getElementById("statusText");

const retryButton =
    document.getElementById("retryButton");

const screen =
    document.getElementById("screen");

const debug =
    document.getElementById("debug");


const streamUrl =
    "http://192.168.0.1:8888/live/stream/index.m3u8";


let hls = null;
let retryTimer = null;


/* ==========================================
   OBRAZOVKA
========================================== */

function resizeScreen(){

    const scale = Math.min(
        window.innerWidth / 1920,
        window.innerHeight / 1080
    );

    screen.style.transform =
        "translate(-50%,-50%) scale(" + scale + ")";
}

window.addEventListener(
    "resize",
    resizeScreen
);

resizeScreen();


/* ==========================================
   STATUS
========================================== */

function showStatus(title,text){

    status.style.display = "block";

    statusTitle.textContent = title;

    statusText.textContent = text;
}


function hideStatus(){

    status.style.display = "none";
}


/* ==========================================
   DEBUG
========================================== */

function showDebug(text){

    debug.style.display = "block";

    debug.textContent = text;
}


/* ==========================================
   FULLSCREEN
========================================== */

async function goFullscreen(){

    try{

        if(document.documentElement.requestFullscreen){

            await document.documentElement.requestFullscreen();

        }

    }catch(error){

        console.log(
            "Fullscreen chyba:",
            error
        );

    }
}


/* ==========================================
   START TV
========================================== */

async function startTV(){

    startBtn.style.display = "none";

    await goFullscreen();

    startStream();
}


/* ==========================================
   START STREAM
========================================== */

function startStream(){

    clearTimeout(retryTimer);


    if(hls){

        try{
            hls.destroy();
        }catch(e){}

        hls = null;
    }


    video.pause();

    video.removeAttribute("src");

    video.load();

    video.style.display = "none";


    showStatus(
        "Připojování…",
        "Adresa streamu:\n\n" +
        streamUrl +
        "\n\n" +
        "Kontroluji server..."
    );


    /* ======================================
       HLS.JS
    ====================================== */

    if(Hls.isSupported()){

        hls = new Hls({

            lowLatencyMode:false,

            maxBufferLength:30,

            maxMaxBufferLength:60,

            backBufferLength:60,

            enableWorker:true

        });


        hls.on(
            Hls.Events.MANIFEST_LOADING,
            function(event,data){

                showStatus(
                    "Načítám stream…",
                    "Připojuji se na:\n\n" +
                    data.url +
                    "\n\n" +
                    "Čekám na odpověď serveru..."
                );

            }
        );


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function(){

                video.style.display = "block";

                hideStatus();

                video.play()
                .then(function(){

                    showDebug(
                        "● SirTros TV | STREAM OK"
                    );

                })
                .catch(function(error){

                    showStatus(
                        "Video se nepodařilo spustit",
                        "Stream byl nalezen, ale video nejde přehrát.\n\n" +
                        "Chyba:\n" +
                        error.message
                    );

                });

            }
        );


        hls.on(
            Hls.Events.ERROR,
            function(event,data){

                console.error(
                    "HLS chyba:",
                    data
                );


                if(data.fatal){

                    let details =
                        data.details || "neznámá chyba";

                    let type =
                        data.type || "neznámý typ";


                    let message =
                        "Nepodařilo se připojit ke streamu.\n\n" +

                        "URL:\n" +
                        streamUrl +
                        "\n\n" +

                        "Typ chyby:\n" +
                        type +
                        "\n\n" +

                        "Detail:\n" +
                        details +
                        "\n\n";


                    if(
                        details ===
                        "manifestLoadError"
                    ){

                        message +=
                            "Server neposlal HLS manifest.\n\n" +

                            "Možné příčiny:\n" +
                            "• server neběží\n" +
                            "• špatná IP adresa\n" +
                            "• špatný port\n" +
                            "• špatná cesta k index.m3u8\n" +
                            "• HTTP/HTTPS blokování\n" +
                            "• CORS\n" +
                            "• zařízení není ve stejné síti";

                    }
                    else if(
                        details ===
                        "manifestLoadTimeOut"
                    ){

                        message +=
                            "Server neodpověděl včas.";

                    }
                    else if(
                        details ===
                        "fragLoadError"
                    ){

                        message +=
                            "Manifest existuje, ale nepodařilo se načíst video segment.";

                    }
                    else if(
                        details ===
                        "fragLoadTimeOut"
                    ){

                        message +=
                            "Video segment neodpověděl včas.";

                    }
                    else{

                        message +=
                            "HLS přehrávač oznámil závažnou chybu.";

                    }


                    showStatus(
                        "❌ Stream nefunguje",
                        message
                    );


                    showDebug(
                        "● SirTros TV | CHYBA: " +
                        details
                    );


                    hls.destroy();

                    hls = null;


                    retryTimer =
                        setTimeout(
                            startStream,
                            5000
                        );

                }

            }
        );


        hls.loadSource(streamUrl);

        hls.attachMedia(video);

    }

    else if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        /*
        ======================================
        Nativní HLS
        ======================================
        */

        video.src = streamUrl;


        video.addEventListener(
            "loadedmetadata",
            function(){

                video.style.display =
                    "block";

                hideStatus();

                video.play()
                .then(function(){

                    showDebug(
                        "● SirTros TV | NATIVNÍ HLS OK"
                    );

                })
                .catch(function(error){

                    showStatus(
                        "❌ Video nelze spustit",
                        "Stream byl nalezen, ale video se nepodařilo spustit.\n\n" +
                        "Chyba:\n" +
                        error.message
                    );

                });

            },
            {once:true}
        );


        video.addEventListener(
            "error",
            function(){

                const error =
                    video.error;


                let text =
                    "Nativní HLS přehrávání selhalo.\n\n";


                if(error){

                    text +=
                        "Kód chyby: " +
                        error.code +
                        "\n\n" +

                        "Zpráva: " +
                        error.message;
                }


                showStatus(
                    "❌ Stream nefunguje",
                    text
                );

            },
            {once:true}
        );

    }

    else{

        showStatus(
            "❌ HLS není podporováno",
            "Tento prohlížeč neumí přehrávat HLS stream."
        );

    }

}


/* ==========================================
   VIDEO ERROR
========================================== */

video.addEventListener(
    "error",
    function(){

        if(!video.error){
            return;
        }


        showStatus(

            "❌ Chyba videa",

            "Přehrávač oznámil chybu.\n\n" +

            "Kód:\n" +
            video.error.code +
            "\n\n" +

            "Zpráva:\n" +
            video.error.message

        );

    }
);


/* ==========================================
   VIDEO PLAYING
========================================== */

video.addEventListener(
    "playing",
    function(){

        hideStatus();

        showDebug(
            "● SirTros TV | PŘEHRÁVÁ SE"
        );

    }
);


/* ==========================================
   VIDEO WAITING
========================================== */

video.addEventListener(
    "waiting",
    function(){

        showDebug(
            "● SirTros TV | Načítám video..."
        );

    }
);


/* ==========================================
   VIDEO STALLED
========================================== */

video.addEventListener(
    "stalled",
    function(){

        showDebug(
            "● SirTros TV | Stream se zastavil"
        );

    }
);


/* ==========================================
   VIDITELNOST KARTY
========================================== */

document.addEventListener(
    "visibilitychange",
    function(){

        if(!document.hidden){

            video.play()
            .catch(function(){

                if(!hls){

                    startStream();

                }

            });

        }

    }
);


/* ==========================================
   OCHRANA PROTI ZASTAVENÍ
========================================== */

setInterval(
    function(){

        if(
            !document.hidden &&
            video.style.display === "block" &&
            video.paused
        ){

            video.play()
            .catch(function(){

                startStream();

            });

        }

    },
    5000
);

</script>

</body>
</html>
