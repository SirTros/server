<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SirTros TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#screen{
    width:1920px;
    height:1080px;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    transform-origin:center;
    background:#000;
    overflow:hidden;
}

#video{
    width:1920px;
    height:1080px;
    object-fit:cover;
    display:none;
    background:#000;
}

#logo{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    font-size:32px;
    font-weight:bold;
    z-index:10;
    user-select:none;
}

#startBtn{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    z-index:999;
}

#startBtn button{
    padding:20px 40px;
    font-size:24px;
    font-weight:bold;
    border:none;
    border-radius:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="screen">

    <div id="logo">
        SirTros TV
    </div>

    <video
        id="video"
        autoplay
        playsinline>
    </video>

</div>

<div id="startBtn">
    <button onclick="startTV()">
        Spustit SirTros TV
    </button>
</div>

<script>

const video = document.getElementById("video");
const startBtn = document.getElementById("startBtn");
const screen = document.getElementById("screen");

const streamUrl =
    "http://192.168.0.13:8888/live/stream/index.m3u8";

let hls = null;


/* ==========================================
   PŘIZPŮSOBENÍ OBRAZOVKY
========================================== */

function resizeScreen(){

    const scale = Math.min(
        window.innerWidth / 1920,
        window.innerHeight / 1080
    );

    screen.style.transform =
        "translate(-50%, -50%) scale(" + scale + ")";

}

window.addEventListener(
    "resize",
    resizeScreen
);

resizeScreen();


/* ==========================================
   FULLSCREEN
========================================== */

async function goFullscreen(){

    try{

        if(document.documentElement.requestFullscreen){

            await document.documentElement.requestFullscreen();

        }

    }catch(error){

        console.log(error);

    }

}


/* ==========================================
   SPUŠTĚNÍ STREAMU
========================================== */

function startStream(){

    if(hls){

        hls.destroy();
        hls = null;

    }


    video.pause();
    video.removeAttribute("src");
    video.load();


    if(Hls.isSupported()){

        hls = new Hls({

            lowLatencyMode:false,

            maxBufferLength:30,

            maxMaxBufferLength:60,

            backBufferLength:60,

            enableWorker:true

        });


        hls.loadSource(streamUrl);

        hls.attachMedia(video);


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function(){

                video.style.display = "block";

                video.play().catch(function(){});

            }
        );


        hls.on(
            Hls.Events.ERROR,
            function(event,data){

                if(data.fatal){

                    hls.destroy();

                    hls = null;

                    setTimeout(
                        startStream,
                        3000
                    );

                }

            }
        );

    }

    else if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src = streamUrl;

        video.addEventListener(
            "loadedmetadata",
            function(){

                video.style.display = "block";

                video.play().catch(function(){});

            },
            {once:true}
        );

    }

}


/* ==========================================
   START TV
========================================== */

async function startTV(){

    startBtn.style.display = "none";

    await goFullscreen();

    startStream();

}


/* ==========================================
   KDYŽ SE VRÁTÍŠ NA KARTU
========================================== */

document.addEventListener(
    "visibilitychange",
    function(){

        if(!document.hidden){

            video.play().catch(function(){

                startStream();

            });

        }

    }
);


/* ==========================================
   OCHRANA PROTI ZASTAVENÍ
========================================== */

setInterval(
    function(){

        if(
            !document.hidden &&
            video.style.display === "block" &&
            video.paused
        ){

            video.play().catch(function(){

                startStream();

            });

        }

    },
    5000
);

</script>

</body>
</html>
