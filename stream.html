<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>SirTros TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
html, body{
    margin:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
    font-family:Arial;
}

#screen{
    width:1920px;
    height:1080px;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%, -50%);
    transform-origin:center;
    background:black;
    overflow:hidden;
}

#video{
    width:1920px;
    height:1080px;
    object-fit:cover;
    display:none;
}

#logo{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    font-size:32px;
    font-weight:bold;
    z-index:10;
    user-select:none;
}

#startBtn{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:black;
    z-index:999;
}

button{
    padding:20px 40px;
    font-size:24px;
    font-weight:bold;
    border:none;
    cursor:pointer;
}
</style>

</head>

<body>


<div id="screen">

    <div id="logo">
        SirTros TV
    </div>

    <video id="video" autoplay playsinline></video>

</div>


<div id="startBtn">
    <button onclick="startTV()">
        Spustit SirTros TV
    </button>
</div>


<script>

const video = document.getElementById("video");
const startBtn = document.getElementById("startBtn");
const screen = document.getElementById("screen");


const streamUrl = "http://10.150.245.197:8888/live/stream/index.m3u8";

let hls;



// přizpůsobení obrazovce

function resizeScreen(){

    let scale = Math.min(
        window.innerWidth / 1920,
        window.innerHeight / 1080
    );

    screen.style.transform =
        "translate(-50%, -50%) scale(" + scale + ")";
}


window.addEventListener("resize", resizeScreen);

resizeScreen();




// fullscreen

function goFullscreen(){

    const el=document.documentElement;

    if(el.requestFullscreen){
        el.requestFullscreen();
    }

}




// spuštění streamu

function startStream(){

    if(hls){
        hls.destroy();
    }


    if(Hls.isSupported()){


        hls = new Hls({

            // větší buffer = méně sekání
            lowLatencyMode:false,

            maxBufferLength:30,

            maxMaxBufferLength:60,

            backBufferLength:60,

            enableWorker:true

        });



        hls.loadSource(streamUrl);

        hls.attachMedia(video);



        hls.on(
            Hls.Events.MANIFEST_PARSED,
            ()=>{

                video.style.display="block";

                video.play();

            }
        );



        hls.on(
            Hls.Events.ERROR,
            (event,data)=>{

                if(data.fatal){

                    console.log("Stream chyba, obnovuji...");

                    hls.destroy();

                    setTimeout(
                        startStream,
                        3000
                    );

                }

            }
        );



    }
    else{


        video.src=streamUrl;


        video.onloadeddata=()=>{

            video.style.display="block";

            video.play();

        };


    }

}




function startTV(){

    startBtn.style.display="none";

    goFullscreen();

    startStream();

}




// když se vrátíš na kartu

document.addEventListener(
"visibilitychange",
()=>{

    if(!document.hidden){

        video.play().catch(()=>{

            startStream();

        });

    }

});




// ochrana proti zastavení

setInterval(()=>{

    if(video.paused && !document.hidden){

        video.play().catch(()=>{

            startStream();

        });

    }

},5000);



</script>

</body>
</html>
