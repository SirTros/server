<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>SirTros TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
html, body{
    margin:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
    font-family:Arial;
}

#video{
    width:100vw;
    height:100vh;
    object-fit:cover;
    display:none;
}

#logo{
    position:fixed;
    top:15px;
    left:15px;
    color:white;
    font-size:32px;
    font-weight:bold;
    z-index:10;
    user-select:none;
}

#startBtn{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:black;
    z-index:999;
}

button{
    padding:20px 40px;
    font-size:24px;
    font-weight:bold;
    border:none;
    cursor:pointer;
}
</style>
</head>
<body>

<div id="logo">SirTros TV</div>

<div id="startBtn">
    <button onclick="startTV()">Spustit SirTros TV</button>
</div>

<video id="video" autoplay playsinline></video>

<script>
const video = document.getElementById("video");
const startBtn = document.getElementById("startBtn");

const streamUrl = "http://192.168.0.13:8888/live/stream/index.m3u8";

let hls;

function goFullscreen(){
    const el = document.documentElement;

    if (el.requestFullscreen) {
        el.requestFullscreen();
    } else if (el.webkitRequestFullscreen) {
        el.webkitRequestFullscreen();
    } else if (el.msRequestFullscreen) {
        el.msRequestFullscreen();
    }
}

function startStream(){

    if (Hls.isSupported()) {

        hls = new Hls({
            lowLatencyMode: true
        });

        hls.loadSource(streamUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.style.display = "block";
            video.play();
        });

        hls.on(Hls.Events.ERROR, () => {
            setTimeout(startStream, 3000);
        });

    } else {

        video.src = streamUrl;

        video.onloadeddata = () => {
            video.style.display = "block";
            video.play();
        };

        video.onerror = () => {
            setTimeout(startStream, 3000);
        };
    }
}

function startTV(){
    startBtn.style.display = "none";

    goFullscreen();   // ← FULLSCREEN TADY
    startStream();
}

// návrat na kartu = zkus znovu pustit
document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
        video.play().catch(() => {
            startStream();
        });
    }
});

// keep alive proti uspání
setInterval(() => {
    if (video.paused && !document.hidden) {
        video.play().catch(() => {});
    }
}, 3000);

</script>

</body>
</html>
