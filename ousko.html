<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ouško AI</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
}

.app{
    width:min(600px,94vw);
    background:#1c1c1c;
    border:1px solid #333;
    border-radius:24px;
    padding:28px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.ousko{
    font-size:80px;
    margin-bottom:5px;
}

h1{
    margin:0;
    font-size:32px;
}

.subtitle{
    color:#aaa;
    margin:8px 0 25px;
}

.status{
    padding:18px;
    border-radius:16px;
    background:#252525;
    margin-bottom:20px;
    font-size:18px;
}

.dot{
    width:13px;
    height:13px;
    display:inline-block;
    border-radius:50%;
    background:#777;
    margin-right:8px;
}

.dot.ready{
    background:#4caf50;
}

.dot.listening{
    background:#ff8c32;
}

.dot.speaking{
    background:#42a5f5;
}

button{
    width:100%;
    padding:16px;
    border:0;
    border-radius:14px;
    background:#ff8c32;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ff9f4d;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.answer{
    margin-top:20px;
    padding:18px;
    background:#252525;
    border-radius:16px;
    text-align:left;
    min-height:70px;
    line-height:1.5;
}

.small{
    color:#888;
    font-size:13px;
    margin-top:18px;
}

.wake{
    color:#ff9f4d;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="app">

    <div class="ousko">🦊</div>

    <h1>Ouško AI</h1>

    <div class="subtitle">
        Hlasový asistent
    </div>

    <div class="status" id="status">
        <span class="dot" id="dot"></span>
        <span id="statusText">Mikrofon není povolen</span>
    </div>

    <button id="startButton">
        🎤 Povolit mikrofon a spustit Ouška
    </button>

    <div class="answer" id="answer">
        Ouško čeká... 🦊
    </div>

    <div class="small">
        Po spuštění řekni:
        <span class="wake">„Hey Ouško“</span>
    </div>

</div>

<script src="ai.js"></script>

<script>

let recognition;

let running = false;
let listeningForCommand = false;
let speaking = false;

const startButton =
    document.getElementById("startButton");

const statusText =
    document.getElementById("statusText");

const dot =
    document.getElementById("dot");

const answer =
    document.getElementById("answer");


function setStatus(text,type=""){

    statusText.textContent=text;

    dot.className="dot";

    if(type){
        dot.classList.add(type);
    }

}


function showAnswer(text){

    answer.textContent=text;

}


/*
==================================================
  TEXT TO SPEECH
==================================================
*/

function speak(text){

    return new Promise(resolve=>{

        if(!("speechSynthesis" in window)){

            resolve();
            return;

        }

        speechSynthesis.cancel();

        const utterance =
            new SpeechSynthesisUtterance(text);

        utterance.lang="cs-CZ";
        utterance.rate=1;
        utterance.pitch=1;
        utterance.volume=1;

        speaking=true;

        setStatus(
            "Ouško odpovídá...",
            "speaking"
        );

        utterance.onend=()=>{

            speaking=false;

            resolve();

            if(running){
                waitForWakeWord();
            }

        };

        utterance.onerror=()=>{

            speaking=false;

            resolve();

            if(running){
                waitForWakeWord();
            }

        };

        speechSynthesis.speak(
            utterance
        );

    });

}


/*
==================================================
  NORMALIZACE
==================================================
*/

function normalize(text){

    return text
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .trim();

}


/*
==================================================
  WAKE WORD
==================================================
*/

function isWakeWord(text){

    const t=normalize(text);

    return (
        t.includes("hey ousko") ||
        t.includes("hej ousko") ||
        t.includes("hey ousku") ||
        t.includes("hej ousku") ||
        t.includes("ousko")
    );

}


/*
==================================================
  VYTAŽENÍ OTÁZKY ZA WAKE WORD
==================================================
*/

function removeWakeWord(text){

    return text
        .replace(
            /hey\s+ouško/gi,
            ""
        )
        .replace(
            /hej\s+ouško/gi,
            ""
        )
        .replace(
            /hey\s+oušku/gi,
            ""
        )
        .replace(
            /hej\s+oušku/gi,
            ""
        )
        .replace(
            /ouško/gi,
            ""
        )
        .trim();

}


/*
==================================================
  VYTVOŘENÍ RECOGNITION
==================================================
*/

function createRecognition(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        setStatus(
            "Tento prohlížeč nepodporuje rozpoznávání hlasu."
        );

        startButton.disabled=true;

        return false;

    }

    recognition =
        new SpeechRecognition();

    recognition.lang="cs-CZ";

    recognition.continuous=true;

    recognition.interimResults=false;

    recognition.maxAlternatives=1;


    recognition.onstart=()=>{

        if(!running) return;

        setStatus(
            "Čekám na „Hey Ouško“...",
            "ready"
        );

    };


    recognition.onresult=async event=>{

        if(!running) return;

        const result =
            event.results[
                event.results.length-1
            ];

        if(!result.isFinal) return;

        const text =
            result[0].transcript.trim();

        console.log(
            "Ouško slyšelo:",
            text
        );


        /*
        ------------------------------------------
        ČEKÁME NA HEY OUŠKO
        ------------------------------------------
        */

        if(!listeningForCommand){

            if(isWakeWord(text)){

                listeningForCommand=true;

                setStatus(
                    "👂 Poslouchám...",
                    "listening"
                );

                showAnswer(
                    "Slyším tě. 🦊"
                );

                /*
                Pokud byla otázka rovnou za
                „Hey Ouško“, zpracujeme ji.
                */

                const command =
                    removeWakeWord(text);

                if(command){

                    await processCommand(
                        command
                    );

                }

            }

            return;

        }


        /*
        ------------------------------------------
        UŽ JSME AKTIVNÍ
        ------------------------------------------
        */

        await processCommand(text);

    };


    recognition.onerror=event=>{

        console.log(
            "Recognition error:",
            event.error
        );

        if(
            event.error==="not-allowed"
        ){

            running=false;

            setStatus(
                "Mikrofon nebyl povolen."
            );

            startButton.disabled=false;

            startButton.textContent=
                "🎤 Povolit mikrofon a spustit Ouška";

            return;

        }

        if(
            event.error==="aborted"
        ){

            return;

        }

    };


    recognition.onend=()=>{

        /*
        Pokud Ouško běží, znovu posloucháme.
        Toto není nové žádání o povolení —
        oprávnění už bylo uděleno.
        */

        if(
            running &&
            !speaking
        ){

            setTimeout(()=>{

                try{

                    recognition.start();

                }catch(e){

                    console.log(e);

                }

            },300);

        }

    };


    return true;

}


/*
==================================================
  ČEKÁNÍ NA WAKE WORD
==================================================
*/

function waitForWakeWord(){

    if(!running) return;

    listeningForCommand=false;

    setStatus(
        "Čekám na „Hey Ouško“...",
        "ready"
    );

}


/*
==================================================
  ZPRACOVÁNÍ PŘÍKAZU
==================================================
*/

async function processCommand(text){

    if(!text){

        listeningForCommand=false;

        return;

    }

    listeningForCommand=false;

    setStatus(
        "🧠 Ouško přemýšlí...",
        "listening"
    );

    showAnswer(
        "Přemýšlím... 🦊"
    );


    let response;

    try{

        if(
            typeof window.ouskoAI==="function"
        ){

            response =
                await window.ouskoAI(
                    text
                );

        }else{

            response =
                "Ouško AI se nepodařilo načíst.";

        }

    }catch(error){

        console.error(error);

        response =
            "Promiň, něco se pokazilo. 🦊";

    }


    showAnswer(response);

    await speak(response);

}


/*
==================================================
  SPUŠTĚNÍ
==================================================
*/

async function startOusko(){

    if(running) return;

    if(!recognition){

        const ok =
            createRecognition();

        if(!ok) return;

    }


    /*
    První spuštění musí být vyvolané
    kliknutím uživatele.
    Tady prohlížeč požádá o mikrofon.
    */

    try{

        running=true;

        listeningForCommand=false;

        setStatus(
            "Spouštím Ouška...",
            "ready"
        );

        startButton.disabled=true;

        startButton.textContent=
            "🦊 Ouško běží";

        recognition.start();

    }catch(error){

        console.error(error);

        running=false;

        startButton.disabled=false;

        startButton.textContent=
            "🎤 Povolit mikrofon a spustit Ouška";

        setStatus(
            "Nepodařilo se spustit mikrofon."
        );

    }

}


startButton.addEventListener(
    "click",
    startOusko
);


/*
==================================================
  STARTOVNÍ NASTAVENÍ
==================================================
*/

setStatus(
    "Mikrofon není povolen"
);

</script>

</body>
</html>
