<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>TV Clock Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
    font-family: 'Montserrat', sans-serif;
}

#container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: white;
    text-shadow: 0 0 15px black;
}

#time {
    font-size: 140px;
    font-weight: 700;
    letter-spacing: 2px;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* pevný box bez pohybu */
.digit {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    min-width: 80px;
    height: 150px;
    position: relative;
    overflow: hidden;
}

/* animovaný vnitřek */
.inner {
    position: absolute;
    width: 100%;
    text-align: center;
}

.slide-in {
    animation: slideIn 0.2s forwards;
}

.slide-out {
    animation: slideOut 0.2s forwards;
}

@keyframes slideOut {
    from { transform: translateY(0); opacity: 1; }
    to   { transform: translateY(-40%); opacity: 0; }
}

@keyframes slideIn {
    from { transform: translateY(40%); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
}

.colon {
    width: 40px;
}

#date, #weekday {
    font-weight: 700;
    letter-spacing: 1px;
}

#date {
    font-size: 38px;
    margin-top: 15px;
}

#weekday {
    font-size: 28px;
    margin-top: 5px;
}
</style>
</head>

<body>
<div id="container">
    <div id="time">
        <span class="digit"><span id="h1" class="inner"></span></span>
        <span class="digit"><span id="h2" class="inner"></span></span>
        <span class="colon">:</span>
        <span class="digit"><span id="m1" class="inner"></span></span>
        <span class="digit"><span id="m2" class="inner"></span></span>
        <span class="colon">:</span>
        <span class="digit"><span id="s1" class="inner"></span></span>
        <span class="digit"><span id="s2" class="inner"></span></span>
    </div>

    <div id="weekday"></div>
    <div id="date"></div>
</div>

<script>
const days = ["neděle","pondělí","úterý","středa","čtvrtek","pátek","sobota"];
let last = {};

function setDigit(id, val) {
    const el = document.getElementById(id);

    if (last[id] !== val) {
        const old = el.innerText;

        el.classList.remove("slide-in");
        el.classList.add("slide-out");

        setTimeout(() => {
            el.innerText = val;
            el.classList.remove("slide-out");
            el.classList.add("slide-in");
        }, 100);

        last[id] = val;
    }
}

function update() {
    const now = new Date();

    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');

    setDigit("h1", h[0]);
    setDigit("h2", h[1]);
    setDigit("m1", m[0]);
    setDigit("m2", m[1]);
    setDigit("s1", s[0]);
    setDigit("s2", s[1]);

    const d = String(now.getDate()).padStart(2,'0');
    const mo = String(now.getMonth()+1).padStart(2,'0');
    const y = now.getFullYear();

    document.getElementById("date").innerText = `${d}.${mo}.${y}`;
    document.getElementById("weekday").innerText = days[now.getDay()];
}

update();
setInterval(update, 1000);
</script>

</body>
</html>
